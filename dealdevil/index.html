<title>DealDevil</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif&display=swap">
<style>
/* Layout: one column set like a good menu. A heavy Local/Anywhere switch, one quiet control line, then category drawers whose rows read item on the left, price on the right in a mono column. Verified deals only; everything else waits in To verify. */
:root{
  --bg:#F2F0EB; --surface:#FAF9F6; --raised:#FFFFFF; --ink:#19181C; --ink-2:#46444C; --muted:#78757E; --faint:#A8A5AC;
  --line:#E3E0D8; --line-2:#D3CFC5; --garnet:#7D1E2C; --on-garnet:#FFFFFF; --garnet-wash:#F4E8E8;
  --live:#2C6A4A; --live-wash:#E2EEE6; --seal:#6E5B2A; --warn:#93580E; --warn-wash:#F5EBDC;
  --shadow:0 1px 2px rgba(25,24,28,.05),0 10px 30px rgba(25,24,28,.07);
  --scrim:rgba(20,18,22,.38);
  --serif:"Instrument Serif","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --sans:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F0F11; --surface:#141417; --raised:#1B1B1F; --ink:#EDEBE6; --ink-2:#C3C0B9; --muted:#8C8991; --faint:#5D5B62;
  --line:#25242A; --line-2:#33323A; --garnet:#E07B8C; --on-garnet:#1C0A0E; --garnet-wash:#2A171C;
  --live:#6CC69B; --live-wash:#13251B; --seal:#CDB27A; --warn:#E2A956; --warn-wash:#2A2013;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 34px rgba(0,0,0,.45); --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F0F11; --surface:#141417; --raised:#1B1B1F; --ink:#EDEBE6; --ink-2:#C3C0B9; --muted:#8C8991; --faint:#5D5B62;
  --line:#25242A; --line-2:#33323A; --garnet:#E07B8C; --on-garnet:#1C0A0E; --garnet-wash:#2A171C;
  --live:#6CC69B; --live-wash:#13251B; --seal:#CDB27A; --warn:#E2A956; --warn-wash:#2A2013;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 34px rgba(0,0,0,.45); --scrim:rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
html.locked{overflow:hidden}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;font-feature-settings:"ss01"}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--garnet);outline-offset:2px;border-radius:6px}
.wrap{max-width:620px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.i-s{width:14px;height:14px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* Masthead */
.mast{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 14px}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:28px;height:28px;flex:none}
.brand b{font:400 31px/1 var(--serif);letter-spacing:-.01em}
.brand b i{font-style:italic;color:var(--garnet)}
.mast-actions{display:flex;gap:4px}
.ibtn{display:inline-grid;place-items:center;position:relative;width:42px;height:42px;border:0;border-radius:12px;background:transparent;color:var(--ink-2)}
.ibtn:hover{background:var(--surface)}
.ibtn[aria-pressed="true"]{color:var(--garnet);background:var(--garnet-wash)}
.ibtn[aria-pressed="true"] .i{fill:currentColor}
.ibtn .dot{position:absolute;top:8px;right:8px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--garnet);color:var(--on-garnet);font:600 10px/16px var(--sans);text-align:center}

/* Scope switch */
.scope{position:relative;display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:18px;background:var(--line);isolation:isolate}
.scope button{position:relative;z-index:1;display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:62px;padding:10px 16px;border:0;border-radius:14px;background:transparent;text-align:left;color:var(--muted);transition:color .2s}
.scope button b{font:600 17px/1.1 var(--sans);letter-spacing:-.01em}
.scope button small{font-size:12.5px;line-height:1.2;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.scope button[aria-selected="true"]{color:var(--ink)}
.scope-thumb{position:absolute;z-index:0;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:14px;background:var(--raised);box-shadow:var(--shadow);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.scope[data-scope="anywhere"] .scope-thumb{transform:translateX(100%)}

/* Control line */
.controls{display:flex;flex-wrap:wrap;gap:8px;padding-block:14px 4px}
.pick{position:relative;display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 12px;border:1px solid var(--line-2);border-radius:11px;background:var(--raised);font-size:14px;font-weight:500;color:var(--ink);max-width:100%}
.pick .i{color:var(--muted)}
.pick select{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer;font-size:16px}
.pick span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.searchbar{display:flex;align-items:center;gap:8px;height:44px;padding:0 12px;margin-top:12px;border:1px solid var(--line-2);border-radius:12px;background:var(--raised);color:var(--muted)}
.searchbar input{flex:1;min-width:0;height:100%;border:0;outline:0;background:transparent;color:var(--ink);font-size:16px;-webkit-appearance:none;appearance:none}
.summary{margin:14px 2px 0;color:var(--muted);font-size:13.5px}
.summary b{color:var(--ink);font-weight:600}
.summary .on{color:var(--live);font-weight:600}

/* Drawers */
main{padding-bottom:8px}
.group{margin-top:10px}
.group-h{display:flex;align-items:center;gap:10px;width:100%;min-height:54px;padding:0 4px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left}
.group:first-child .group-h{border-top-color:transparent}
.g-name{flex:1;font:600 15.5px/1.2 var(--sans);letter-spacing:-.005em}
.g-meta{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
.g-meta .on{color:var(--live);font-weight:500}
.g-meta .n{font-family:var(--mono);font-size:12.5px;min-width:18px;text-align:right}
.chev{transition:transform .2s;color:var(--faint)}
.group-h[aria-expanded="true"] .chev{transform:rotate(180deg)}
.group-b{border:1px solid var(--line);border-radius:16px;background:var(--raised);overflow:hidden;margin-bottom:8px}
.group.verify .group-h{border-top-style:dashed}
.group.verify .g-name{color:var(--ink-2)}
.verify-intro{margin:0;padding:14px 16px;border-bottom:1px solid var(--line);color:var(--muted);font-size:13.5px;background:var(--surface)}

.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;align-items:start;width:100%;padding:14px 16px;border:0;background:transparent;text-align:left}
.row + .row{border-top:1px solid var(--line)}
.row:hover{background:var(--surface)}
.row:active{background:var(--bg)}
.row.dim .r-item,.row.dim .r-price b{color:var(--muted)}
.r-main{display:flex;flex-direction:column;gap:3px;min-width:0}
.r-item{font-weight:560;font-size:16px;line-height:1.3;letter-spacing:-.01em;overflow-wrap:anywhere}
.r-item .heart{display:inline-block;width:12px;height:12px;margin-left:6px;vertical-align:1px;fill:var(--garnet);stroke:none}
.r-venue{color:var(--ink-2);font-size:13.5px;line-height:1.35;overflow-wrap:anywhere}
.r-venue .sep,.r-when .sep{color:var(--faint);padding:0 5px}
.r-when{display:flex;flex-wrap:wrap;align-items:center;gap:2px 0;margin-top:3px;font-size:12.5px;color:var(--muted)}
.r-price{display:flex;flex-direction:column;align-items:flex-end;text-align:right;padding-top:1px;max-width:118px}
.r-price b{font:600 17px/1.2 var(--sans);font-variant-numeric:tabular-nums lining-nums;letter-spacing:-.015em;color:var(--ink);white-space:nowrap}
.r-price small{font-size:11.5px;color:var(--muted);line-height:1.25;margin-top:3px}
.nw{display:inline-flex;align-items:center;white-space:nowrap}
.st{display:inline-flex;align-items:center;gap:6px;font-weight:500}
.st.live{color:var(--live)}
.st.live::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 0 3px var(--live-wash)}
.st.later{color:var(--ink-2)}
.st.ended{color:var(--faint)}
.seal{display:inline-flex;align-items:center;gap:4px;color:var(--seal);font-weight:500}
.flag{display:inline-flex;align-items:center;gap:4px;color:var(--warn);font-weight:500}
.member{display:inline-flex;align-items:center;height:19px;padding:0 7px;border:1px solid var(--line-2);border-radius:6px;font-size:11.5px;font-weight:500;color:var(--ink-2);white-space:nowrap}
.d-price .member{align-self:center}
.quote{margin:4px 0 2px;padding:2px 0 2px 12px;border-left:2px solid var(--seal);font:400 17px/1.4 var(--serif);color:var(--ink);overflow-wrap:anywhere}

.empty{margin-top:22px;padding:28px 22px;border:1px solid var(--line);border-radius:16px;background:var(--surface);text-align:center}
.empty h3{margin:0 0 6px;font:400 26px/1.15 var(--serif);text-wrap:balance}
.empty p{margin:0 auto;max-width:38ch;color:var(--muted)}
.empty .actions{justify-content:center;margin-top:16px}
.quiet-note{margin:14px 4px 0;color:var(--faint);font-size:12.5px}
.note{display:flex;gap:10px;align-items:flex-start;margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--warn-wash);color:var(--ink);font-size:13.5px}
.note .i{color:var(--warn);margin-top:2px}
.skel{height:76px;border-top:1px solid var(--line);background:linear-gradient(90deg,transparent,var(--surface),transparent) 0 0/200% 100%;animation:sheen 1.3s linear infinite}
.skel:first-child{border-top:0}
.foot{padding-top:22px;padding-bottom:calc(112px + env(safe-area-inset-bottom,0px));color:var(--muted);font-size:12.5px;display:flex;flex-direction:column;gap:6px}
.linkish{border:0;background:none;padding:0;color:var(--ink-2);font-weight:500;text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px}

/* Add button */
.fab{position:fixed;z-index:25;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:8px;height:52px;padding:0 20px 0 16px;border:0;border-radius:16px;background:var(--ink);color:var(--bg);font-weight:600;font-size:15px;box-shadow:var(--shadow)}

/* Sheets */
.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.sheet{position:fixed;z-index:50;left:0;right:0;bottom:0;max-height:calc(100% - 28px - env(safe-area-inset-top,0px));overflow-y:auto;overscroll-behavior:contain;background:var(--raised);border-radius:22px 22px 0 0;padding-top:10px;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));box-shadow:var(--shadow);animation:up .24s cubic-bezier(.2,.8,.2,1)}
.sheet-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line-2);margin:0 auto -4px}
.eyebrow{margin:0;font:500 11.5px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.sheet h2{margin:6px 0 0;font:400 34px/1.05 var(--serif);letter-spacing:-.01em;text-wrap:balance;overflow-wrap:anywhere}
.d-price{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.d-price b{font:600 30px/1 var(--sans);font-variant-numeric:tabular-nums lining-nums;letter-spacing:-.025em}
.d-price span{color:var(--muted);font-size:14px}
.d-place{display:flex;flex-direction:column;gap:2px;font-size:15px}
.d-place strong{font-weight:600}
.d-place span{color:var(--muted);font-size:14px}
.block{border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:10px}
.block h4{margin:0;font:500 11.5px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.week span{height:36px;display:grid;place-items:center;border-radius:9px;border:1px solid var(--line);color:var(--faint);font:500 12px/1 var(--sans)}
.week span.on{background:var(--ink);border-color:var(--ink);color:var(--raised)}
.week span.today{box-shadow:0 0 0 2px var(--raised),0 0 0 3.5px var(--garnet)}
.sched{font-size:15px;color:var(--ink)}
.conds{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
.conds li{position:relative;padding-left:16px;font-size:14.5px;color:var(--ink-2)}
.conds li::before{content:"";position:absolute;left:2px;top:.62em;width:5px;height:1.5px;background:var(--faint)}
.vcard{padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:6px;font-size:14px}
.vcard .vt{display:flex;align-items:center;gap:8px;font-weight:600}
.vcard.ok .vt{color:var(--seal)}
.vcard.pend{background:var(--warn-wash);border-color:transparent}
.vcard.pend .vt{color:var(--warn)}
.vcard p{margin:0;color:var(--ink-2);line-height:1.5}
.vcard a{font-weight:500;overflow-wrap:anywhere}
.vcard .sub{color:var(--muted);font-size:13px}
.ev{margin:4px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.ev li{display:flex;justify-content:space-between;gap:10px;font-size:13.5px}
.ev li span{color:var(--muted);white-space:nowrap}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions > *{flex:1 1 130px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 16px;border-radius:13px;border:1px solid var(--line-2);background:var(--raised);color:var(--ink);font-weight:550;font-size:15px;text-decoration:none}
.btn:hover{background:var(--surface)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--raised)}
.btn.accent{background:var(--garnet);border-color:var(--garnet);color:var(--on-garnet)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.danger{border-color:transparent;background:transparent;color:var(--garnet)}
.btn.danger.armed{background:var(--garnet);color:var(--on-garnet)}
.btn[aria-pressed="true"] .i{fill:var(--garnet);stroke:var(--garnet)}
.btn[disabled]{opacity:.5;pointer-events:none}
.minor{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.minor .btn{flex:0 1 auto;min-height:42px}

/* Forms */
form{display:flex;flex-direction:column;gap:16px}
.f{display:flex;flex-direction:column;gap:7px;font-weight:500;font-size:13.5px;color:var(--ink-2);min-width:0;border:0;margin:0;padding:0}
.f legend{padding:0;margin-bottom:7px}
.f input,.f textarea,.f select{width:100%;min-height:48px;padding:12px 14px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-size:16px;font-weight:400}
.f select{-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 15px) 21px;background-size:5px 5px;background-repeat:no-repeat}
.f textarea{resize:vertical;min-height:76px}
.f input:focus,.f textarea:focus,.f select:focus{border-color:var(--ink);outline:none}
.f .hint{font-weight:400;color:var(--muted);font-size:12.5px}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:13px;background:var(--line)}
.seg2 button{min-height:40px;border:0;border-radius:10px;background:transparent;font-weight:550;color:var(--muted)}
.seg2 button[aria-pressed="true"]{background:var(--raised);color:var(--ink);box-shadow:var(--shadow)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.days button{height:44px;border-radius:11px;border:1px solid var(--line-2);background:var(--surface);font-weight:550;font-size:13px}
.days button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--raised)}
.presets{display:flex;gap:16px;margin-top:9px;font-size:13px}
.err{margin:0;padding:11px 14px;border-radius:11px;background:var(--garnet-wash);color:var(--garnet);font-weight:500;font-size:14px}
.sugg{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:2px}
.sugg button,.places button{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:46px;padding:0 14px;border:0;background:var(--raised);text-align:left;font-size:15px;font-weight:500}
.sugg button + button,.places button + button{border-top:1px solid var(--line)}
.sugg button span,.places button span{color:var(--muted);font-weight:400;font-size:13px}
.places{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.places button[aria-current="true"]{color:var(--garnet)}

.toast{position:fixed;z-index:60;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:16px;max-width:calc(100% - 36px);padding:12px 16px;border-radius:13px;background:var(--ink);color:var(--raised);font-size:14px;font-weight:500;box-shadow:var(--shadow)}
.toast button{border:0;background:none;padding:0;color:var(--raised);font-weight:600;text-decoration:underline;text-underline-offset:3px}

@keyframes sheen{to{background-position:-200% 0}}
@keyframes up{from{translate:0 24px;opacity:0}to{translate:0 0;opacity:1}}
@media (min-width:700px){.sheet{left:50%;right:auto;width:620px;margin-left:-310px;bottom:18px;border-radius:22px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <header class="mast">
    <div class="brand">
      <svg viewBox="0 0 28 28" aria-hidden="true"><path d="M8.2 9.6C7.4 6.9 6.1 5.2 4.6 3.9M19.8 9.6c.8-2.7 2.1-4.4 3.6-5.7" fill="none" stroke="var(--garnet)" stroke-width="1.7" stroke-linecap="round"/><circle cx="14" cy="16.5" r="8.2" fill="none" stroke="var(--ink)" stroke-width="1.7"/><path d="M14 12.4v8.2M11.4 14.2c0-1 1.1-1.6 2.6-1.6s2.6.6 2.6 1.6-1.1 1.4-2.6 1.6-2.6.7-2.6 1.7 1.1 1.6 2.6 1.6 2.6-.6 2.6-1.6" fill="none" stroke="var(--garnet)" stroke-width="1.5" stroke-linecap="round"/></svg>
      <b>Deal<i>Devil</i></b>
    </div>
    <div class="mast-actions">
      <button id="searchBtn" class="ibtn" type="button" aria-pressed="false" aria-label="Search deals"></button>
      <button id="savedBtn" class="ibtn" type="button" aria-pressed="false" aria-label="Show saved deals only"></button>
    </div>
  </header>

  <div class="scope" id="scope" role="tablist" aria-label="Where" data-scope="local">
    <span class="scope-thumb" aria-hidden="true"></span>
    <button type="button" role="tab" data-scope="local" aria-selected="true"><b>Local</b><small id="localSub">Near you</small></button>
    <button type="button" role="tab" data-scope="anywhere" aria-selected="false"><b>Anywhere</b><small>Chain deals, wherever you are</small></button>
  </div>

  <div class="controls" id="controls"></div>
  <div id="searchRow" hidden><label class="searchbar" for="q"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg><input id="q" type="search" placeholder="Item, place or town" autocomplete="off" enterkeyhint="search"></label></div>
  <p class="summary" id="summary"></p>
</div>

<main class="wrap" id="feed" aria-live="polite"></main>
<footer class="wrap foot" id="foot"></footer>

<button id="fab" class="fab" type="button" hidden><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add a deal</button>
<div id="scrim" class="scrim" hidden></div>
<section id="sheet" class="sheet" role="dialog" aria-modal="true" aria-label="Deal" tabindex="-1" hidden></section>
<div id="toast" class="toast" role="status" hidden></div>

<script>
(() => {
'use strict';

/* ---------- Constants ---------- */
const CATS = [
  {id:'food', label:'Food'}, {id:'drinks', label:'Drinks'}, {id:'grocery', label:'Grocery'},
  {id:'coffee', label:'Coffee & Sweets'}, {id:'fun', label:'Fun & Nightlife'},
  {id:'gas', label:'Gas & Car'}, {id:'shop', label:'Shopping & Services'}
];
const CAT = Object.fromEntries(CATS.map(c => [c.id, c]));
const catOf = d => d.category === 'happy' ? 'drinks' : (CAT[d.category] ? d.category : 'shop');
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DOWL = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const ALL_DAYS = [0,1,2,3,4,5,6];
const DEFAULT_HOME = {name:'Ronkonkoma', state:'NY', lat:40.815, lng:-73.112};
const RADII = [5, 10, 25, 50, 100, 0];
const METHOD = {website:'Business website', instagram:'Instagram', facebook:'Facebook', 'in-person':'In person'};
const REASON = {
  'conflict':'Sources disagree', 'third-party':'Third-party only', 'not-on-site':'Not on business site',
  'scanner-official':'Found on business site', 'not-found':'No longer on business site', 'unreachable':'Business site unreachable',
  'stale':'Check is out of date', 'awaiting-page-check':'Waiting for a page check', 'negated':'Business page says it ended'
};
const STALE_DAYS = {local: 14, anywhere: 30};
// Words that don't name an item on their own (same rule as the scanner).
const GENERIC = new Set(('and with for our any all the from only get each per off price priced half day days night nights daily every weekly week special specials deal deals discount discounts save savings sale happy hour hours menu bar drinks drink cocktails cocktail beer beers wine wines apps appetizers appetizer app food select well drafts draft bottles bottle shots shot mixed everything items item entrees entree desserts dessert house order orders purchase until til close great new more also plus including available served start starts enjoy late early seasonal signature specialty premium domestic imported craft local tap taps pint pints glass glasses bucket buckets pitcher pitchers liquor spirits booze bites snacks small plates plate offer offers promo promotion').split(' '));
const FALLBACK_PLACES = `Ronkonkoma|NY|40.815|-73.112|19
Patchogue|NY|40.766|-73.015|12
Huntington|NY|40.868|-73.426|18
Huntington Station|NY|40.853|-73.411|33
Smithtown|NY|40.856|-73.201|26
Commack|NY|40.843|-73.293|36
Bay Shore|NY|40.725|-73.245|27
Babylon|NY|40.696|-73.326|12
North Babylon|NY|40.716|-73.322|17
Port Jefferson|NY|40.946|-73.069|8
Stony Brook|NY|40.926|-73.141|14
Riverhead|NY|40.917|-72.662|14
Mattituck|NY|40.991|-72.534|4
Holbrook|NY|40.812|-73.078|27
Bohemia|NY|40.769|-73.115|10
Melville|NY|40.793|-73.415|19
Sayville|NY|40.736|-73.082|16
New York City|NY|40.714|-74.006|8804`;

const ICON = {
  search:'<circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/>',
  heart:'<path d="M12 20.3S3.5 15.4 3.5 9.4A4.4 4.4 0 0 1 12 7.1a4.4 4.4 0 0 1 8.5 2.3c0 6-8.5 10.9-8.5 10.9z"/>',
  pin:'<path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.2"/>',
  cal:'<rect x="4" y="5" width="16" height="15" rx="2.5"/><path d="M4 10h16M9 3v4M15 3v4"/>',
  radius:'<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="2"/>',
  chev:'<path d="m6 9 6 6 6-6"/>',
  seal:'<path d="m12 3 2.2 1.6 2.7-.1.9 2.6 2.2 1.6-.8 2.6.8 2.6-2.2 1.6-.9 2.6-2.7-.1L12 21l-2.2-1.6-2.7.1-.9-2.6L4 15.3l.8-2.6L4 10.1l2.2-1.6.9-2.6 2.7.1z"/><path d="m8.8 12.2 2.2 2.2 4.2-4.4"/>',
  alert:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7.8v5M12 16.2v.01"/>',
  arrow:'<path d="M7 17 17 7M9 7h8v8"/>',
  globe:'<circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.5 2.4 3.6 5.3 3.6 8.5S14.5 18.1 12 20.5M12 3.5C9.5 5.9 8.4 8.8 8.4 12s1.1 6.1 3.6 8.5"/>',
  edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',
  trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  x:'<path d="M6 6l12 12M18 6 6 18"/>',
  undo:'<path d="M9 14 4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3"/>',
  plus:'<path d="M12 5v14M5 12h14"/>'
};
const icon = (n, cls = '') => `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICON[n] || ''}</svg>`;

/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl = u => (typeof u === 'string' && /^https?:\/\/[^\s]+$/i.test(u.trim())) ? u.trim() : null;
const hostOf = u => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return ''; } };
const pathOf = u => { try { return new URL(u).pathname.replace(/\/$/, ''); } catch (e) { return ''; } };
const LS = {
  get(k){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const pad = n => String(n).padStart(2, '0');
const isoDay = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseDay = s => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ''); return m ? new Date(+m[1], +m[2]-1, +m[3]) : null; };
const toMin = t => { const m = /^(\d{1,2}):(\d{2})/.exec(t || ''); return m ? (+m[1])*60 + (+m[2]) : null; };
function t12(t, withMer = true){
  const m = toMin(t); if (m == null) return '';
  const h = Math.floor(m/60) % 24, mm = m % 60, h12 = ((h + 11) % 12) + 1;
  return h12 + (mm ? ':' + pad(mm) : '') + (withMer ? (h < 12 ? ' AM' : ' PM') : '');
}
const merOf = t => { const m = toMin(t); return m == null ? '' : (Math.floor(m/60) % 24 < 12 ? 'AM' : 'PM'); };
function longDate(s){ const d = parseDay(s); return d ? d.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'}) : ''; }
function daysOf(d){ return Array.isArray(d.days) && d.days.length ? d.days.filter(n => n >= 0 && n <= 6) : ALL_DAYS; }
function daysText(days, long){
  const k = [...days].sort().join('');
  if (k === '0123456') return 'Daily';
  if (k === '12345') return 'Weekdays';
  if (k === '06') return 'Weekends';
  const ordered = [...days].sort((a,b) => ((a+6)%7) - ((b+6)%7));
  if (ordered.length === 1) return long ? DOWL[ordered[0]] + 's' : DOW[ordered[0]];
  return ordered.map(n => DOW[n]).join(long ? ', ' : ' · ');
}
function hoursText(d){
  if (d.hoursKnown === false) return 'hours vary';
  if (!d.start) return 'all day';
  if (!d.end) return 'from ' + t12(d.start);
  return merOf(d.start) === merOf(d.end) ? t12(d.start, false) + '–' + t12(d.end) : t12(d.start) + '–' + t12(d.end);
}
function haversine(a, b){
  if (!a || !b || typeof a.lat !== 'number' || typeof b.lat !== 'number') return null;
  const R = 3958.8, r = x => x * Math.PI / 180;
  const dLat = r(b.lat - a.lat), dLng = r(b.lng - a.lng);
  const h = Math.sin(dLat/2)**2 + Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
const milesText = mi => mi == null ? '' : mi < 0.8 ? 'nearby' : (mi < 10 ? mi.toFixed(1) : Math.round(mi)) + ' mi';
// A verification goes stale: local deals after 14 days, chain deals after 30. Stale deals wait in To verify.
function verOf(d){
  const v = d.verification || {};
  if (v.status !== 'verified') return v;
  const c = parseDay(v.checkedAt);
  if (!c) return v;
  const lim = STALE_DAYS[scopeOf(d)], age = Math.floor((Date.now() - c.getTime()) / 864e5);
  if (age <= lim) return v;
  return Object.assign({}, v, {status: 'pending', reason: 'stale',
    note: `Last checked ${longDate(v.checkedAt)}, over ${lim} days ago. ${scopeOf(d) === 'local' ? 'Local deals' : 'Chain deals'} need a fresh check every ${lim} days.`});
}
const isVerified = d => verOf(d).status === 'verified';
const scopeOf = d => d.scope === 'anywhere' ? 'anywhere' : 'local';
function namesAnItem(item){ return (String(item || '').toLowerCase().match(/[a-z][a-z'’&-]+/g) || []).some(w => w.length >= 3 && !GENERIC.has(w.replace(/['’-]/g, ''))); }

/* ---------- State ---------- */
const view = LS.get('dd2:view') || {};
const state = {
  deals: [], synced: false, conn: 'loading',
  scope: view.scope === 'anywhere' ? 'anywhere' : 'local',
  day: typeof view.day === 'string' ? view.day : 'today',
  radius: RADII.includes(view.radius) ? view.radius : 25,
  open: Object.assign({verify: false}, view.open || {}),
  q: '', searchOpen: false, savedOnly: false, showRemoved: false,
  home: DEFAULT_HOME, homeSet: false, saved: {},
  canEdit: false, uid: null, sheet: null, openId: null, verifyOpen: false
};
let db = null, user = null, prefsRef = null;
const saveView = () => LS.set('dd2:view', {scope: state.scope, day: state.day, radius: state.radius, open: state.open});
const cached = LS.get('dd2:deals'); if (Array.isArray(cached)) state.deals = cached;
function applyPrefs(p){
  if (!p || typeof p !== 'object') return;
  if (p.home && typeof p.home === 'object' && typeof p.home.lat === 'number') state.home = {name: String(p.home.name || ''), state: String(p.home.state || ''), lat: p.home.lat, lng: p.home.lng};
  if (p.homeSet) state.homeSet = true;
  if (p.saved && typeof p.saved === 'object') state.saved = Object.assign({}, p.saved);
}
applyPrefs(LS.get('dd2:prefs'));

/* ---------- Places (loaded only when a picker opens) ---------- */
let PLACES = null, placesP = null;
function parsePlaces(txt){
  return txt.split('\n').map(l => l.split('|')).filter(p => p.length >= 4).map(p => ({name: p[0], state: p[1], lat: +p[2], lng: +p[3], pop: +(p[4] || 1), key: p[0].toLowerCase()}));
}
function loadPlaces(){
  if (PLACES) return Promise.resolve(PLACES);
  if (!placesP) placesP = fetch('places.txt').then(r => r.ok ? r.text() : Promise.reject(r.status))
    .then(t => (PLACES = parsePlaces(t))).catch(() => (PLACES = parsePlaces(FALLBACK_PLACES)));
  return placesP;
}
function searchPlaces(q, limit){
  const list = PLACES || parsePlaces(FALLBACK_PLACES);
  const [namePart, stPart] = q.toLowerCase().split(',').map(s => (s || '').trim());
  if (!namePart) return list.slice(0, limit);
  const hits = [];
  for (const p of list){
    if (stPart && !p.state.toLowerCase().startsWith(stPart)) continue;
    const i = p.key.indexOf(namePart);
    if (i === 0) hits.push([0, p]); else if (i > 0) hits.push([1, p]);
  }
  hits.sort((a, b) => a[0] - b[0] || b[1].pop - a[1].pop);
  return hits.slice(0, limit).map(h => h[1]);
}

/* ---------- Day logic ---------- */
function target(now){
  if (state.day === 'any') return null;
  const dow = now.getDay();
  let tDow, offset;
  if (state.day === 'today'){ tDow = dow; offset = 0; }
  else if (state.day === 'tomorrow'){ tDow = (dow + 1) % 7; offset = 1; }
  else { tDow = +state.day; offset = (tDow - dow + 7) % 7; }
  const date = new Date(now); date.setDate(now.getDate() + offset);
  return {dow: tDow, offset, iso: isoDay(date), isToday: offset === 0};
}
function runsOn(d, t, now){
  const iso = t ? t.iso : isoDay(now);
  if (d.validUntil && iso > d.validUntil) return false;
  if (!t) return true;
  if (d.validFrom && t.iso < d.validFrom) return false;
  return daysOf(d).includes(t.dow);
}
function nextOffset(d, now){
  const days = daysOf(d), dow = now.getDay();
  for (let k = 0; k < 7; k++) if (days.includes((dow + k) % 7)) return k;
  return 7;
}
function when(d, t, now){
  const s = toMin(d.start), eRaw = toMin(d.end), known = d.hoursKnown !== false;
  if (!t) { const k = nextOffset(d, now); return {state:'other', label: daysText(daysOf(d)) + ' · ' + hoursText(d), sort: k*1440 + (s || 0)}; }
  if (!t.isToday) return {state:'other', label: DOWL[t.dow] + ' · ' + hoursText(d), sort: s || 0};
  const mins = now.getHours()*60 + now.getMinutes();
  if (!known) return {state:'check', label:'Today · hours vary', sort: 900};
  if (s == null) return {state:'live', label:'All day today', sort: 1440};
  const e = eRaw == null ? 1440 : eRaw, overnight = eRaw != null && e <= s;
  const until = eRaw == null ? 'until close' : 'until ' + t12(d.end);
  if (overnight ? mins >= s : (mins >= s && mins < e)) return {state:'live', label:'On now · ' + until, sort: (e - mins + 1440) % 1440};
  const y = (t.dow + 6) % 7;
  if (overnight && daysOf(d).includes(y) && mins < e) return {state:'live', label:'On now · ' + until, sort: e - mins};
  if (mins < s) return {state:'later', label:'Starts ' + t12(d.start), sort: 2000 + s};
  return {state:'ended', label:'Ended at ' + t12(d.end), sort: 5000 + s};
}
function dayLabel(t, now){
  if (!t) return 'any day';
  if (t.isToday) return 'today';
  if (t.offset === 1) return 'tomorrow';
  return DOWL[t.dow];
}

/* ---------- Derive ---------- */
function hay(d){ return [d.item, d.price, d.venue, d.town, d.state, (CAT[catOf(d)] || {}).label, (d.conditions || []).join(' ')].join(' ').toLowerCase(); }
function derive(){
  const now = new Date(), t = target(now), q = state.q.trim().toLowerCase();
  const groups = Object.fromEntries(CATS.map(c => [c.id, []]));
  const pending = [], removed = [];
  let live = 0, total = 0;
  for (const d of state.deals){
    if (scopeOf(d) !== state.scope) continue;
    if (d.status === 'gone'){ removed.push(d); continue; }
    if (q && !hay(d).includes(q)) continue;
    if (state.savedOnly && !state.saved[d.id]) continue;
    const mi = state.scope === 'local' ? haversine(state.home, d) : null;
    if (!isVerified(d)){ pending.push({d, mi}); continue; }
    if (!runsOn(d, t, now)) continue;
    if (state.scope === 'local' && state.radius){ if (mi == null || mi > state.radius) continue; }
    const w = when(d, t, now);
    groups[catOf(d)].push({d, mi, w});
    total++; if (w.state === 'live') live++;
  }
  const rank = {live:0, later:1, check:2, other:3, ended:4};
  const byMi = (a, b) => (a.mi == null ? 1e6 : a.mi) - (b.mi == null ? 1e6 : b.mi);
  for (const k in groups) groups[k].sort((a, b) => (rank[a.w.state] - rank[b.w.state]) || (a.w.sort - b.w.sort) || byMi(a, b));
  pending.sort((a, b) => CATS.findIndex(c => c.id === catOf(a.d)) - CATS.findIndex(c => c.id === catOf(b.d)) || byMi(a, b));
  return {now, t, groups, pending, removed, live, total};
}

/* ---------- Render ---------- */
function render(){
  const v = derive();
  renderMast(); renderScope(); renderControls(v); renderSummary(v); renderFeed(v); renderFoot(v);
  $('#fab').hidden = !(state.canEdit && db);
}
function renderMast(){
  $('#searchBtn').innerHTML = icon('search');
  $('#searchBtn').setAttribute('aria-pressed', String(state.searchOpen));
  const n = Object.keys(state.saved).filter(id => state.saved[id] && state.deals.some(d => d.id === id && d.status !== 'gone')).length;
  const sb = $('#savedBtn');
  sb.setAttribute('aria-pressed', String(state.savedOnly));
  sb.innerHTML = icon('heart') + (n ? `<span class="dot">${n}</span>` : '');
  $('#searchRow').hidden = !state.searchOpen;
}
function renderScope(){
  const el = $('#scope'); el.dataset.scope = state.scope;
  for (const b of el.querySelectorAll('button')) b.setAttribute('aria-selected', String(b.dataset.scope === state.scope));
  $('#localSub').textContent = 'Near ' + state.home.name + (state.home.state ? ', ' + state.home.state : '');
}
function renderControls(v){
  const now = v.now, dow = now.getDay();
  const dayOpts = [['today', 'Today, ' + DOWL[dow]], ['tomorrow', 'Tomorrow, ' + DOWL[(dow+1)%7]]]
    .concat([1,2,3,4,5,6,0].filter(n => n !== dow && n !== (dow+1)%7).map(n => [String(n), DOWL[n]]))
    .concat([['any', 'Any day']]);
  const curDay = (dayOpts.find(o => o[0] === state.day) || dayOpts[0]);
  let html = `<label class="pick" for="daySel">${icon('cal', 'i-s')}<span>${esc(curDay[1])}</span>${icon('chev', 'i-s')}<select id="daySel" aria-label="Day">${dayOpts.map(o => `<option value="${o[0]}"${o[0] === curDay[0] ? ' selected' : ''}>${esc(o[1])}</option>`).join('')}</select></label>`;
  if (state.scope === 'local'){
    html = `<button type="button" class="pick" data-act="home">${icon('pin', 'i-s')}<span>${esc(state.home.name)}${state.home.state ? ', ' + esc(state.home.state) : ''}</span>${icon('chev', 'i-s')}</button>` + html
      + `<label class="pick" for="radSel">${icon('radius', 'i-s')}<span>${state.radius ? 'Within ' + state.radius + ' mi' : 'Any distance'}</span>${icon('chev', 'i-s')}<select id="radSel" aria-label="Distance">${RADII.map(r => `<option value="${r}"${r === state.radius ? ' selected' : ''}>${r ? 'Within ' + r + ' mi' : 'Any distance'}</option>`).join('')}</select></label>`;
  }
  $('#controls').innerHTML = html;
}
function renderSummary(v){
  const where = state.scope === 'local' ? (state.radius ? ` within ${state.radius} mi` : ' at any distance') : ' at participating locations';
  const lbl = dayLabel(v.t, v.now);
  let s = state.savedOnly ? 'Saved deals' : `<b class="num">${v.total}</b> verified deal${v.total === 1 ? '' : 's'} ${v.t ? (v.t.isToday ? 'today' : 'on ' + lbl) : 'any day'}${where}`;
  if (v.live && v.t && v.t.isToday) s += ` · <span class="on">${v.live} on now</span>`;
  $('#summary').innerHTML = s;
}
function rowHTML(x, opts = {}){
  const {d, mi, w} = x;
  const pend = opts.pending;
  const place = state.scope === 'local' ? [d.venue, d.town, milesText(mi)].filter(Boolean) : [d.venue, 'participating locations'];
  let meta;
  if (pend){
    const r = verOf(d).reason || '';
    meta = `<span class="flag">${icon('alert', 'i-s')}${esc(REASON[r] || 'Not verified')}</span><span class="nw"><span class="sep">·</span>${esc(daysText(daysOf(d)))}</span>`;
  } else {
    const ver = verOf(d);
    const vtxt = ver.method === 'website' ? (hostOf(ver.url) || 'business site') : (METHOD[ver.method] || 'verified');
    meta = `<span class="st ${w.state}">${esc(w.label)}</span><span class="nw"><span class="sep">·</span><span class="seal">${icon('seal', 'i-s')}${esc(vtxt)}</span></span>`
      + (d.loyaltyRequired ? '<span class="nw"><span class="sep">·</span><span class="member">Free member login</span></span>' : '');
  }
  return `<button type="button" class="row${w && w.state === 'ended' ? ' dim' : ''}" data-open="${esc(d.id)}">
    <span class="r-main">
      <span class="r-item">${esc(d.item || 'Untitled deal')}${state.saved[d.id] ? `<svg class="heart" viewBox="0 0 24 24" aria-label="Saved">${ICON.heart}</svg>` : ''}</span>
      <span class="r-venue">${place.map(esc).join('<span class="sep">·</span>')}</span>
      <span class="r-when">${meta}</span>
    </span>
    <span class="r-price"><b>${esc(d.price || '')}</b>${d.priceNote ? `<small>${esc(d.priceNote)}</small>` : ''}</span>
  </button>`;
}
function connNote(){
  const c = state.deals.length > 0;
  if (state.conn === 'none') return `<div class="note">${icon('alert')}<span>Open DealDevil from claude.ai while signed in to load your deals.${c ? ' Showing the copy saved on this device.' : ''}</span></div>`;
  if (state.conn === 'slow') return `<div class="note">${icon('alert')}<span>Can't reach your deals yet.${c ? ' Showing the copy saved on this device; it may be out of date.' : ''}</span></div>`;
  if (state.conn === 'error') return `<div class="note">${icon('alert')}<span>Lost the connection to your deals. Reload DealDevil to reconnect.</span></div>`;
  return '';
}
function renderFeed(v){
  let html = connNote();
  if (!state.synced && !state.deals.length && (state.conn === 'loading' || state.conn === 'slow')){
    $('#feed').innerHTML = html + `<div class="group"><div class="group-b">${'<div class="skel"></div>'.repeat(4)}</div></div>`;
    return;
  }
  const filled = CATS.filter(c => v.groups[c.id].length);
  if (!filled.length) html += emptyHTML(v);
  for (const c of filled){
    const items = v.groups[c.id], open = state.open[c.id] !== false;
    const liveN = items.filter(x => x.w.state === 'live').length;
    html += `<section class="group"><button type="button" class="group-h" data-group="${c.id}" aria-expanded="${open}">
      <span class="g-name">${esc(c.label)}</span>
      <span class="g-meta">${liveN && v.t && v.t.isToday ? `<span class="on">${liveN} on now</span>` : ''}<span class="n">${items.length}</span>${icon('chev', 'chev')}</span>
    </button>${open ? `<div class="group-b">${items.map(x => rowHTML(x)).join('')}</div>` : ''}</section>`;
  }
  if (v.pending.length){

async function submitForm(){
  const val = s => sheet.querySelector(s).value.trim();
  const err = sheet.querySelector('#f-err');
  const fail = m => { err.textContent = m; err.hidden = false; err.scrollIntoView({block: 'nearest'}); };
  const item = val('#f-item'), price = val('#f-price'), venue = val('#f-venue');
  const start = val('#f-start'), end = val('#f-end'), biz = val('#f-biz'), vm = val('#f-vm'), vu = val('#f-vu');
  if (!item) return fail('Name the item, like “Espresso martinis”.');
  if (!namesAnItem(item)) return fail(`“${item}” doesn't name a specific item. DealDevil only keeps deals like “$5 espresso martinis”, not generic happy hours.`);
  if (!price) return fail('Add the price, like $5, 50% off or BOGO.');
  if (!venue) return fail(form.scope === 'local' ? 'Add the business name.' : 'Add the brand name.');
  if (!form.days.length) return fail('Pick at least one day.');
  if (end && !start) return fail('Add a start time, or clear Until.');
  if (biz && !safeUrl(biz)) return fail('The business link needs to start with https://');
  if (vm && vm !== 'in-person' && !safeUrl(vu)) return fail('Add a link to the page or post where you confirmed it.');
  let place = null;
  if (form.scope === 'local'){
    const typed = val('#f-town');
    place = form.place && typed.toLowerCase().startsWith(String(form.place.name).toLowerCase()) ? form.place : null;
    if (!place && typed){ const hit = searchPlaces(typed, 1)[0]; if (hit && typed.toLowerCase().startsWith(hit.key)) place = hit; }
    if (!place) return fail('Pick the town from the suggestions so distance works.');
  }
  const b = form.base || {}, nowIso = new Date().toISOString(), today = isoDay(new Date());
  const keepVer = isVerified(b) && (!vm || (vm === b.verification.method && (vu || '') === (b.verification.url || '')));
  const verification = vm
    ? (keepVer ? b.verification : {status: 'verified', method: vm, via: 'you', url: vm === 'in-person' ? (safeUrl(vu) || null) : vu, checkedAt: today, note: 'Confirmed by you.', reason: null})
    : (isVerified(b) ? {status: 'pending', reason: null, note: 'Verification removed when edited.', checkedAt: today} : (b.verification || {status: 'pending', reason: null, note: 'Added by you; not verified yet.', checkedAt: today}));
  const data = {
    scope: form.scope, item, price, priceNote: val('#f-pnote') || null, venue,
    town: place ? place.name : null, state: place ? place.state : null, lat: place ? place.lat : null, lng: place ? place.lng : null,
    address: form.scope === 'local' ? (val('#f-addr') || null) : null,
    category: val('#f-cat'), days: [...form.days].sort(), start: start || null, end: end || null, hoursKnown: true,
    validFrom: b.validFrom || null, validUntil: val('#f-until') || null,
    conditions: val('#f-conds').split('\n').map(s => s.trim()).filter(Boolean),
    businessUrl: biz || null, verification, evidence: b.evidence || [], verify: b.verify || null,
    status: b.status === 'gone' ? 'gone' : 'active', addedBy: b.addedBy || 'you',
    createdAt: b.createdAt || nowIso, updatedAt: nowIso
  };
  const btn = sheet.querySelector('#f-save'); btn.disabled = true;
  try {
    if (form.id) await db.doc('deals/' + form.id).set(data); else await db.collection('deals').add(data);
    const msg = form.id ? 'Deal updated' : (vm ? 'Deal added' : 'Added to To verify');
    closeSheet(); toast(msg);
  } catch (e) { btn.disabled = false; fail(dbErr(e)); }
}

/* ---------- Writes ---------- */
function dbErr(e){
  const c = e && e.code;
  if (c === 'invalid_argument') return "Only DealDevil's owner can change deals.";
  if (c === 'quota_exceeded') return 'DealDevil is full. Delete some old deals, then try again.';
  if (c === 'resource_exhausted') return 'Too many changes at once. Wait a few seconds and try again.';
  if (c === 'revoked' || c === 'not_granted') return 'You no longer have access to change deals here.';
  return "Couldn't save. Check your connection and try again.";
}
async function patchDeal(id, patch, msg, undo){
  try { await db.doc('deals/' + id).update(Object.assign({updatedAt: new Date().toISOString()}, patch)); toast(msg, undo ? () => patchDeal(id, undo, 'Undone') : null); }
  catch (e) { toast(dbErr(e)); }
}
let prefsBusy = false, prefsDirty = false;
async function savePrefs(){
  const p = {home: state.home, homeSet: state.homeSet, saved: state.saved};
  LS.set('dd2:prefs', p);
  if (!prefsRef) return;
  if (prefsBusy){ prefsDirty = true; return; }
  prefsBusy = true;
  try { await prefsRef.set(p); } catch (e) {}
  prefsBusy = false;
  if (prefsDirty){ prefsDirty = false; savePrefs(); }
}
let toastTimer = 0;
function toast(msg, undo){
  const t = $('#toast');
  t.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button type="button" data-act="undo">Undo</button>' : ''}`;
  t.hidden = false; t._undo = undo || null;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; t._undo = null; }, undo ? 5000 : 2400);
}

/* ---------- Events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('button, [data-open]');
  if (!t) return;
  if (t.dataset.open){ openDeal(t.dataset.open); return; }
  if (t.dataset.scope){ state.scope = t.dataset.scope; saveView(); render(); return; }
  if (t.dataset.group){ const g = t.dataset.group; state.open[g] = g === 'verify' ? !state.open.verify : state.open[g] === false; saveView(); render(); return; }
  if (t.dataset.place){
    const [name, st, lat, lng] = t.dataset.place.split('|');
    state.home = {name, state: st, lat: +lat, lng: +lng}; state.homeSet = true;
    savePrefs(); closeSheet(); render(); toast('Showing deals near ' + name);
    return;
  }
  if (t.dataset.ftown && form){
    const [name, st, lat, lng] = t.dataset.ftown.split('|');
    form.place = {name, state: st, lat: +lat, lng: +lng};
    sheet.querySelector('#f-town').value = name + ', ' + st;
    sheet.querySelector('#f-sugg').hidden = true;
    return;
  }
  if (t.dataset.fday && form){ const n = +t.dataset.fday; form.days = form.days.includes(n) ? form.days.filter(x => x !== n) : form.days.concat(n); syncForm(); return; }
  if (t.dataset.preset && form){ form.days = t.dataset.preset === 'all' ? [...ALL_DAYS] : t.dataset.preset === 'wk' ? [1,2,3,4,5] : [0,6]; syncForm(); return; }
  if (t.dataset.fscope && form){ form.scope = t.dataset.fscope; syncForm(); return; }
  const act = t.dataset.act; if (!act) return;
  const id = state.openId;
  switch (act){
    case 'close': closeSheet(); break;
    case 'home': openHome(); break;
    case 'anyday': state.day = 'any'; saveView(); render(); break;
    case 'wider': { const i = RADII.indexOf(state.radius); state.radius = RADII[Math.min(i + 1, RADII.length - 2)]; saveView(); render(); break; }
    case 'removed': state.showRemoved = !state.showRemoved; render(); break;
    case 'edit': if (id) openForm(id); break;
    case 'save':
      if (!id) break;
      if (state.saved[id]) delete state.saved[id]; else state.saved[id] = true;
      savePrefs(); render(); refreshSheet(); toast(state.saved[id] ? 'Saved' : 'Removed from saved');
      break;
    case 'gone': closeSheet(); patchDeal(id, {status: 'gone', goneAt: isoDay(new Date())}, 'Marked as gone', {status: 'active', goneAt: null}); break;
    case 'restore': patchDeal(id, {status: 'active', goneAt: null}, 'Restored'); break;
    case 'verify-open': state.verifyOpen = true; { const d = state.deals.find(x => x.id === id); if (d){ const top = sheet.scrollTop; sheet.querySelector('.sheet-in').innerHTML = `<div class="grab" aria-hidden="true"></div>${detailHTML(d)}`; sheet.scrollTop = top; } } break;
    case 'verify-cancel': state.verifyOpen = false; refreshSheet(); break;
    case 'verify-save': {
      const m = sheet.querySelector('#v-method').value, u = sheet.querySelector('#v-url').value.trim(), er = sheet.querySelector('#v-err');
      if (m !== 'in-person' && !safeUrl(u)){ er.textContent = 'Add a link to the page or post that shows the deal.'; er.hidden = false; break; }
      state.verifyOpen = false;
      patchDeal(id, {verification: {status: 'verified', method: m, via: 'you', url: safeUrl(u), checkedAt: isoDay(new Date()), note: 'Confirmed by you.', reason: null}}, 'Verified. It now shows in your list.');
      break;
    }
    case 'delete':
      if (!t.classList.contains('armed')){
        t.classList.add('armed'); t.innerHTML = icon('trash', 'i-s') + 'Tap again to delete';
        setTimeout(() => { if (document.contains(t)){ t.classList.remove('armed'); t.innerHTML = icon('trash', 'i-s') + 'Delete'; } }, 3500);
      } else { closeSheet(); db.doc('deals/' + id).delete().then(() => toast('Deal deleted'), err => toast(dbErr(err))); }
      break;
    case 'undo': { const tt = $('#toast'); const fn = tt._undo; tt.hidden = true; tt._undo = null; if (fn) fn(); break; }
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'daySel'){ state.day = e.target.value; saveView(); render(); }
  if (e.target.id === 'radSel'){ state.radius = +e.target.value; saveView(); render(); }
});
$('#searchBtn').addEventListener('click', () => {
  state.searchOpen = !state.searchOpen;
  if (!state.searchOpen){ state.q = ''; $('#q').value = ''; }
  render(); if (state.searchOpen) $('#q').focus();
});
$('#savedBtn').addEventListener('click', () => { state.savedOnly = !state.savedOnly; render(); });
$('#fab').addEventListener('click', () => openForm(null));
scrim.addEventListener('click', closeSheet);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && state.sheet) closeSheet(); });
let qTimer = 0;
$('#q').addEventListener('input', e => { clearTimeout(qTimer); const v = e.target.value; qTimer = setTimeout(() => { state.q = v; render(); }, 60); });
sheet.addEventListener('submit', e => { e.preventDefault(); if (form) submitForm(); });
sheet.addEventListener('input', e => { if (form && e.target.id === 'f-town'){ form.place = null; townSuggest(e.target.value); } });
document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });
setInterval(() => { if (!document.hidden){ render(); refreshSheet(); } }, 60000);

/* ---------- Boot ---------- */
async function boot(){
  try { ['dd1:view', 'dd1:deals', 'dd1:prefs'].forEach(k => localStorage.removeItem(k)); } catch (e) {}  // first-version keys
  render();
  const slow = setTimeout(() => { if (!state.synced && state.conn === 'loading'){ state.conn = 'slow'; render(); } }, 10000);
  const use = window.claude && typeof window.claude.use === 'function' ? n => window.claude.use(n).catch(() => null) : () => Promise.resolve(null);
  [db, user] = await Promise.all([use('db'), use('user')]);
  if (user){
    try { state.canEdit = !!(await user.canEdit()); } catch (e) {}
    try { state.uid = await user.id(); } catch (e) {}
  }
  if (!db){ clearTimeout(slow); state.conn = 'none'; render(); return; }
  db.collection('deals').onSnapshot(snap => {
    state.deals = snap.docs.map(doc => Object.assign({id: doc.id}, doc.data()));
    if (!snap.metadata.fromCache){ state.synced = true; state.conn = 'ok'; clearTimeout(slow); LS.set('dd2:deals', state.deals); }
    render(); refreshSheet();
  }, () => { clearTimeout(slow); state.conn = 'error'; render(); });
  if (state.uid){
    try {
      prefsRef = db.doc('data/users/' + state.uid + '/prefs');
      let first = true;
      prefsRef.onSnapshot(doc => {
        if (doc.exists && !doc.metadata.hasPendingWrites){ applyPrefs(doc.data()); LS.set('dd2:prefs', {home: state.home, homeSet: state.homeSet, saved: state.saved}); render(); refreshSheet(); }
        else if (!doc.exists && first && !doc.metadata.fromCache && (state.homeSet || Object.keys(state.saved).length)) savePrefs();
        if (!doc.metadata.fromCache) first = false;
      }, () => { prefsRef = null; });
    } catch (e) { prefsRef = null; }
  }
  render();
}
boot();
})();
</script>
