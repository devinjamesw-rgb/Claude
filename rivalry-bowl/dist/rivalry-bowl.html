<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Rivalry Bowl</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
  /* Single committed look: a night game under the lights. */
  :root {
    color-scheme: dark;
    --night: #0b0f1c;
    --ink: #0d0f14;
    --panel: #121829;
    --line: #2a3455;
    --amber: #ffb000;
    --amber-deep: #a86f00;
    --chalk: #f2efe6;
    --chalk-deep: #9a968b;
    --muted: #9aa3b8;
    --turf: #3f8f3b;
    --good: #ffd23f;
    --bad: #ff5a4e;
    --display: 'Press Start 2P', ui-monospace, 'Courier New', monospace;
    --body: 'VT323', ui-monospace, 'Courier New', monospace;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--night);
    color: var(--chalk);
    font-family: var(--body);
    font-size: 20px;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #app {
    position: fixed;
    top: env(safe-area-inset-top, 0px);
    bottom: env(safe-area-inset-bottom, 0px);
    left: env(safe-area-inset-left, 0px);
    right: env(safe-area-inset-right, 0px);
    overflow: hidden;
  }
  #game {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    touch-action: none;
  }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--good); outline-offset: 2px; }

  .btn {
    font-family: var(--display);
    font-size: 12px;
    line-height: 1.3;
    letter-spacing: 0.04em;
    padding: 12px 14px;
    background: var(--amber);
    color: var(--ink);
    border: 0;
    border-radius: 0;
    box-shadow: 0 4px 0 var(--amber-deep);
    cursor: pointer;
    text-transform: uppercase;
    touch-action: manipulation;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--amber-deep); }
  .btn.alt { background: var(--chalk); box-shadow: 0 4px 0 var(--chalk-deep); }
  .btn.alt:active { box-shadow: 0 1px 0 var(--chalk-deep); }
  .btn.ghost { background: transparent; color: var(--chalk); box-shadow: inset 0 0 0 2px var(--line); }
  .btn.ghost:active { box-shadow: inset 0 0 0 2px var(--amber); }
  .btn.small { font-size: 9px; padding: 9px 10px; }
  .btn.big { font-size: 14px; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; text-align: left; }
  .btn.big small { font-family: var(--body); font-size: 18px; letter-spacing: 0; text-transform: none; opacity: 0.8; }
  .btn[disabled] { opacity: 0.35; pointer-events: none; }

  .screen {
    position: absolute;
    inset: 0;
    overflow-y: auto;
    padding-block: 20px;
    padding-inline: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: rgba(8, 11, 22, 0.8);
    touch-action: pan-y;
  }
  .screen.clear { background: transparent; pointer-events: none; }
  .screen.clear > * { pointer-events: auto; }
  .panel {
    background: var(--ink);
    border: 3px solid var(--amber);
    box-shadow: 0 0 0 3px var(--ink), 8px 8px 0 3px rgba(0, 0, 0, 0.45);
    padding: 18px;
    width: 100%;
    max-width: 580px;
    box-sizing: border-box;
    margin-block: auto;
  }
  .eyebrow {
    font-family: var(--display);
    font-size: 9px;
    letter-spacing: 0.14em;
    color: var(--amber);
    margin: 0 0 10px;
  }
  h2 {
    font-family: var(--display);
    font-size: clamp(16px, 4.4vw, 24px);
    line-height: 1.3;
    margin: 0 0 10px;
    text-wrap: balance;
  }
  p { margin: 0 0 12px; line-height: 1.15; }
  .muted { color: var(--muted); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .row.end { justify-content: flex-end; }
  .row.center { justify-content: center; }
  .stack { display: flex; flex-direction: column; gap: 12px; }

  /* Title */
  .title { width: 100%; max-width: 620px; margin-block: auto; display: flex; flex-direction: column; gap: 18px; }
  .logo {
    font-family: var(--display);
    font-size: clamp(28px, 8.5vw, 56px);
    line-height: 1.05;
    margin: 0;
    color: var(--chalk);
    text-shadow: 4px 4px 0 #000;
    letter-spacing: 0.02em;
  }
  .logo .b { display: block; color: var(--amber); text-shadow: 4px 4px 0 #5a3f00, 8px 8px 0 #000; }
  .tag { font-size: 22px; color: var(--muted); max-width: 34ch; }
  .menu { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
  .settings { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px 18px; padding: 14px; }
  .setting { display: flex; flex-direction: column; gap: 6px; }
  .setting > span { font-family: var(--display); font-size: 8px; letter-spacing: 0.12em; color: var(--muted); }
  .seg { display: flex; flex-wrap: wrap; gap: 4px; }
  .seg button {
    font-family: var(--display); font-size: 9px; padding: 8px 9px;
    background: var(--panel); border: 0; box-shadow: inset 0 0 0 2px var(--line); cursor: pointer;
  }
  .seg button[aria-pressed="true"] { background: var(--amber); color: var(--ink); box-shadow: none; }

  /* Team select */
  .teams { max-width: 760px; }
  .teams header { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .name-in {
    font-family: var(--display); font-size: 11px; text-transform: uppercase;
    background: var(--panel); color: var(--chalk); border: 0; box-shadow: inset 0 0 0 2px var(--line);
    padding: 9px 10px; width: 150px; border-radius: 0;
    -webkit-user-select: text; user-select: text;
  }
  .teams-body { display: grid; grid-template-columns: 1fr; gap: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 6px; max-height: 38vh; overflow-y: auto; padding: 2px; align-content: start; }
  @media (min-width: 640px) {
    .teams-body { grid-template-columns: 1.55fr 1fr; align-items: start; }
    .grid { max-height: calc(100vh - 150px); max-height: calc(100dvh - 150px); }
    .detail { grid-template-columns: 1fr; margin-top: 0; }
  }
  .tile {
    display: flex; flex-direction: column; gap: 4px; align-items: flex-start; text-align: left;
    background: var(--panel); border: 0; box-shadow: inset 0 0 0 2px var(--line); padding: 8px; cursor: pointer; min-height: 62px;
  }
  .tile[aria-pressed="true"] { box-shadow: inset 0 0 0 3px var(--amber); background: #1a2138; }
  .tile[data-taken="true"] { opacity: 0.45; }
  .sw { display: flex; height: 8px; width: 100%; }
  .sw i { flex: 1; }
  .tile .nm { font-family: var(--display); font-size: 8px; line-height: 1.3; }
  .tile .st { font-size: 16px; color: var(--good); line-height: 1; }
  .detail { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; margin-block: 14px; }
  .detail canvas { width: 72px; height: 96px; image-rendering: pixelated; background: var(--turf); }
  .ratings { display: grid; grid-template-columns: repeat(4, auto); justify-content: start; gap: 2px 14px; font-size: 20px; font-variant-numeric: tabular-nums; }
  .ratings b { font-weight: normal; color: var(--amber); }

  /* In-game controls */
  #controls {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding-block: 10px 12px; padding-inline: 16px;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    pointer-events: none;
  }
  #controls > * { pointer-events: auto; }
  #controls.portrait { top: 70%; justify-content: center; }
  #controls .who { font-family: var(--display); font-size: 9px; letter-spacing: 0.1em; text-shadow: 2px 2px 0 #000; }
  #controls .row { justify-content: center; }
  #controls .btn { min-width: 84px; }
  #pause {
    position: absolute; top: 6px; right: 8px; width: 38px; height: 34px;
    font-family: var(--display); font-size: 10px;
    background: rgba(13, 15, 20, 0.75); color: var(--chalk); border: 0; box-shadow: inset 0 0 0 2px var(--line); cursor: pointer;
  }
  #hint {
    position: absolute; left: 50%; transform: translateX(-50%); bottom: 10px;
    font-family: var(--display); font-size: 8px; letter-spacing: 0.08em; color: var(--chalk);
    background: rgba(13, 15, 20, 0.72); padding: 7px 10px; white-space: nowrap; pointer-events: none;
    max-width: calc(100% - 32px); overflow: hidden; text-overflow: ellipsis;
  }

  /* Stats */
  table.box { width: 100%; border-collapse: collapse; font-size: 20px; font-variant-numeric: tabular-nums; margin-block: 10px 16px; }
  table.box th, table.box td { padding: 4px 6px; text-align: right; border-bottom: 1px solid var(--line); }
  table.box th:first-child, table.box td:first-child { text-align: left; color: var(--muted); }
  table.box thead th { font-family: var(--display); font-size: 9px; color: var(--amber); }
  .score-big { font-family: var(--display); font-size: clamp(20px, 6vw, 34px); display: flex; justify-content: center; gap: 18px; align-items: center; margin-block: 8px 14px; }
  .score-big .s { color: var(--amber); }

  .howto dl { display: grid; grid-template-columns: minmax(90px, auto) 1fr; gap: 8px 14px; margin: 0 0 14px; }
  .howto dt { font-family: var(--display); font-size: 9px; color: var(--amber); padding-top: 4px; }
  .howto dd { margin: 0; line-height: 1.1; }

  .code { font-family: var(--display); font-size: 22px; letter-spacing: 0.2em; color: var(--amber); }
  .lobby-list { display: flex; flex-direction: column; gap: 8px; margin-block: 12px; }
  .lobby-item { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px; background: var(--panel); box-shadow: inset 0 0 0 2px var(--line); }
  .status { font-size: 20px; color: var(--muted); }
  .status.ok { color: var(--good); }
  .status.err { color: var(--bad); }

  /* Landscape phones: two columns so everything fits without scrolling. */
  @media (orientation: landscape) and (max-height: 540px) {
    .title { max-width: 920px; display: grid; grid-template-columns: 0.9fr 1.3fr; gap: 12px 26px; align-items: start; }
    .title .logo { grid-column: 1; grid-row: 1; font-size: clamp(26px, 5vw, 40px); }
    .title .tag { grid-column: 1; grid-row: 2; font-size: 20px; }
    .title > .row { grid-column: 1; grid-row: 3; }
    .title .menu { grid-column: 2; grid-row: 1 / span 2; grid-template-columns: 1fr 1fr; gap: 10px; }
    .title .settings { grid-column: 2; grid-row: 3; grid-template-columns: 1fr 1fr; padding: 10px; gap: 8px 12px; }
    .btn.big { font-size: 12px; padding: 12px 14px; }
    .btn.big small { font-size: 17px; }
    .panel { padding: 14px; }
    .teams header { margin-bottom: 8px; }
    .grid { max-height: calc(100vh - 130px); max-height: calc(100dvh - 130px); }
    .detail canvas { width: 54px; height: 72px; }
  }
  @media (max-height: 540px) {
    table.box { font-size: 17px; margin-block: 6px 10px; }
    table.box th, table.box td { padding: 2px 6px; }
    .score-big { margin-block: 4px 6px; font-size: 20px; }
    h2 { font-size: 15px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .btn:active { transform: none; }
  }
</style>
</head>
<body>
<div id="app">
  <canvas id="game" aria-label="Football field"></canvas>
  <div id="hint" hidden></div>
  <div id="controls" hidden></div>
  <button id="pause" type="button" aria-label="Pause" hidden>II</button>
  <div id="screen" class="screen"></div>
</div>
<script>
/* src/data.js */
/* Rivalry Bowl: constants, teams, rosters and a seeded RNG.
 * Every src file attaches to the shared RB namespace so the same code runs
 * in the browser and under node (tools/simtest.js). */
(function (root) {
  'use strict';
  const RB = (root.RB = root.RB || {});

  const C = {
    FIELD_LEN: 120,
    FIELD_W: 160 / 3,
    GOAL_L: 10,
    GOAL_R: 110,
    HASH_TOP: 20,
    HASH_BOT: 160 / 3 - 20,
    MID_Y: 80 / 3,
    DT: 1 / 60,
    GRAVITY: 10.7, // yd/s^2
    PR: 0.45, // player radius, yards
    PLAY_CLOCK_RUNOFF: 25,
    MIN_RUNOFF: 10,
    RUNOFF_RATE: 7, // game seconds drained per real second between plays
    KICKOFF_TOUCHBACK: 25,
    PUNT_TOUCHBACK: 20,
    XP_DIST: 20, // college PAT snapped from the 3
  };

  // --- RNG ------------------------------------------------------------------
  function makeRng(seed) {
    let a = seed >>> 0;
    function next() {
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    }
    let spare = null;
    return {
      next,
      range: (lo, hi) => lo + (hi - lo) * next(),
      int: (lo, hi) => lo + Math.floor(next() * (hi - lo + 1)),
      pick: (arr) => arr[Math.floor(next() * arr.length)],
      chance: (p) => next() < p,
      gauss() {
        if (spare !== null) {
          const s = spare;
          spare = null;
          return s;
        }
        let u = 0, v = 0;
        while (u === 0) u = next();
        v = next();
        const m = Math.sqrt(-2 * Math.log(u));
        spare = m * Math.sin(2 * Math.PI * v);
        return m * Math.cos(2 * Math.PI * v);
      },
    };
  }

  function hashStr(s) {
    let h = 2166136261;
    for (let i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }

  // --- Teams ----------------------------------------------------------------
  // Ratings: [QB, RB, WR, OL, DL, LB, DB, K], 50-99.
  // School names and colors only; no logos or marks.
  const TEAM_ROWS = [
    ['ALA', 'ALABAMA', '#9e1b32', '#9e1b32', '#f4f4f4', '#ffffff', [88, 86, 85, 90, 92, 88, 89, 80]],
    ['UGA', 'GEORGIA', '#ba0c2f', '#ba0c2f', '#c8c8c8', '#1a1a1a', [86, 88, 84, 90, 94, 90, 90, 82]],
    ['OSU', 'OHIO STATE', '#bb0000', '#a7b1b7', '#a7b1b7', '#ffffff', [90, 85, 95, 86, 90, 86, 88, 78]],
    ['MICH', 'MICHIGAN', '#00274c', '#00274c', '#ffcb05', '#ffcb05', [80, 88, 80, 92, 90, 88, 88, 80]],
    ['TEX', 'TEXAS', '#bf5700', '#f4f4f4', '#f4f4f4', '#ffffff', [89, 85, 88, 86, 86, 84, 84, 80]],
    ['LSU', 'LSU', '#461d7c', '#fdd023', '#fdd023', '#fdd023', [88, 82, 90, 82, 84, 82, 82, 78]],
    ['CLEM', 'CLEMSON', '#f56600', '#f4f4f4', '#f4f4f4', '#522d80', [80, 82, 80, 82, 88, 86, 84, 76]],
    ['ORE', 'OREGON', '#154733', '#fee123', '#154733', '#fee123', [90, 84, 86, 86, 84, 82, 82, 78]],
    ['USC', 'USC', '#990000', '#990000', '#ffc72c', '#ffc72c', [88, 80, 86, 78, 78, 76, 76, 76]],
    ['ND', 'NOTRE DAME', '#0c2340', '#c99700', '#c99700', '#c99700', [80, 84, 78, 90, 84, 84, 86, 80]],
    ['FSU', 'FLORIDA ST', '#782f40', '#ceb888', '#ceb888', '#ceb888', [78, 80, 80, 78, 84, 80, 80, 76]],
    ['PSU', 'PENN STATE', '#041e42', '#f4f4f4', '#f4f4f4', '#ffffff', [80, 88, 78, 86, 88, 88, 84, 80]],
    ['OU', 'OKLAHOMA', '#841617', '#841617', '#fdf9d8', '#fdf9d8', [82, 80, 82, 80, 80, 78, 78, 76]],
    ['TENN', 'TENNESSEE', '#ff8200', '#f4f4f4', '#f4f4f4', '#ffffff', [84, 82, 84, 82, 82, 78, 78, 76]],
    ['UF', 'FLORIDA', '#0021a5', '#0021a5', '#f4f4f4', '#fa4616', [78, 80, 80, 78, 80, 78, 80, 76]],
    ['MIA', 'MIAMI', '#005030', '#f4f4f4', '#f4f4f4', '#f47321', [82, 82, 82, 80, 80, 78, 78, 76]],
    ['TAMU', 'TEXAS A&M', '#500000', '#f4f4f4', '#f4f4f4', '#ffffff', [78, 80, 78, 84, 84, 80, 80, 78]],
    ['AUB', 'AUBURN', '#0c2340', '#f4f4f4', '#f4f4f4', '#e87722', [76, 80, 76, 80, 82, 80, 78, 76]],
    ['WIS', 'WISCONSIN', '#c5050c', '#f4f4f4', '#f4f4f4', '#ffffff', [72, 86, 72, 86, 80, 80, 78, 76]],
    ['UW', 'WASHINGTON', '#4b2e83', '#b7a57a', '#b7a57a', '#b7a57a', [82, 78, 84, 80, 78, 76, 78, 76]],
    ['NEB', 'NEBRASKA', '#e41c38', '#f4f4f4', '#f4f4f4', '#ffffff', [72, 76, 72, 78, 76, 76, 74, 72]],
    ['IOWA', 'IOWA', '#111111', '#ffcd00', '#ffcd00', '#ffcd00', [62, 76, 66, 84, 84, 86, 86, 82]],
    ['COLO', 'COLORADO', '#111111', '#cfb87c', '#cfb87c', '#cfb87c', [86, 74, 86, 70, 74, 72, 82, 72]],
    ['BSU', 'BOISE ST', '#0033a0', '#0033a0', '#0033a0', '#d64309', [76, 86, 74, 74, 74, 74, 74, 74]],
    ['UTAH', 'UTAH', '#cc0000', '#cc0000', '#f4f4f4', '#ffffff', [76, 78, 74, 82, 82, 80, 80, 78]],
    ['MISS', 'OLE MISS', '#ce1126', '#14213d', '#f4f4f4', '#14213d', [86, 82, 84, 78, 80, 76, 76, 76]],
    ['OKST', 'OKLAHOMA ST', '#ff7300', '#111111', '#111111', '#ffffff', [74, 80, 78, 74, 72, 72, 72, 74]],
    ['VT', 'VIRGINIA TECH', '#630031', '#630031', '#f4f4f4', '#cf4420', [70, 74, 72, 74, 76, 74, 76, 74]],
    ['ARMY', 'ARMY', '#111111', '#d4bf91', '#d4bf91', '#d4bf91', [66, 80, 62, 74, 70, 72, 70, 72]],
    ['NAVY', 'NAVY', '#00205b', '#c5b783', '#c5b783', '#c5b783', [66, 80, 62, 72, 70, 72, 70, 72]],
  ];

  const TEAMS = TEAM_ROWS.map(([id, name, jersey, helmet, pants, trim, r]) => ({
    id, name, jersey, helmet, pants, trim,
    r: { qb: r[0], rb: r[1], wr: r[2], ol: r[3], dl: r[4], lb: r[5], db: r[6], k: r[7] },
  }));
  const TEAM_BY_ID = Object.fromEntries(TEAMS.map((t) => [t.id, t]));

  function teamStars(t, even) {
    const r = even ? evenRatings() : t.r;
    const off = (r.qb * 2 + r.rb + r.wr * 1.5 + r.ol) / 5.5;
    const def = (r.dl + r.lb + r.db) / 3;
    const toStars = (v) => Math.max(1, Math.min(5, Math.round(((v - 58) / 36) * 8) / 2 + 1));
    return { off: toStars(off), def: toStars(def), ovr: toStars((off + def) / 2) };
  }
  function evenRatings() {
    return { qb: 82, rb: 82, wr: 82, ol: 82, dl: 82, lb: 82, db: 82, k: 80 };
  }

  // --- Rosters --------------------------------------------------------------
  const FIRST = 'AJBCDEGHIKLMNOPRSTWZ';
  const LAST = [
    'SMITH', 'JOHNSON', 'WILLIAMS', 'BROWN', 'JONES', 'DAVIS', 'MILLER', 'WILSON', 'MOORE', 'TAYLOR',
    'THOMAS', 'JACKSON', 'WHITE', 'HARRIS', 'MARTIN', 'THOMPSON', 'ROBINSON', 'CLARK', 'LEWIS', 'WALKER',
    'HALL', 'ALLEN', 'YOUNG', 'KING', 'WRIGHT', 'HILL', 'GREEN', 'ADAMS', 'BAKER', 'NELSON',
    'CARTER', 'MITCHELL', 'ROBERTS', 'TURNER', 'PHILLIPS', 'CAMPBELL', 'PARKER', 'EVANS', 'EDWARDS', 'COLLINS',
    'STEWART', 'MORRIS', 'REED', 'COOK', 'MORGAN', 'BELL', 'MURPHY', 'BAILEY', 'COOPER', 'RICHARDSON',
    'COX', 'HOWARD', 'WARD', 'PETERSON', 'GRAY', 'JAMES', 'WATSON', 'BROOKS', 'KELLY', 'SANDERS',
    'PRICE', 'BENNETT', 'WOOD', 'BARNES', 'ROSS', 'HENDERSON', 'COLEMAN', 'JENKINS', 'PERRY', 'POWELL',
    'LONG', 'PATTERSON', 'HUGHES', 'WASHINGTON', 'BUTLER', 'SIMMONS', 'FOSTER', 'BRYANT', 'ALEXANDER', 'RUSSELL',
    'GRIFFIN', 'HAYES', 'MYERS', 'FORD', 'HAMILTON', 'GRAHAM', 'WALLACE', 'WEST', 'COLE', 'HAYNES',
  ];
  const SKIN = ['#f1c27d', '#e0ac69', '#c68642', '#8d5524', '#6b4226', '#ffdbac', '#a0673c', '#4a2c17'];

  // Offense slots: QB RB C LG RG LT RT TE WR1 WR2 WR3
  // Defense slots: DE DT DT DE LB LB LB CB CB S S
  const OFF_POS = ['QB', 'RB', 'OL', 'OL', 'OL', 'OL', 'OL', 'TE', 'WR', 'WR', 'WR'];
  const DEF_POS = ['DL', 'DL', 'DL', 'DL', 'LB', 'LB', 'LB', 'CB', 'CB', 'S', 'S'];
  const NUM_RANGE = {
    QB: [1, 19], RB: [1, 49], OL: [50, 79], TE: [80, 89], WR: [1, 19],
    DL: [90, 99], LB: [30, 59], CB: [1, 39], S: [1, 49], K: [1, 49],
  };

  // Converts 50-99 ratings into sim attributes (speeds in yd/s, skills 0-1).
  function buildRoster(team, even) {
    const r = even ? evenRatings() : team.r;
    const rng = makeRng(hashStr(team.id + (even ? ':even' : '')));

/* src/sim.js */
/* Rivalry Bowl: single-play simulation.

    slant: { pts: [[2.5, 0], [15, 9]], cont: true },
    out: { pts: [[7, 0], [7.8, -13]], cont: false },
    in: { pts: [[9, 0], [9.6, 16]], cont: true },
    post: { pts: [[10, 0], [34, 10]], cont: true },
    corner: { pts: [[10, 0], [26, -11]], cont: true },
    curl: { pts: [[10, 0], [8.6, 1.2]], cont: false },
    comeback: { pts: [[14, 0], [11.5, -2.5]], cont: false },
    hitch: { pts: [[5.5, 0], [4.8, 0.2]], cont: false },

    seam: { pts: [[36, 0.8]], cont: true },

    s = s || p.spd;
    const rx = c.x - p.x, ry = c.y - p.y;
    const a = c.vx * c.vx + c.vy * c.vy - s * s;
    const b = 2 * (rx * c.vx + ry * c.vy);
    const k = rx * rx + ry * ry;
    let t = -1;
    if (Math.abs(a) < 1e-3) t = b < 0 ? -k / b : -1;
    else {
      const disc = b * b - 4 * a * k;
      if (disc >= 0) {
        const sq = Math.sqrt(disc);
        const t1 = (-b - sq) / (2 * a), t2 = (-b + sq) / (2 * a);
        t = Math.min(t1 > 0 ? t1 : 1e9, t2 > 0 ? t2 : 1e9);
        if (t === 1e9) t = -1;
      }
    }
    if (t < 0) t = Math.min(0.6, Math.sqrt(k) / Math.max(4, s));
    t = Math.min(t, 2.5);
    return { x: c.x + c.vx * t, y: c.y + c.vy * t };
  }
  // Once per play event: flip everyone who has to react to a new ball state.
  function setRead(play, sides) {
    for (const p of play.players) {
      if (!sides.includes(p.side)) continue;
      p.readAt = play.t + (p.react != null ? p.react : 0.25) + play.rng.range(0, 0.1);
    }
  }

  // --- AI: offense ---------------------------------------------------------------
  function aiOffense(play, p) {
    const P = play.players, spd = effSpeed(play, p), b = play.ball;
    const car = carrierP(play);
    if (p.eng >= 0) return; // engaged pairs are moved together
    if (p.stun > 0) { p.dvx *= 0.8; p.dvy *= 0.8; return; }

    if (play.turnover) {
      // After an interception or fumble return: chase the returner.
      if (car) { const t = pursuitPoint(p, car, spd); steerTo(p, t.x, t.y, spd); }
      return;
    }
    switch (p.role) {
      case 'qb': {
        const d = p.drop;
        steerTo(p, d.x, d.y, 4.2, true);
        break;
      }
      case 'handoff': {
        const rb = P[RBK];
        if (play.handedOff) { steerTo(p, p.x - 1.5, p.y, 2, true); break; }
        steerTo(p, (rb.x + p.x) / 2 + 0.2, (rb.y + p.y) / 2, 3.5, true);
        break;
      }
      case 'pass_pro': {
        // Get between the assigned rusher and the QB; spare blockers double-team.
        const q = P[QB];
        const best = p.pp >= 0 ? P[p.pp] : null;
        if (best) {
          const dx = q.x - best.x, dy = q.y - best.y, dq = hyp(dx, dy) || 1;
          steerTo(p, best.x + (dx / dq) * 0.9, best.y + (dy / dq) * 0.9, spd * 0.95, true);
          break;
        }
        let pair = null, bd = 3.5;
        for (const d of P) {
          if (d.side !== 1 || d.eng < 0) continue;
          const dd = dist(d, p);
          if (dd < bd) { bd = dd; pair = d; }
        }
        if (pair) steerTo(p, pair.x - 0.9, pair.y + (p.y < pair.y ? -0.7 : 0.7), spd * 0.8, true);
        else steerTo(p, p.x0 - 1.6, p.y0, 2.5, true);
        break;
      }
      case 'run_block': {
        const t = nearestOpp(play, p, 5, (d) => d.eng < 0 && d.x > p.x - 1);
        if (t) steerTo(p, t.x - 0.3, t.y, spd * 0.9);
        else steerTo(p, p.x + 3, p.y, spd * 0.6);
        break;
      }
      case 'stalk': {
        const t = nearestOpp(play, p, 9, (d) => d.eng < 0);
        if (t) steerTo(p, t.x - 0.5, t.y, spd * 0.85);
        else steerTo(p, p.x + 3, p.y, spd * 0.5);
        break;
      }
      case 'runpath': {
        const wp = p.path[Math.min(p.wp, p.path.length - 1)];
        if (steerTo(p, wp.x, wp.y, spd) < 0.8 && p.wp < p.path.length - 1) p.wp++;
        break;
      }
      case 'route': {
        if (p.track) { trackBall(play, p, spd); break; }
        const wp = p.route[Math.min(p.wp, p.route.length - 1)];
        const d = steerTo(p, wp.x, wp.y, spd, p.wp === p.route.length - 1);
        if (d < 0.7 && p.wp < p.route.length - 1) p.wp++;
        break;
      }
      case 'escort': {
        if (!car) break;
        let best = null, bd = 10;
        for (const d of P) {
          if (d.side !== 1 || d.eng >= 0 || d.down > 0 || d.shedCd > 0) continue;
          const dc = dist(d, car);
          if (dc < bd && d.x > car.x - 3) { bd = dc; best = d; }
        }
        if (best) {
          const dx = car.x - best.x, dy = car.y - best.y, dd = hyp(dx, dy) || 1;
          steerTo(p, best.x + (dx / dd) * 0.7, best.y + (dy / dd) * 0.7, spd * 0.95);
        } else steerTo(p, car.x + 4, car.y + (p.y > car.y ? 3 : -3), spd * 0.8);
        break;
      }
      default:
        p.dvx *= 0.9;
        p.dvy *= 0.9;
    }
  }

  // Receiver running under a thrown ball: pace to arrive with it, never braking
  // on the last step (a trailing defender would run past him).
  function trackBall(play, p, spd) {
    const b = play.ball;
    const tRem = Math.max(0.05, b.T - b.bt);
    const dx = b.tx - p.x, dy = b.ty - p.y, d = hyp(dx, dy);
    if (d < 0.3) {
      if (tRem > 0.12) { p.dvx = dx * 2; p.dvy = dy * 2; }
      else { p.dvx = p.vx; p.dvy = p.vy; }
      return;
    }
    const s = clamp(d / tRem, spd * 0.6, spd);
    p.dvx = (dx / d) * s;
    p.dvy = (dy / d) * s;
  }

  // --- AI: defense ---------------------------------------------------------------
  function aiDefense(play, p) {
    const P = play.players, b = play.ball, spd = effSpeed(play, p);
    const car = carrierP(play);
    if (p.eng >= 0) return;
    if (p.down > 0 || p.stun > 0) { p.dvx *= 0.85; p.dvy *= 0.85; return; }

    if (play.turnover) {
      if (p.i === play.carrier) { returnerAI(play, p, spd); return; }
      const t = nearestOpp(play, p, 12, (o) => o.eng < 0);
      if (t && car && dist(t, car) < 10) {
        const dx = car.x - t.x, dy = car.y - t.y, dd = hyp(dx, dy) || 1;
        steerTo(p, t.x + (dx / dd) * 0.6, t.y + (dy / dd) * 0.6, spd * 0.9);
      } else if (car) steerTo(p, car.x - 4, car.y, spd * 0.8);
      return;
    }

    const reading = play.t < p.readAt;
    let role = p.role;
    let sMul = 1;
    // Ball carrier past the line (or anyone but the QB holding it): everyone pursues.
    if (car && car.i !== QB) {
      if (!reading) role = 'pursue';
      else if (play.thrown) { role = 'pursue'; sMul = 0.75; }
    } else if (car && car.i === QB && play.scramble && !reading) role = 'pursue';
    else if (b.st === 'air' && !reading && role !== 'rush') role = 'ball';
    else if (b.st === 'air' && role === 'rush') role = 'drift';

    switch (role) {
      case 'rush': {
        if (p.delay && play.t < p.delay) { p.dvx = 0; p.dvy = 0; break; }
        const tgt = car || P[QB];
        steerTo(p, tgt.x, tgt.y, spd);
        break;
      }
      case 'drift': {
        steerTo(p, p.x - 0.5, p.y, 2.5, true);
        break;
      }
      case 'pursue': {
        if (!car) break;
        const t = pursuitPoint(p, car, spd);
        steerTo(p, t.x, t.y, spd * sMul);
        break;
      }
      case 'ball': {
        // Play the ball if you can get there; otherwise take an angle on the
        // receiver so you are in front of him when he catches it.
        const tRem = Math.max(0.05, b.T - b.bt);
        const d = dist(p, { x: b.tx, y: b.ty });
        const r = b.target >= 0 ? P[b.target] : null;
        if (d < spd * tRem + 1.2 || !r) steerTo(p, b.tx, b.ty, spd, true);
        else {
          const ghost = { x: b.tx, y: b.ty, vx: r.vx, vy: r.vy };
          const t = pursuitPoint(p, ghost, spd);
          steerTo(p, t.x, t.y, spd);
        }
        break;
      }
      case 'man': {
        const r = P[p.man];
        const e = lagged(play, r.i, p.react, 0.15);
        const run = Math.max(0, r.x - r.x0);
        const cush = Math.max(0.7, p.cush0 - run * 0.62);
        const inside = r.y < C.MID_Y ? 0.5 : -0.5;
        let tx = e.x + cush, ty = e.y + inside;
        if (r.role === 'pass_pro') { tx = play.los + 3; ty = r.y; }
        if (!play.thrown) tx = Math.max(tx, play.los + 1);
        steerTo(p, tx, ty, spd, true);
        break;
      }
      case 'zone': {
        const z = p.zone;
        const zx = Math.min(play.los + z.dx, 118.5), zy = z.y;
        let best = null, bs = 1e9;
        let deepest = -1e9;
        for (const i of ELIGIBLE) {
          const r = P[i];
          if (r.role !== 'route') continue;
          if (r.x > deepest && Math.abs(r.y - zy) < z.r + 6) deepest = r.x;
          const dz = hyp(r.x - zx, r.y - zy);
          if (dz < z.r + 1.5) {
            const sc = dz - (z.deep ? (r.x - play.los) * 0.35 : 0);
            if (sc < bs) { bs = sc; best = r; }
          }
        }
        let tx = zx, ty = zy;
        if (best) {
          const e = lagged(play, best.i, p.react, 0.2);
          tx = e.x + (z.deep ? 2.6 : 1.0);
          ty = e.y;
          const dx = tx - zx, dy = ty - zy, dd = hyp(dx, dy), leash = z.r + 2.5;
          if (dd > leash) { tx = zx + (dx / dd) * leash; ty = zy + (dy / dd) * leash; }
        }
        if (z.deep) tx = Math.max(tx, Math.min(deepest + 3, 118.5), zx - 3);
        steerTo(p, tx, ty, spd, true);
        break;
      }
      case 'spy': {
        const q = P[QB];
        steerTo(p, Math.max(play.los + 4.5, q.x + 5), q.y, spd * 0.8, true);
        break;
      }
      default:
        p.dvx *= 0.9;
        p.dvy *= 0.9;
    }
  }

  function returnerAI(play, p, spd) {
    // Run for the offense's end zone (-x), bending away from the closest chasers.
    let ax = -1, ay = 0;
    for (const q of play.players) {
      if (q.side !== 0 || q.down > 0) continue;
      const dx = p.x - q.x, dy = p.y - q.y, d = hyp(dx, dy);
      if (d < 7 && q.x < p.x + 2) {
        const w = (7 - d) / 7;
        ay += (dy >= 0 ? 1 : -1) * w * 1.3;
      }
    }
    if (p.y < 4) ay += 0.6;
    if (p.y > W - 4) ay -= 0.6;
    steerDir(p, ax, ay, spd);
  }

  // --- Blocking ----------------------------------------------------------------
  // Greedy one-to-one matching of free pass blockers to free rushers.
  function assignProtection(play) {
    const P = play.players;
    const blockers = [], rushers = [];
    for (const p of P) {
      if (p.side === 0 && p.role === 'pass_pro') { p.pp = -1; if (p.eng < 0 && p.stun <= 0) blockers.push(p); }
      if (p.side === 1 && p.role === 'rush' && p.eng < 0 && p.down <= 0) rushers.push(p);
    }
    if (!blockers.length || !rushers.length) return;
    const q = P[QB];
    const pairs = [];
    for (const b of blockers) {
      for (const d of rushers) {
        const behind = d.x < b.x - 0.5 ? 3 : 0; // already beaten this blocker
        pairs.push({ b, d, c: Math.abs(d.y - b.y) + dist(d, b) * 0.4 + dist(d, q) * 0.15 + behind });
      }
    }
    pairs.sort((u, v) => u.c - v.c);
    const takenD = new Set();
    for (const { b, d } of pairs) {
      if (b.pp >= 0 || takenD.has(d.i)) continue;
      b.pp = d.i;
      takenD.add(d.i);
    }
  }

  function tryEngage(play) {
    const P = play.players;
    for (let i = 0; i < 11; i++) {
      const a = P[i];
      if (a.eng >= 0 || a.stun > 0 || a.i === play.carrier) continue;
      if (!['pass_pro', 'run_block', 'stalk', 'escort'].includes(a.role) || play.turnover) continue;
      for (let j = 11; j < 22; j++) {
        const d = P[j];
        if (d.eng >= 0 || d.shedCd > 0 || d.down > 0 || d.i === play.carrier) continue;
        if (dist(a, d) > 0.95) continue;
        if (a.role === 'pass_pro' && play.ball.st === 'air') continue;
        engage(play, a, d);
        break;
      }
    }
  }

  function engage(play, a, d) {
    const rng = play.rng;
    let hold;
    if (a.role === 'pass_pro') {
      const edge = (a.block - d.rush) * 5;
      hold = (1.5 + edge * 0.35 + -Math.log(1 - rng.next()) * clamp(3.1 + edge, 1.2, 6)) * play.diff.hold;
    } else if (a.role === 'run_block') {
      const edge = (a.block - (d.rush + d.tackle) / 2) * 4;
      hold = 0.5 + -Math.log(1 - rng.next()) * clamp(1.3 + edge, 0.5, 3.2);
    } else {
      hold = 0.25 + -Math.log(1 - rng.next()) * (0.45 + a.block * 0.6);
    }
    a.eng = d.i;
    d.eng = a.i;
    a.engT = 0;
    a.hold = Math.max(0.25, hold);
    a.engKind = a.role;
  }

  function updatePairs(play, dt) {
    const P = play.players;
    const car = carrierP(play);
    const q = P[QB];
    for (let i = 0; i < 11; i++) {
      const a = P[i];
      if (a.eng < 0) continue;
      const d = P[a.eng];
      // A free OL next to the pair makes it a double team.
      let help = false;
      for (const k of OL) {
        const h = P[k];
        if (h !== a && h.eng < 0 && dist(h, d) < 1.6) { help = true; break; }
      }
      a.engT += dt * (help ? 0.5 : 1);
      const goal = car && car.side === 0 ? car : q;
      let ux = goal.x - d.x, uy = goal.y - d.y;
      const ul = hyp(ux, uy) || 1;
      ux /= ul; uy /= ul;
      let rate;
      if (a.engKind === 'pass_pro') rate = clamp(0.55 + (d.rush - a.block) * 3, 0.05, 1.8) * (help ? 0.4 : 1);
      else if (a.engKind === 'run_block') rate = clamp(-0.4 + ((d.rush + d.tackle) / 2 - a.block) * 3, -1.4, 1.2);
      else rate = 0.3;
      d.vx = ux * rate; d.vy = uy * rate;
      d.x += d.vx * dt; d.y += d.vy * dt;
      a.x = d.x - ux * 0.78; a.y = d.y - uy * 0.78;
      a.vx = d.vx; a.vy = d.vy;
      a.face = ux > 0 ? -1 : 1;
      d.face = -a.face;
      if (a.engT >= a.hold || (play.ball.st === 'air' && a.engKind === 'pass_pro' && a.engT > 0.4)) {
        a.eng = -1; d.eng = -1;
        d.shedCd = 1.0;
        a.stun = 0.35;
      }
    }
  }

  // --- Ball --------------------------------------------------------------------
  function maxRange(qb) {
    return 38 + qb.arm * 28;
  }

  // Aim target clamped to the QB's arm, used by both the preview and the throw.
  function clampAim(play, tx, ty) {
    const q = play.players[QB];
    const dx = tx - q.x, dy = ty - q.y, d = hyp(dx, dy), m = maxRange(q);
    if (d <= m) return { x: tx, y: ty, d, max: false };
    return { x: q.x + (dx / d) * m, y: q.y + (dy / d) * m, d: m, max: true };
  }
  function flightTime(qb, d) {
    return (0.22 + d * 0.034) * (1.18 - qb.arm * 0.3);
  }

  function canThrow(play) {
    const b = play.ball;
    return play.kind === 'pass' && !play.thrown && b.st === 'held' && b.holder === QB && !play.scramble && play.phase === 'live';
  }

  function throwBall(play, tx, ty) {
    if (!canThrow(play)) return false;
    const P = play.players, q = P[QB], b = play.ball, rng = play.rng;
    const aim = clampAim(play, tx, ty);
    const d = aim.d;
    const rusher = nearestOpp(play, q, 2.6, (o) => o.eng < 0);
    const moving = hyp(q.vx, q.vy) > 2.2;
    let sigma = (0.2 + d * (0.011 + (1 - q.acc) * 0.05)) * (1 + (rusher ? 1.1 : 0) + (moving ? 0.5 : 0));
    if (play.wx.type === 'rain') sigma *= 1.15;
    const lx = aim.x + rng.gauss() * sigma;
    const ly = aim.y + rng.gauss() * sigma * 0.8;
    const T = flightTime(q, d);
    b.st = 'air';
    b.holder = -1;
    b.fx = q.x + 0.3; b.fy = q.y; b.z0 = 2.0;
    b.tx = lx; b.ty = ly; b.T = T; b.bt = 0;
    b.vz0 = (1.5 - b.z0 + 0.5 * C.GRAVITY * T * T) / T;
    b.resolved = false;
    play.thrown = true;
    play.carrier = -1;
    play.stats.passAtt = 1;
    play.landing = { x: lx, y: ly };
    q.role = 'idle';
    // The receiver who can get there adjusts to the throw.
    let best = null, bn = 1e9;
    for (const i of ELIGIBLE) {
      const r = P[i];
      if (r.role !== 'route') continue;
      const pr = predictRoute(play, r, T);
      const need = hyp(pr.x - lx, pr.y - ly);
      const direct = hyp(r.x - lx, r.y - ly) / effSpeed(play, r);
      const reach = 1.4 + 2.4 * T;
      if ((need <= reach || direct <= T + 0.05) && need < bn) { bn = need; best = r; }
    }
    if (best) { best.track = { x: lx, y: ly }; b.target = best.i; }
    else b.target = -1;
    b.batted = false;
    for (const d of P) {
      if (d.side !== 1 || d.role !== 'rush' || d.down > 0) continue;
      if (d.x > q.x - 0.3 && dist(d, q) < 1.5 && rng.chance(0.05)) { b.batted = true; break; }
    }
    setRead(play, [1]);
    event(play, 'throw', '');
    return true;
  }

  // Forward-simulates a receiver's route to guess where he'll be in T seconds.
  function predictRoute(play, r, T) {
    const g = { x: r.x, y: r.y, vx: r.vx, vy: r.vy, dvx: 0, dvy: 0, wp: r.wp, route: r.route, spd: r.spd };
    const spd = effSpeed(play, r);
    for (let t = 0; t < T; t += C.DT * 2) {
      const wp = g.route[Math.min(g.wp, g.route.length - 1)];
      const d = steerTo(g, wp.x, wp.y, spd, g.wp === g.route.length - 1);
      if (d < 0.7 && g.wp < g.route.length - 1) g.wp++;
      integrate(g, 11, C.DT * 2);
    }
    return g;
  }

  function updateBall(play, dt) {
    const P = play.players, b = play.ball;
    if (b.st === 'snap') {
      b.bt += dt;
      const q = P[QB], u = Math.min(1, b.bt / 0.24);
      b.x = b.fx + (q.x + 0.3 - b.fx) * u;
      b.y = b.fy + (q.y - b.fy) * u;
      b.z = 0.4 + Math.sin(u * Math.PI) * 0.5 + u * 0.8;
      if (u >= 1) { b.st = 'held'; b.holder = QB; play.carrier = QB; }
      return;
    }
    if (b.st === 'held') {
      const h = P[b.holder];
      b.x = h.x + 0.25 * h.face; b.y = h.y + 0.05; b.z = 1.2;
      return;
    }
    if (b.st === 'air') {
      b.bt += dt;
      const u = b.bt / b.T;
      b.x = b.fx + (b.tx - b.fx) * u;
      b.y = b.fy + (b.ty - b.fy) * u;
      b.z = b.z0 + b.vz0 * b.bt - 0.5 * C.GRAVITY * b.bt * b.bt;
      if (!b.resolved) resolveCatch(play);
      if (b.st === 'air' && b.z <= 0) {
        b.z = 0;
        incomplete(play, 'INCOMPLETE');
      }
      return;
    }
    if (b.st === 'dead') {
      // Loose incompletion bounces to a stop.
      b.vz -= C.GRAVITY * dt;
      b.z = Math.max(0, b.z + b.vz * dt);
      if (b.z === 0) b.vz = Math.abs(b.vz) * 0.35;
      b.x += b.vx * dt; b.y += b.vy * dt;
      b.vx *= 0.96; b.vy *= 0.96;
    }
  }

  function resolveCatch(play) {
    const P = play.players, b = play.ball, rng = play.rng;
    if (b.batted) {
      if (b.bt > 0.12) incomplete(play, 'BATTED DOWN');
      return;
    }
    if (b.z > 2.9) return;
    const early = b.bt < b.T - 0.1;
    if (early) {
      // A low throw can be jumped by a defender sitting in the lane.
      if (b.bt < 0.18 || b.z > 2.3) return;
      for (const p of P) {
        if (p.side !== 1 || p.down > 0 || p.eng >= 0 || p.tipTry) continue;
        if (hyp(p.x - b.x, p.y - b.y) > 0.5) continue;
        p.tipTry = true;
        if (rng.chance((0.1 + p.hands * 0.3) * play.diff.ints * 0.6)) return intercept(play, p);
        if (rng.chance(0.5)) return incomplete(play, 'BROKEN UP');
      }
      return;
    }
    // Contest the ball where it comes down; after that, wherever it is now.
    const bx = b.bt < b.T ? b.tx : b.x, by = b.bt < b.T ? b.ty : b.y;
    const cands = [];
    for (const p of P) {
      if (p.i === QB || p.down > 0 || p.eng >= 0) continue;
      if (p.side === 0 && (OL.includes(p.i) || p.role === 'pass_pro')) continue;
      const reach = p.side === 0 ? 1.15 : 1.0;
      const d = hyp(p.x - bx, p.y - by);
      if (d <= reach) cands.push({ p, d: d - (p.side === 0 && p.track ? 0.35 : 0), raw: d, reach });
    }
    if (!cands.length) return;
    cands.sort((a, c) => a.d - c.d);
    const first = cands[0].p;
    b.resolved = true;
    const contest = cands.filter((c) => c.p.side === 1);
    const rec = cands.find((c) => c.p.side === 0);
    const oob = (p) => p.y <= 0 || p.y >= W || p.x >= C.FIELD_LEN;
    const catchChance = (c) => {
      let pc = c.p.hands + 0.05 - 0.1 * (c.raw / c.reach);
      for (const k of contest) pc -= 0.15 + k.p.cover * 0.2;
      if (play.wx.type === 'rain') pc -= 0.06;
      if (play.wx.type === 'snow') pc -= 0.03;
      return clamp(pc, 0.1, 0.97);
    };
    if (first.side === 0) {
      if (oob(first)) return incomplete(play, 'OUT OF BOUNDS');
      if (rng.chance(catchChance(cands[0]))) return catchBall(play, first);
      if (contest.length && rng.chance(0.14 * play.diff.ints)) return intercept(play, contest[0].p);
      return incomplete(play, contest.length ? 'BROKEN UP' : 'DROPPED');
    }
    let pi = (0.1 + first.hands * 0.3) * play.diff.ints;
    if (rec) pi *= 0.6;
    if (oob(first)) return incomplete(play, 'INCOMPLETE');
    if (rng.chance(pi)) return intercept(play, first);
    if (rec && !oob(rec.p) && rng.chance(catchChance(rec) * 0.5)) return catchBall(play, rec.p);
    return incomplete(play, 'BROKEN UP');
  }

  function catchBall(play, p) {
    const b = play.ball;
    b.st = 'held'; b.holder = p.i;
    play.carrier = p.i;
    play.ctrl = p.i;
    play.manual = false;
    play.stats.comp = 1;
    play.stats.receiver = p.i;
    p.track = null;
    p.role = 'carrier';
    p.slow = 0.25;
    for (const q of play.players) if (q.side === 0 && q.i !== p.i) { q.role = 'escort'; q.track = null; }
    // Defenders read the catch faster the closer they are to it.
    for (const q of play.players) {
      if (q.side !== 1) continue;
      q.readAt = play.t + (q.react || 0.25) * Math.min(1, dist(q, p) / 8);
    }
    event(play, 'catch', 'CATCH', { who: p.i });
    if (p.x >= C.GOAL_R) return touchdown(play);
    // A defender arriving with the ball gets a shot at him as he secures it.
    for (const d of play.players) {
      if (d.side !== 1 || d.eng >= 0 || d.down > 0 || dist(d, p) > 1.5) continue;
      d.tackleCd = 0.6;
      if (play.rng.chance(clamp(tackleOdds(play, d, p) - 0.12, 0.2, 0.9))) {
        event(play, 'hit', '');
        return tackled(play, p, d);
      }
      d.down = 0.5;
    }
  }

  function intercept(play, d) {
    const b = play.ball;
    b.st = 'held'; b.holder = d.i;
    play.carrier = d.i;
    play.turnover = true;
    play.stats.int = 1;
    d.role = 'returner';
    d.eng = -1;
    for (const q of play.players) {
      q.track = null;
      if (q.eng >= 0) { play.players[q.eng].eng = -1; q.eng = -1; }
    }
    setRead(play, [0]);
    event(play, 'int', 'INTERCEPTED!', { who: d.i });
  }

  function incomplete(play, text) {
    const b = play.ball;
    b.st = 'dead';
    b.resolved = true;
    b.vx = (b.tx - b.fx) / b.T * 0.3;
    b.vy = (b.ty - b.fy) / b.T * 0.3;
    b.vz = 2.2;
    for (const p of play.players) p.track = null;
    endPlay(play, { kind: 'inc', x: play.los, y: play.ballY, text, stop: true });
  }

  // --- Tackles & dead ball -------------------------------------------------------
  function checkTackles(play, dt) {
    const car = carrierP(play);
    if (!car || play.phase !== 'live') return;
    if (car.dive > 0) return;
    const rng = play.rng;
    for (const d of play.players) {
      if (d.side === car.side || d.down > 0 || d.tackleCd > 0) continue;
      const dd = dist(d, car);
      const r = d.eng >= 0 ? 0.62 : 0.88;
      if (dd <= r) {
        if (car.juke > 0 && d.eng < 0) {
          d.down = 0.9;
          d.tackleCd = 0.9;
          event(play, 'juke', '');
          continue;
        }
        let p = tackleOdds(play, d, car);
        if (d.eng >= 0) p *= 0.4;
        if (car.i === QB && !play.scramble && play.ball.holder === QB) p += 0.12;
        if (rng.chance(clamp(p, 0.3, 0.97))) { tackled(play, car, d); return; }
        d.tackleCd = 0.7;
        if (d.eng < 0) d.down = 0.55;
        car.slow = 0.3;
        event(play, 'broken', '');
        continue;
      }
      // Diving tackle from just out of reach, mostly on chases from behind.
      if (dd <= 2.3 && d.eng < 0 && d.i !== play.humanDefIdx && rng.chance(dt * 2.4)) {
        d.tackleCd = 1.2;
        d.lunge = 0.3;
        const ux = (car.x - d.x) / dd, uy = (car.y - d.y) / dd;
        d.vx = ux * 8; d.vy = uy * 8;
        const p = car.juke > 0 ? 0 : tackleOdds(play, d, car) - 0.2 - (dd - 0.9) * 0.25;
        if (rng.chance(clamp(p, 0, 0.8))) {
          d.x = car.x - ux * 0.7; d.y = car.y - uy * 0.7;
          tackled(play, car, d);
          return;
        }
        d.down = 1.0;
        event(play, 'broken', '');
      }
    }
  }

  function tackleOdds(play, d, car) {
    if (d.side === 1) return 0.7 + (d.tackle - car.elus) * 0.9 + play.diff.tackle;
    return 0.64 + (d.str || 0.5) * 0.18 - car.elus * 0.2;
  }

  function tackled(play, car, d) {
    car.down = 99;
    d.down = 99;
    d.vx = car.vx * 0.5; d.vy = car.vy * 0.5;
    const fwd = car.side === 0 ? (car.vx > 1 ? 0.5 : 0.1) : (car.vx < -1 ? -0.5 : -0.1);
    const x = car.x + fwd;
    // Fumbles are rare, a little more likely for weak or tired carriers.
    let pf = 0.009 * (1.4 - (car.str || 0.5));
    if (car.i === QB && !play.scramble) pf = 0.05;
    if (play.wx.type === 'rain') pf *= 1.6;
    if (play.rng.chance(pf) && !play.turnover) {
      const defRecovers = play.rng.chance(0.55);
      event(play, 'fumble', 'FUMBLE!');
      if (defRecovers) {
        play.stats.fum = 1;
        endPlay(play, { kind: 'fumble', x, y: car.y, text: 'FUMBLE! LOST', stop: true, turnover: true });
        return;
      }
      event(play, 'fumble', 'RECOVERED');
    }
    deadAt(play, car, x, 'tackle');
  }

  function deadAt(play, car, x, how) {
    const y = car.y;
    if (play.turnover) {
      if (x >= C.GOAL_R) return endPlay(play, { kind: 'int_tb', x, y, text: 'TOUCHBACK', stop: true, turnover: true });
      return endPlay(play, { kind: 'int', x, y, text: play.events.some((e) => e.type === 'int') ? 'INTERCEPTED!' : 'TURNOVER', stop: true, turnover: true });
    }
    if (x <= C.GOAL_L) return endPlay(play, { kind: 'safety', x, y, text: 'SAFETY!', stop: true });
    const sack = car.i === QB && !play.scramble && !play.thrown && play.kind === 'pass' && x < play.los;
    if (sack) play.stats.sack = 1;
    endPlay(play, { kind: how === 'oob' ? 'oob' : sack ? 'sack' : 'tackle', x, y, text: sack ? 'SACKED!' : how === 'oob' ? 'OUT OF BOUNDS' : '', stop: how === 'oob' });
  }

  function touchdown(play) {
    const car = carrierP(play);
    endPlay(play, { kind: 'td', x: C.GOAL_R, y: car ? car.y : play.ballY, text: 'TOUCHDOWN!', stop: true });
  }

  function endPlay(play, res) {
    if (play.phase !== 'live') return;
    play.phase = 'dead';
    play.deadT = 0;
    const st = play.stats;
    const yds = Math.round(clamp(res.x, C.GOAL_L, C.GOAL_R) - play.los);
    if (!play.turnover && res.kind !== 'inc') {
      if (st.comp) st.passYds = yds;
      else if (play.carrier >= 0) {
        st.rushAtt = st.sack ? 0 : 1;
        st.rushYds = st.sack ? 0 : yds;
        st.rusher = play.carrier;
      }
    }
    if (st.sack) st.sackYds = yds;
    if (res.kind === 'fumble' && st.comp) st.passYds = yds;
    res.yds = yds;
    res.stats = st;
    res.carrier = play.carrier;
    play.result = res;
    event(play, 'dead', res.text || '');
    if (play.ball.st === 'held') play.ball.st = 'down';
  }

  function checkBounds(play) {
    const car = carrierP(play);
    if (!car || play.phase !== 'live') return;
    if (car.side === 0 && !play.turnover) {
      if (car.x >= C.GOAL_R && play.ball.holder === car.i) return touchdown(play);
      if (car.i === QB && !play.scramble && car.x > play.los + 0.3) {
        play.scramble = true;
        setRead(play, [1]);
      }
    }
    if (play.turnover && car.x <= C.GOAL_L) {
      return endPlay(play, { kind: 'int_td', x: C.GOAL_L, y: car.y, text: 'PICK SIX!', stop: true, turnover: true });
    }
    if (car.y <= 0.05 || car.y >= W - 0.05 || car.x < 0.2 || car.x > C.FIELD_LEN - 0.2) {
      car.y = clamp(car.y, 0, W);
      deadAt(play, car, car.x, 'oob');
    }
  }

  // --- Physics -----------------------------------------------------------------
  function integrate(p, accel, dt) {
    let ax = p.dvx - p.vx, ay = p.dvy - p.vy;
    const a = hyp(ax, ay), m = accel * dt;
    if (a > m) { ax *= m / a; ay *= m / a; }
    p.vx += ax; p.vy += ay;
    p.x += p.vx * dt; p.y += p.vy * dt;
  }

  function separate(play) {
    const P = play.players;
    for (let i = 0; i < 22; i++) {
      const a = P[i];
      for (let j = i + 1; j < 22; j++) {
        const b = P[j];
        if (a.eng === j || a.down > 5 || b.down > 5) continue;
        if ((a.i === play.carrier || b.i === play.carrier) && a.side !== b.side) continue;
        const dx = b.x - a.x, dy = b.y - a.y, d = hyp(dx, dy);
        if (d > 0.78 || d < 1e-4) continue;
        const push = (0.78 - d) / 2;
        const ux = dx / d, uy = dy / d;
        const wa = a.eng >= 0 || a.track ? 0.2 : 1, wb = b.eng >= 0 || b.track ? 0.2 : 1;
        a.x -= ux * push * wa; a.y -= uy * push * wa;
        b.x += ux * push * wb; b.y += uy * push * wb;
      }
    }
  }

  // --- Input for the controlled player -----------------------------------------
  function applyUserInput(play, input, dt) {
    const P = play.players;
    const b = play.ball;
    if (play.phase !== 'live') return;
    if (input.throwAt && canThrow(play)) throwBall(play, input.throwAt.x, input.throwAt.y);

    const car = carrierP(play);
    const ctrl = car && car.side === 0 && !play.turnover ? car : null;
    if (!ctrl) return false;
    if (ctrl.i === RBK && ctrl.role === 'runpath' && !play.handedOff) return false;
    const spd = effSpeed(play, ctrl);

    if (ctrl.dive > 0) {
      ctrl.dive -= dt;
      steerDir(ctrl, ctrl.divX, ctrl.divY, spd * 1.25);
      if (ctrl.dive <= 0) {
        ctrl.down = 99;
        if (ctrl.x >= C.GOAL_R && !play.turnover) touchdown(play);
        else deadAt(play, ctrl, ctrl.x, 'tackle');
      }
      return true;
    }
    if (input.dive && (ctrl.i !== QB || play.scramble)) {
      ctrl.dive = 0.36;
      const d = hyp(input.dive.x, input.dive.y) || 1;
      ctrl.divX = input.dive.x / d; ctrl.divY = input.dive.y / d;
      event(play, 'dive', '');
      return true;
    }
    if (input.juke && ctrl.jukeCd <= 0) {
      const threat = nearestOpp(play, ctrl, 6);
      let px = -ctrl.vy, py = ctrl.vx;
      const pl = hyp(px, py);
      if (pl < 0.5) { px = 0; py = 1; } else { px /= pl; py /= pl; }
      if (threat && (threat.x - ctrl.x) * px + (threat.y - ctrl.y) * py > 0) { px = -px; py = -py; }
      ctrl.vx += px * 4.5; ctrl.vy += py * 4.5;
      ctrl.juke = 0.42;
      ctrl.jukeCd = 1.15;
      event(play, 'jukeMove', '');
    }
    if (input.aiming && ctrl.i === QB && canThrow(play)) {
      ctrl.dvx = 0; ctrl.dvy = 0;
      return true;
    }
    if (input.joy) {
      play.manual = true;
      steerDir(ctrl, input.joy.x, input.joy.y, spd * Math.min(1, hyp(input.joy.x, input.joy.y)));
      if (ctrl.i === QB) ctrl.drop = { x: ctrl.x, y: ctrl.y };
      return true;
    }
    if (ctrl.i === QB && !play.scramble) return false; // QB holds his spot in the pocket
    if (ctrl.i === RBK && ctrl.role === 'runpath' && !play.manual && ctrl.wp < ctrl.path.length - 1) return false;
    // No input: keep running upfield, straightening out.
    const lat = clamp(ctrl.vy / Math.max(1, spd), -0.6, 0.6) * 0.55;
    steerDir(ctrl, 1, lat, spd);
    return true;
  }

  function applyDefenderInput(play, input) {
    const i = play.humanDefIdx;
    if (i < 11 || !input.defJoy || play.phase !== 'live') return false;
    const p = play.players[i];
    if (p.eng >= 0 || p.down > 0) return false;
    if (play.turnover && play.carrier === i) {
      steerDir(p, input.defJoy.x, input.defJoy.y, effSpeed(play, p));
      return true;
    }
    steerDir(p, input.defJoy.x, input.defJoy.y, effSpeed(play, p) * Math.min(1, hyp(input.defJoy.x, input.defJoy.y)));
    return true;
  }

  // --- Main step -----------------------------------------------------------------
  function step(play, dt, input) {
    input = input || {};
    const P = play.players;
    if (play.phase === 'pre') return;
    play.t += dt;
    for (const p of P) {
      p.stun = Math.max(0, p.stun - dt);
      p.shedCd = Math.max(0, p.shedCd - dt);
      p.tackleCd = Math.max(0, p.tackleCd - dt);
      p.juke = Math.max(0, p.juke - dt);
      p.jukeCd = Math.max(0, p.jukeCd - dt);
      p.slow = Math.max(0, p.slow - dt);
      if (p.lunge) p.lunge = Math.max(0, p.lunge - dt);
      if (p.down > 0 && p.down < 50) p.down = Math.max(0, p.down - dt);
    }

    if (play.phase === 'dead') {
      play.deadT += dt;
      for (const p of P) {
        const f = p.down > 5 ? 0.86 : 0.93;
        p.vx *= f; p.vy *= f;
        p.x += p.vx * dt; p.y += p.vy * dt;
      }
      updateBall(play, dt);
      return;
    }

    // Handoff on run plays.
    if (play.kind === 'run' && !play.handedOff && play.ball.st === 'held') {
      const q = P[QB], rb = P[RBK];
      if ((play.t > 0.3 && dist(q, rb) < 1.5) || play.t > 1.1) {
        play.handedOff = true;
        play.ball.holder = RBK;
        play.carrier = RBK;
        play.ctrl = RBK;
        setRead(play, [1]);
        event(play, 'handoff', '');
      }
    }

    if (play.kind === 'pass' && !play.thrown) assignProtection(play);
    const userMoved = applyUserInput(play, input, dt);
    const defMoved = applyDefenderInput(play, input);
    if (play.phase !== 'live') return;
    const car = carrierP(play);
    for (const p of P) {
      if (p.down > 0) { p.dvx = 0; p.dvy = 0; continue; }
      if (userMoved && car && p === car && !play.turnover) continue;
      if (defMoved && p.i === play.humanDefIdx) continue;
      if (p.side === 0) {
        if (p === car && !play.turnover && p.role !== 'runpath' && p.role !== 'qb' && p.role !== 'handoff') {
          const spd = effSpeed(play, p);
          steerDir(p, 1, clamp(p.vy / Math.max(1, spd), -0.6, 0.6) * 0.55, spd);
        } else aiOffense(play, p);
      } else aiDefense(play, p);
    }
    tryEngage(play);
    for (const p of P) {
      if (p.eng >= 0) continue;
      const acc = p.i === play.carrier ? 14 : p.side === 0 ? 11 : 10.5;
      integrate(p, acc, dt);
      if (Math.abs(p.vx) > 0.3) p.face = p.vx > 0 ? 1 : -1;
      if (p.i !== play.carrier) p.y = clamp(p.y, -1.5, W + 1.5);
    }
    updatePairs(play, dt);
    separate(play);
    updateBall(play, dt);
    if (play.phase === 'live') checkTackles(play, dt);
    if (play.phase === 'live') checkBounds(play);

    for (const p of P) {
      const h = play.hist[p.i];
      h.unshift({ x: p.x, y: p.y, vx: p.vx, vy: p.vy });
      if (h.length > 40) h.pop();
    }
  }

  // --- AI play calling (defense and the auto QB used by tests) ------------------
  function aiDefCall(rng, ctx) {
    const { down, toGo, ballOn, lead, secsLeft, q } = ctx;
    const w = { man: 3, zone: 4, blitz: 1.5, prevent: 0.3 };
    if (down === 3 && toGo >= 7) { w.blitz += 1.5; w.zone += 1; }
    if (toGo <= 2) { w.man += 2; w.blitz += 1; }
    if (ballOn > 85) { w.man += 1.5; w.prevent = 0; }
    if (q >= 4 && lead > 0 && lead <= 16 && secsLeft < 120) w.prevent += 4;
    if (q === 2 && secsLeft < 40) w.prevent += 2;
    const tot = w.man + w.zone + w.blitz + w.prevent;
    let r = rng.next() * tot;
    for (const k of DEF_CALLS) { r -= w[k]; if (r <= 0) return k; }
    return 'zone';
  }

  RB.Sim = {
    IDX: { QB, RBK, OC, LG, RG, LT, RT, TE, WR1, WR2, WR3, DE1, DT1, DT2, DE2, LB1, LB2, LB3, CB1, CB2, S1, S2 },
    OL, ELIGIBLE, DIFF, DEF_CALLS, ROUTES,
    createPlay, setDefense, snap, step, canThrow, throwBall, clampAim, flightTime, maxRange, aiDefCall, predictRoute,
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* src/kick.js */
/* Rivalry Bowl: field goal / extra point minigame.
 * Coordinates: x = lateral yards (+ right), d = yards downfield from the
 * hold spot, h = height in yards. The uprights stand at d = dist. */
(function (root) {
  'use strict';
  const RB = root.RB;
  const G = RB.C.GRAVITY;
  const THETA = (38 * Math.PI) / 180;
  const HALF_W = 3.08; // 18'6" between uprights
  const BAR = 3.33; // 10' crossbar

  // Launch speed needed to clear the bar at distance D (no wind).
  function speedFor(D) {
    const c = Math.cos(THETA), t = Math.tan(THETA);
    const den = 2 * c * c * (D * t - BAR);
    return den > 0 ? Math.sqrt((G * D * D) / den) : 99;
  }

  function create(o) {
    const mph = o.wx ? o.wx.wind : 0;
    const ang = o.wx ? o.wx.windDir : 0;
    const k = {
      type: o.type, dist: o.dist, kicker: o.kicker,
      windMph: mph, windAng: ang,
      windLat: Math.sin(ang) * mph, windAlong: Math.cos(ang) * mph,
      vmax: speedFor(o.kicker.power + 4),
      phase: 'aim', t: 0, doneT: 0,
      ball: { x: 0, d: 0, h: 0.25, vx: 0, vd: 0, vh: 0 },
      judged: false, result: null, resultText: '',
      aim: 0, power: 0,
    };
    k.need = Math.min(1.2, speedFor(o.dist) / k.vmax);
    return k;
  }

  function launch(k, aim, power, rng) {
    if (k.phase !== 'aim') return;
    aim = Math.max(-1, Math.min(1, aim || 0));
    power = Math.max(0.05, Math.min(1.08, power || 0));
    k.aim = aim;
    k.power = power;
    let yaw = (aim * 9 * Math.PI) / 180;
    const sigma = ((1 - k.kicker.acc) * 3.2 + (power > 0.98 ? 1.6 : 0)) * (Math.PI / 180);
    yaw += (rng ? rng.gauss() : 0) * sigma;
    const v = k.vmax * power;
    k.ball.vx = v * Math.cos(THETA) * Math.sin(yaw);
    k.ball.vd = v * Math.cos(THETA) * Math.cos(yaw);
    k.ball.vh = v * Math.sin(THETA);
    k.phase = 'fly';
    k.t = 0;
    if (rng && rng.chance(k.type === 'xp' ? 0.008 : 0.015)) {
      k.blocked = true;
      k.ball.vd *= 0.25;
      k.ball.vh *= 0.35;
      k.ball.vx += (rng.next() - 0.5) * 4;
    }
  }

  function judge(k, text, good) {
    k.judged = true;
    k.result = good ? 'good' : 'miss';
    k.resultText = text;
  }

  function update(k, dt) {
    if (k.phase === 'aim') return;
    if (k.phase === 'done') { k.doneT += dt; }
    const b = k.ball;
    if (b.h <= 0 && k.t > 0.1) {
      b.vx = b.vd = b.vh = 0;
      if (!k.judged) judge(k, k.blocked ? 'BLOCKED' : 'SHORT', false);
      k.phase = 'done';
      return;
    }
    k.t += dt;
    b.vx += k.windLat * 0.045 * dt;
    b.vd += k.windAlong * 0.03 * dt;
    b.vh -= G * dt;
    const pd = b.d;
    b.x += b.vx * dt;
    b.d += b.vd * dt;
    b.h += b.vh * dt;
    if (!k.judged && pd < k.dist && b.d >= k.dist) {
      if (k.blocked) judge(k, 'BLOCKED', false);
      else if (b.h < BAR) judge(k, 'SHORT', false);
      else if (b.x < -HALF_W) judge(k, 'WIDE LEFT', false);
      else if (b.x > HALF_W) judge(k, 'WIDE RIGHT', false);
      else judge(k, 'GOOD', true);
    }
    if (k.judged && k.phase === 'fly' && (k.t > 3.2 || b.d > k.dist + 12)) k.phase = 'done';
  }

  // Dotted preview of a kick for the current drag (no wind, no error).
  function preview(k, aim, power, n) {
    const pts = [];
    const yaw = (Math.max(-1, Math.min(1, aim)) * 9 * Math.PI) / 180;
    const v = k.vmax * Math.max(0.05, Math.min(1.08, power));
    const vx = v * Math.cos(THETA) * Math.sin(yaw), vd = v * Math.cos(THETA) * Math.cos(yaw), vh = v * Math.sin(THETA);
    const T = (2 * vh) / G;
    for (let i = 1; i <= (n || 14); i++) {
      const t = (T * i) / (n || 14);
      const d = vd * t;
      if (d > k.dist + 6) break;
      pts.push({ x: vx * t, d, h: vh * t - 0.5 * G * t * t });
    }
    return pts;
  }

  RB.Kick = { create, launch, update, preview, HALF_W, BAR };
})(typeof window !== 'undefined' ? window : globalThis);
