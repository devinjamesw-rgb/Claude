        if (!this.disp || this.disp.length !== 22) this.disp = s.players.map((p) => Object.assign({ vx: 0, vy: 0 }, p));
        this.disp = s.players.map((p, i) => {
          const d = this.disp[i];
          const jump = Math.hypot(p.x - d.x, p.y - d.y) > 6;
          const f = jump ? 1 : 0.35;
          const nx = d.x + (p.x - d.x) * f, ny = d.y + (p.y - d.y) * f;
          const vx = jump ? 0 : (nx - d.x) / dt, vy = jump ? 0 : (ny - d.y) / dt;
          const skin = rt.rosters[i < 11 ? g.poss : 1 - g.poss][i < 11 ? 'off' : 'def'][i % 11].skin;
          return Object.assign({}, p, { x: nx, y: ny, vx: vx * 0.5 + d.vx * 0.5, vy: vy * 0.5 + d.vy * 0.5, skin });
        });
        V.players = this.disp;
        const b = s.ball;
        this.dispBall = this.dispBall && Math.hypot(b.x - this.dispBall.x, b.y - this.dispBall.y) < 8
          ? { x: this.dispBall.x + (b.x - this.dispBall.x) * 0.45, y: this.dispBall.y + (b.y - this.dispBall.y) * 0.45, z: this.dispBall.z + (b.z - this.dispBall.z) * 0.45, st: b.st, visible: true }
          : Object.assign({}, b);
        V.ball = this.dispBall;
        V.carrier = s.carrier;
        V.los = s.los;
        V.fdX = g.twoPt ? null : s.fdX;
        V.ballY = s.ballY;
        V.live = s.live;
        V.turnover = s.turnover;
        V.landing = s.landing;
        if (inp) V.joy = inp.joyScreen;
      }
      return V;
    },

    controls() {
      const G = this.G;
      if (!G || this.isAuthority()) return null;
      const g = G.g, esc = RB.UI.esc;
      const opp = g.names[1 - this.seat];
      if (g.phase === 'presnap' && g.poss !== this.seat) {
        const picked = this.dcPick && this.dcPick.play === g.playNo ? this.dcPick.call : null;
        const label = { man: 'Man', zone: 'Zone', blitz: 'Blitz', prevent: 'Prevent' };
        const btns = Sim.DEF_CALLS.map((c) => `<button class="btn small ${picked === c ? '' : 'ghost'}" type="button" data-action="defcall" data-call="${c}">${label[c]}</button>`).join('');
        const to = Game.canTimeout(g, this.seat) ? `<button class="btn small ghost" type="button" data-action="timeout" data-seat="${this.seat}">Timeout (${g.to[this.seat]})</button>` : '';
        return { key: `def|${g.playNo}|${picked}|${g.to}|${g.clockRunning}`, html: `<div class="who">DEFENSE · PICK A COVERAGE · TAP A DEFENDER TO STEER HIM</div><div class="row">${btns}${to}</div>` };
      }
      const waitFor = { pat: 'is choosing the try', kickchoice: 'is choosing the kickoff', kick: 'is kicking', presnap: 'is calling a play' }[g.phase];
      if (waitFor) return { key: `wait|${g.phase}|${g.ctl}`, html: `<div class="who">${esc(opp)} ${waitFor}…</div>` };
      return null;
    },

    overlay() {
      if (this.state !== 'playing') return null;
      if (Date.now() - this.partnerSeen > LOST_MS) {
        return { key: 'lost', html: `<div class="panel" style="max-width:420px"><p class="eyebrow">CONNECTION</p><h2>Your opponent dropped</h2><p class="muted">Waiting for them to come back. The game resumes on its own if they return to this page.</p><div class="row end"><button class="btn ghost" type="button" data-action="quit">Leave game</button></div></div>` };
      }
      return null;
    },

    // --- Lobby screen ---
    syncLobby() {
      const UI = RB.UI, esc = UI.esc, A = this.App;
      const t = RB.TEAM_BY_ID[A.picks[0]];
      let body = '', key = this.state;
      if (this.state === 'connecting') body = '<p class="status">Connecting to the game room…</p>';
      else if (this.state === 'unavailable') {
        key += this.err;
        body = `<p class="status err">Online play isn't available here.</p>
          <p>It runs through claude.ai: both of you open this same page while signed in, and the owner shares it with the other player. Opened anywhere else, only Pass &amp; Play works.</p>
          <div class="row end"><button class="btn" type="button" data-action="fallback">Play Pass &amp; Play instead</button></div>`;
      } else if (this.state === 'lobby') {
        const hosts = this.others().filter((p) => p.presence.role === 'host' && p.presence.open);
        key += hosts.map((h) => h.peer + h.presence.tm).join();
        const list = hosts.length
          ? hosts.map((h) => {
            const ht = RB.TEAM_BY_ID[h.presence.tm];
            return `<div class="lobby-item"><span><b>${esc(h.presence.nm || 'PLAYER')}</b> · ${esc(ht ? ht.name : '')} · ${Math.round((h.presence.q || 240) / 60)} MIN QTRS</span><button class="btn small" type="button" data-action="join" data-peer="${esc(h.peer)}" data-code="${esc(h.presence.code || '')}">Join</button></div>`;
          }).join('')
          : '<p class="status">No open games yet. Host one, or wait for your friend to host.</p>';
        body = `<div class="lobby-list">${list}</div><div class="row end"><button class="btn" type="button" data-action="host">Host a game</button></div>`;
      } else if (this.state === 'hosting') {
        key += this.code;
        body = `<p>Hosting as <b>${esc(A.names[0])}</b> with ${esc(t ? t.name : '')}.</p>
          <p class="status ok">Waiting for your friend… game <span class="code">${esc(this.code)}</span></p>
          <p class="muted">They open this same page, tap Online, pick a school and join your game. Quarter length and AI difficulty come from your settings.</p>
          <div class="row end"><button class="btn ghost" type="button" data-action="cancel">Cancel</button></div>`;
      } else if (this.state === 'joining') {
        key += this.code;
        body = `<p class="status ok">Joining game <span class="code">${esc(this.code)}</span>…</p><div class="row end"><button class="btn ghost" type="button" data-action="cancel">Cancel</button></div>`;
      }
      UI.show('lobby|' + key, `<div class="panel" style="max-width:560px"><p class="eyebrow">ONLINE · ${esc(A.names[0])} · ${esc(t ? t.name : '')}</p><h2>Head to head</h2>${body}
        ${this.state === 'lobby' || this.state === 'connecting' ? '<div class="row"><button class="btn ghost small" type="button" data-action="back">Back</button></div>' : ''}</div>`);
    },
  };

  RB.Net = Net;
  RB.NetCodec = { encodePlay, decodePlay, compactG };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* src/ui.js */
/* Rivalry Bowl: DOM screens and in-game controls. Pure rendering of HTML;
 * every button carries data-action, handled by main.js. */
(function (root) {
  'use strict';
  const RB = root.RB;
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

  let screenEl, controlsEl, hintEl, pauseEl;
  let screenKey = null, controlsKey = null, hintKey = null;

  function init() {
    screenEl = document.getElementById('screen');
    controlsEl = document.getElementById('controls');
    hintEl = document.getElementById('hint');
    pauseEl = document.getElementById('pause');
  }

  function stars(v) {
    const full = Math.floor(v), half = v - full >= 0.5;
    return '★'.repeat(full) + (half ? '½' : '') + '<span class="muted">' + '☆'.repeat(5 - full - (half ? 1 : 0)) + '</span>';
  }

  function seg(id, label, value, options) {
    return `<div class="setting"><span>${label}</span><div class="seg" role="group" aria-label="${esc(label)}">${options
      .map(([v, l]) => `<button type="button" data-action="set" data-key="${id}" data-val="${v}" aria-pressed="${String(v) === String(value)}">${l}</button>`)
      .join('')}</div></div>`;
  }

  // --- Screens ------------------------------------------------------------------
  function title(s) {
    return `<div class="title">
      <h1 class="logo">RIVALRY<span class="b">BOWL</span></h1>
      <p class="tag">Head-to-head college football. Pull back to throw, race for the end zone, hand the phone over.</p>
      <div class="menu">
        <button class="btn big" type="button" data-action="local">Pass &amp; Play<small>One phone. You each drive on offense and swap on every change of possession.</small></button>
        <button class="btn big alt" type="button" data-action="online">Online<small>Two phones. The defense picks the coverage and steers a safety.</small></button>
      </div>
      <div class="panel settings">
        ${seg('qlen', 'QUARTER LENGTH', s.qlen, [[120, '2 MIN'], [180, '3'], [240, '4'], [300, '5'], [420, '7']])}
        ${seg('diff', 'AI DEFENSE', s.diff, [[0, 'EASY'], [1, 'NORMAL'], [2, 'HARD']])}
        ${seg('even', 'TEAM RATINGS', s.even ? 1 : 0, [[0, 'REAL'], [1, 'EVEN']])}
        ${seg('sound', 'SOUND', s.sound ? 1 : 0, [[1, 'ON'], [0, 'OFF']])}
      </div>
      <div class="row"><button class="btn ghost" type="button" data-action="howto">How to play</button></div>
    </div>`;
  }

  function teams(step, picks, names, even, online) {
    const who = online ? 'YOUR SCHOOL' : `PLAYER ${step + 1} · ${step === 0 ? 'HOME' : 'AWAY'}`;
    const cur = picks[step];
    const other = online ? null : picks[1 - step];
    const tiles = RB.TEAMS.map((t) => {
      const st = RB.teamStars(t, even);
      return `<button type="button" class="tile" data-action="pick" data-team="${t.id}" aria-pressed="${cur === t.id}" data-taken="${other === t.id && step === 1}">
        <span class="sw"><i style="background:${t.jersey}"></i><i style="background:${t.helmet}"></i><i style="background:${t.trim}"></i></span>
        <span class="nm">${esc(t.name)}</span><span class="st">${stars(st.ovr)}</span></button>`;
    }).join('');
    let detail = '<p class="muted">Pick a school.</p>';
    if (cur) {
      const t = RB.TEAM_BY_ID[cur];
      const st = RB.teamStars(t, even);
      const r = even ? { qb: 82, rb: 82, wr: 82, ol: 82, dl: 82, lb: 82, db: 82, k: 80 } : t.r;
      detail = `<div class="detail"><canvas id="helmet" width="9" height="12" aria-hidden="true"></canvas><div>
        <h2 style="margin-bottom:6px">${esc(t.name)}</h2>
        <p>OFF ${stars(st.off)}<br>DEF ${stars(st.def)}</p>
        <div class="ratings"><span>QB <b>${r.qb}</b></span><span>RB <b>${r.rb}</b></span><span>WR <b>${r.wr}</b></span><span>OL <b>${r.ol}</b></span>
        <span>DL <b>${r.dl}</b></span><span>LB <b>${r.lb}</b></span><span>DB <b>${r.db}</b></span><span>K <b>${r.k}</b></span></div></div></div>`;
    }
    return `<div class="panel teams">
      <header><div><p class="eyebrow">${who}</p><h2 style="margin:0">Pick your school</h2></div>
        <label class="row"><span class="muted">NAME</span><input class="name-in" id="name-in" maxlength="10" value="${esc(names[step])}" autocomplete="off" spellcheck="false"></label></header>
      <div class="teams-body"><div class="grid">${tiles}</div>
      <div class="side">${detail}
      <div class="row end"><button class="btn ghost" type="button" data-action="back">Back</button>
      <button class="btn" type="button" data-action="lock" ${cur ? '' : 'disabled'}>${online ? 'Continue' : step === 0 ? 'Lock in' : 'Kick off'}</button></div></div></div>
    </div>`;
  }

  function handoff(G) {
    const g = G.g, s = g.ctl, t = RB.Game.team(G, s);
    const pat = g.afterHandoff === 'pat';
    const sit = pat ? 'Extra point try' : g.twoPt ? '2-point try' : `${RB.Game.downText(g)} at ${RB.Game.spotText(g.ballOn)}`;
    const u = G.rt.uniforms[s];
    const col = u.jersey === '#f4f4f4' ? u.trim : u.jersey;
    return `<div class="panel" style="text-align:center;border-color:${col}">
      <p class="eyebrow">PASS THE PHONE</p>
      <h2>${esc(g.names[s])}</h2>
      <p style="font-size:26px">${esc(t.name)} ball · ${esc(sit)}</p>
      <p class="muted">${esc(RB.Game.team(G, 0).name)} ${g.score[0]} · ${esc(RB.Game.team(G, 1).name)} ${g.score[1]} · ${RB.Game.periodText(g)} ${g.ot ? '' : RB.Game.fmtClock(g.clock)}</p>
      <div class="row center"><button class="btn big" type="button" data-action="ready" style="align-items:center">I have the phone</button></div>
    </div>`;
  }

  function statsTable(G) {
    const g = G.g, s = g.stats;
    const T = [RB.Game.team(G, 0), RB.Game.team(G, 1)];
    const row = (label, f) => `<tr><td>${label}</td><td>${f(s[0])}</td><td>${f(s[1])}</td></tr>`;
    return `<table class="box"><thead><tr><th></th><th>${esc(T[0].id)}</th><th>${esc(T[1].id)}</th></tr></thead><tbody>
      ${row('Passing', (x) => `${x.pc}/${x.pa}, ${x.py}`)}
      ${row('Rushing', (x) => `${x.ra}, ${x.ry}`)}
      ${row('Total yards', (x) => x.py + x.ry)}
      ${row('First downs', (x) => x.fd)}
      ${row('Turnovers', (x) => x.to)}
      ${row('Sacked', (x) => x.sk)}
      ${row('Field goals', (x) => `${x.fgm}/${x.fga}`)}
    </tbody></table>`;
  }

  function scoreBig(G) {
    const g = G.g;
    return `<div class="score-big"><span>${esc(RB.Game.team(G, 0).id)}</span><span class="s">${g.score[0]}</span><span class="muted">–</span><span class="s">${g.score[1]}</span><span>${esc(RB.Game.team(G, 1).id)}</span></div>`;
  }

  function halftime(G, canContinue) {
    return `<div class="panel"><p class="eyebrow">HALFTIME</p>${scoreBig(G)}${statsTable(G)}
      <div class="row end">${canContinue ? '<button class="btn" type="button" data-action="continue">Start 2nd half</button>' : '<span class="status">Waiting for the host to start the 2nd half</span>'}</div></div>`;
  }

  function final(G, online) {
    const g = G.g;
    const w = g.score[0] > g.score[1] ? 0 : 1;
    const ot = g.ot ? ` in ${g.ot.n > 1 ? g.ot.n + ' overtimes' : 'overtime'}` : '';
    return `<div class="panel"><p class="eyebrow">FINAL${g.ot ? ' · OT' : ''}</p>
      <h2>${esc(g.names[w])} and ${esc(RB.Game.team(G, w).name)} win${ot}</h2>
      ${scoreBig(G)}${statsTable(G)}
      <div class="row end"><button class="btn ghost" type="button" data-action="menu">Main menu</button>
      ${online ? '' : '<button class="btn" type="button" data-action="rematch">Rematch</button>'}</div></div>`;
  }

  function pause(online) {
    return `<div class="panel" style="max-width:360px"><p class="eyebrow">PAUSED</p>
      <p class="muted">${online ? 'The game keeps running for your opponent.' : 'The clock is stopped.'}</p>
      <div class="stack"><button class="btn" type="button" data-action="resume">Resume</button>
      <button class="btn ghost" type="button" data-action="quit">Quit game</button></div></div>`;
  }

  function howto() {
    return `<div class="panel howto"><p class="eyebrow">HOW TO PLAY</p>
      <dl>
        <dt>SNAP</dt><dd>Pick PASS or RUN. The ball is snapped right away. On 4th down you can also punt or kick a field goal.</dd>
        <dt>THROW</dt><dd>Touch anywhere and pull <b>back</b>, away from the end zone, like a slingshot. The dotted arc shows where the ball will land. Release to throw. Lead your receiver: the ball goes where you aim, not where he is now.</dd>
        <dt>SCRAMBLE</dt><dd>Drag <b>forward</b> to run with the QB. Once he crosses the line he can't throw.</dd>
        <dt>RUN</dt><dd>After a catch or handoff the runner keeps going upfield. Drag to steer, tap to juke, flick to dive.</dd>
        <dt>KICK</dt><dd>Drag down for power and sideways to aim (the ball goes the opposite way). Clear the white line on the power bar and watch the wind.</dd>
        <dt>HEAD TO HEAD</dt><dd>Pass &amp; Play: each of you plays your own offense against the computer's defense; hand the phone over on every change of possession. Online: the defense player calls the coverage and can steer the highlighted safety.</dd>
        <dt>CLOCK</dt><dd>The clock runs between plays after tackles in bounds. Snap quickly to save time. Incompletions, out of bounds, scores and timeouts stop it. Overtime uses college rules.</dd>
      </dl>
      <div class="row end"><button class="btn" type="button" data-action="back">Got it</button></div></div>`;
  }

  // --- Mounting helpers -----------------------------------------------------------
  function show(key, html, clear) {
    if (key === screenKey) return false;
    screenKey = key;
    if (!html) {
      screenEl.hidden = true;
      screenEl.innerHTML = '';
      return true;
    }
    screenEl.hidden = false;
    screenEl.className = 'screen' + (clear ? ' clear' : '');
    screenEl.innerHTML = html;
    screenEl.scrollTop = 0;
    return true;
  }
  function controls(key, html, portrait) {
    if (key === controlsKey) return;
    controlsKey = key;
    controlsEl.hidden = !html;
    controlsEl.className = portrait ? 'portrait' : '';
    controlsEl.innerHTML = html || '';
  }
  function hint(text) {
    if (text === hintKey) return;
    hintKey = text;
    hintEl.hidden = !text;
    hintEl.textContent = text || '';
  }
  function showPause(v) {
    pauseEl.hidden = !v;
  }
  function invalidate() {
    screenKey = null;
    controlsKey = null;
  }

  RB.UI = { init, show, controls, hint, showPause, invalidate, esc, title, teams, handoff, halftime, final, pause, howto, stars };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* src/main.js */
/* Rivalry Bowl: app controller. Screens, the frame loop, and glue between
 * the game, renderer, input, UI, audio and the network. */
(function () {
  'use strict';
  const RB = window.RB;
  const { C, Sim, Game, Render, Input, UI } = RB;
  const DT = C.DT;

  const store = {
    get(k, d) {
      try {
        const v = localStorage.getItem('rivalry.' + k);
        return v == null ? d : JSON.parse(v);
      } catch (e) {
        return d;
      }
    },
    set(k, v) {
      try { localStorage.setItem('rivalry.' + k, JSON.stringify(v)); } catch (e) { /* storage is optional */ }
    },
  };

  const App = {
    screen: 'title', back: 'title',
    settings: Object.assign({ qlen: 240, diff: 1, even: false, sound: true }, store.get('settings', {})),
    picks: [null, null],
    names: store.get('names', ['PLAYER 1', 'PLAYER 2']),
    step: 0,
    G: null, mode: 'local', paused: false,
    demo: null, demoBot: { rng: RB.makeRng(4), patience: 1.2 },
    once: { throwAt: null, juke: false, dive: null },
    acc: 0, last: 0, cheer: 0,
    net: null,
    lastInput: null,
  };
  RB.App = App;

  // --- Boot --------------------------------------------------------------------------
  function start(hot) {
    const canvas = document.getElementById('game');
    Render.init(canvas);
    UI.init();
    RB.Audio.setOn(App.settings.sound);
    const app = document.getElementById('app');
    const doResize = () => Render.resize(app.clientWidth, app.clientHeight);
    doResize();
    if (window.ResizeObserver) new ResizeObserver(doResize).observe(app);
    window.addEventListener('orientationchange', () => setTimeout(doResize, 200));
    Input.attach(canvas, inputContext);
    document.addEventListener('click', onClick);
    document.addEventListener('input', onInput);
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && App.screen === 'game' && App.mode === 'local') App.paused = true;
    });
    if (hot && hot.g && hot.mode === 'local') resumeLocal(hot);
    else newDemo();
    try {
      window.claude?.hot?.snapshot?.(() => ({
        mode: App.screen === 'game' ? App.mode : null,
        g: App.screen === 'game' && App.mode === 'local' && App.G ? App.G.g : null,
        names: App.names,
      }));
    } catch (e) { /* hot reload is optional */ }
    requestAnimationFrame(loop);
  }

  function resumeLocal(hot) {
    const G = { g: hot.g, rt: null };
    Game.initRuntime(G);
    Game.resume(G);
    App.G = G;
    App.mode = 'local';
    App.screen = 'game';
    App.paused = true;
  }

  // --- Attract mode (bots play behind the menus) ------------------------------------------
  function newDemo() {
    const r = App.demoBot.rng;
    const a = r.int(0, RB.TEAMS.length - 1);
    let b = r.int(0, RB.TEAMS.length - 1);
    if (b === a) b = (a + 5) % RB.TEAMS.length;
    App.demo = Game.create({ mode: 'demo', home: RB.TEAMS[a].id, away: RB.TEAMS[b].id, settings: { qlen: 900, diff: 1 } });
  }

  function botThrow(play) {
    const P = play.players;
    let best = null, bs = -1;
    for (const i of Sim.ELIGIBLE) {
      const r = P[i];
      if (r.role !== 'route') continue;
      const q = P[0];
      let T = 0.8, g = Sim.predictRoute(play, r, T);
      for (let k = 0; k < 2; k++) { T = Sim.flightTime(q, Math.hypot(g.x - q.x, g.y - q.y)); g = Sim.predictRoute(play, r, T); }
      let sep = 99;
      for (let j = 11; j < 22; j++) sep = Math.min(sep, Math.hypot(P[j].x - g.x, P[j].y - g.y));
      if (sep > 2.6 && sep > bs && g.y > 1.5 && g.y < C.FIELD_W - 1.5) { bs = sep; best = { x: g.x, y: g.y }; }
    }
    return best;
  }

  function demoInput(G) {
    const g = G.g, bot = App.demoBot, r = bot.rng;
    const input = {};
    switch (g.phase) {
      case 'presnap':
        if (g.phaseT > 1.3) {
          let kind = r.chance(0.3) ? 'run' : 'pass';
          if (g.down === 4 && !g.twoPt) kind = Game.presnapOptions(g).some((o) => o.id === 'fg') && 100 - g.ballOn + 17 < 48 ? 'fg' : 'punt';
          bot.patience = r.range(1, 2.2);
          Game.act(G, { type: 'call', kind });
        }
        break;
      case 'play': {
        const play = G.rt.play;
        if (play && Sim.canThrow(play) && play.t > bot.patience) {
          const t = botThrow(play) || (play.t > 3.3 ? { x: play.los + 12, y: 2 } : null);
          if (t) input.throwAt = t;
        }
        break;
      }
      case 'pat': Game.act(G, { type: 'pat', choice: Game.mustGoForTwo(g) ? '2pt' : 'xp' }); break;
      case 'kick':
        if (G.rt.kick && G.rt.kick.phase === 'aim' && g.phaseT > 0.8) Game.act(G, { type: 'kick', aim: r.range(-0.1, 0.1), power: Math.min(1.05, G.rt.kick.need + 0.08) });
        break;
      case 'kickchoice': Game.act(G, { type: 'kickoff', choice: 'deep' }); break;
      case 'half': Game.act(G, { type: 'continue' }); break;
      case 'final': if (g.phaseT > 3) newDemo(); break;
    }
    return input;
  }

  // --- Game setup ----------------------------------------------------------------------
  function startLocal() {
    App.G = Game.create({
      mode: 'local', home: App.picks[0], away: App.picks[1], names: App.names.slice(),
      settings: { qlen: App.settings.qlen, diff: App.settings.diff, even: App.settings.even },
    });
    App.mode = 'local';
    App.screen = 'game';
    App.paused = false;
    App.acc = 0;
    Render.R.camInit = false;
    UI.invalidate();
  }

  function quitToMenu() {
    if (App.net) App.net.leave();
    App.G = null;
    App.screen = 'title';
    App.paused = false;
    Input.reset();
    UI.invalidate();
    if (!App.demo) newDemo();
  }

  // --- Input context ---------------------------------------------------------------------
  function inputContext() {
    if (App.screen !== 'game' || App.paused || !App.G) return 'none';
    const G = App.G, g = G.g;
    if (App.net && !App.net.canControl()) return App.net.inputContext();
    if (g.phase === 'kick') return G.rt.kick && G.rt.kick.phase === 'aim' ? 'kick' : 'none';
    if (g.phase !== 'play') return 'none';
    const play = G.rt.play;
    if (!play || play.phase !== 'live') return 'none';
    if (Sim.canThrow(play)) return 'qb';
    const c = play.carrier;
    if (c >= 0 && play.players[c].side === 0 && !play.turnover && !(c === Sim.IDX.RBK && !play.handedOff)) return 'run';
    return 'none';
  }

  function takeOnce() {
    const o = App.once;
    App.once = { throwAt: null, juke: false, dive: null };
    return o;
  }

  // --- Frame loop -------------------------------------------------------------------------
  function loop(ts) {
    const dt = Math.min(0.05, Math.max(0, (ts - (App.last || ts)) / 1000));
    App.last = ts;
    App.cheer = Math.max(0, App.cheer - dt);
    let V = null;
    if (App.net) App.net.tick(dt);
    const inGame = App.screen === 'game' && App.G;
    const G = inGame ? App.G : App.demo;
    if (G) {
      const isDemo = !inGame;
      let inp = null;
      if (!isDemo) {
        const play = G.rt.play;
        inp = Input.poll(play ? play.players[0] : null);
        if (inp.throwAt) App.once.throwAt = inp.throwAt;
        if (inp.juke) App.once.juke = true;
        if (inp.dive) App.once.dive = inp.dive;
        App.lastInput = inp;
      }
      const authority = isDemo || !App.net || App.net.isAuthority();
      if (authority && !(App.paused && App.mode === 'local')) {
        if (inp && inp.kickLaunch && G.g.phase === 'kick') Game.act(G, { type: 'kick', aim: inp.kickLaunch.aim, power: inp.kickLaunch.power });
        App.acc += dt;
        let steps = 0;
        while (App.acc >= DT && steps < 4 && (isDemo || !App.net || App.net.isAuthority())) {
          let input;
          if (isDemo) input = demoInput(G);
          else {
            input = Object.assign({ aiming: inp.aiming, joy: inp.joy }, takeOnce());
            if (App.net) Object.assign(input, App.net.remoteInput());
          }
          Game.update(G, DT, input);
          App.acc -= DT;
          steps++;
        }
        if (steps === 4) App.acc = 0;
      }
      flushSfx(G, isDemo);
      V = !isDemo && App.net && !App.net.isAuthority() ? App.net.view(inp) : buildView(G, inp);
    }
    Render.frame(V || { mode: 'none' }, dt);
    syncUI();
    requestAnimationFrame(loop);
  }

  function flushSfx(G, isDemo) {
    const list = G.rt.sfx;
    if (!list.length) return;
    G.rt.sfx = [];
    if (isDemo) return;
    for (const s of list) {
      if (s === 'td') App.cheer = 2.5;
      RB.Audio.play(s);
      if (App.net) App.net.onSfx(s);
    }
  }

  // --- View model ---------------------------------------------------------------------------
  function viewPlayer(p) {
    return {
      i: p.i, x: p.x, y: p.y, vx: p.vx, vy: p.vy, side: p.side, face: p.face,
      down: p.down > 0.25, lunge: (p.lunge || 0) > 0, eng: p.eng >= 0, skin: p.skin,
    };
  }

  function aimView(play, at) {
    const a = Sim.clampAim(play, at.x, at.y);
    const q = play.players[0];
    const T = Sim.flightTime(q, a.d);
    const vz0 = (1.5 - 2 + 0.5 * C.GRAVITY * T * T) / T;
    const pts = [];
    for (let i = 1; i <= 30; i++) {
      const u = i / 30, bt = T * u;
      pts.push({ x: q.x + (a.x - q.x) * u, y: q.y + (a.y - q.y) * u, z: 2 + vz0 * bt - 0.5 * C.GRAVITY * bt * bt });
    }
    return { x: a.x, y: a.y, pts, max: a.max };
  }

  function buildView(G, inp) {
    const g = G.g, rt = G.rt, play = rt.play;
    const V = {
      g, mode: 'field', teams: [Game.team(G, 0), Game.team(G, 1)], uni: rt.uniforms,
      offSeat: g.poss, defSeat: 1 - g.poss, wx: g.wx, phase: g.phase, cheer: App.cheer,
      carrier: -1, ctrl: -1, defCtrl: -1,
    };
    if (g.phase === 'kick' && rt.kick) {
      V.mode = 'kick';
      V.kick = rt.kick;
      V.kickUni = rt.uniforms[g.poss];
      V.kickAim = inp && inp.kick ? inp.kick : null;
      V.kickHint = 'DRAG DOWN FOR POWER · SIDEWAYS TO AIM';
      return V;
    }
    V.los = C.GOAL_L + g.ballOn;
    V.ballY = g.ballY;
    V.fdX = g.twoPt ? null : C.GOAL_L + Math.min(100, g.ballOn + g.toGo);
    if (play && ['presnap', 'play', 'after'].includes(g.phase)) {
      V.los = play.los;
      V.ballY = play.ballY;
      V.fdX = g.twoPt ? null : play.fdX;
      V.players = play.players.map(viewPlayer);
      const b = play.ball;
      V.ball = { x: b.x, y: b.y, z: b.z, st: b.st, visible: true };
      V.carrier = play.carrier;
      V.live = play.phase === 'live';
      V.turnover = play.turnover;
      V.ctrl = play.turnover ? -1 : play.carrier >= 0 && play.players[play.carrier].side === 0 ? play.carrier : 0;
      V.landing = play.landing;
      V.defCtrl = App.net ? play.humanDefIdx : -1;
      if (inp && inp.aiming && inp.aimAt && Sim.canThrow(play)) V.aim = aimView(play, inp.aimAt);
      if (inp) V.joy = inp.joyScreen;
    }
    return V;
  }

  // --- UI sync ----------------------------------------------------------------------------
  function team(G, s) {
    return Game.team(G, s);
  }

  function controlsFor(G, mine) {
    const g = G.g;
    const esc = UI.esc;
    if (!mine) return null;
    if (g.phase === 'presnap') {
      const opts = Game.presnapOptions(g);
      const cls = { pass: '', run: 'alt', punt: 'ghost', fg: 'ghost' };
      const who = `${team(G, g.poss).name} BALL · ${g.names[g.poss]}`;
      const main = opts.map((o) => `<button class="btn ${cls[o.id]}" type="button" data-action="call" data-kind="${o.id}">${esc(o.label)}</button>`).join('');
      const seats = App.net ? [App.net.seat] : [0, 1];
      const tos = seats.filter((s) => Game.canTimeout(g, s))
        .map((s) => `<button class="btn small ghost" type="button" data-action="timeout" data-seat="${s}">Timeout ${esc(team(G, s).id)} (${g.to[s]})</button>`).join('');
      return { key: `pre|${g.playNo}|${opts.map((o) => o.id)}|${g.to}|${g.clockRunning}`, html: `<div class="who">${esc(who)}</div><div class="row">${main}</div>${tos ? `<div class="row">${tos}</div>` : ''}` };
    }
    if (g.phase === 'pat') {
      const two = Game.mustGoForTwo(g);
      return { key: `pat|${g.patFor}|${two}`, html: `<div class="who">${esc(team(G, g.patFor).name)} · TRY FOR POINTS</div><div class="row">${two ? '' : '<button class="btn" type="button" data-action="pat" data-choice="xp">Kick PAT</button>'}<button class="btn alt" type="button" data-action="pat" data-choice="2pt">Go for 2</button></div>` };
    }
    if (g.phase === 'kickchoice') {
      return { key: `kc|${g.kickingTeam}`, html: `<div class="who">${esc(team(G, g.kickingTeam).name)} KICKOFF</div><div class="row"><button class="btn" type="button" data-action="kickoff" data-choice="deep">Kick deep</button><button class="btn alt" type="button" data-action="kickoff" data-choice="onside">Onside kick</button></div>` };
    }
    return null;
  }

  function hintFor(ctx, g) {
    if (!g || g.playNo > 8) return '';
    if (ctx === 'qb') return 'PULL BACK TO AIM · RELEASE TO THROW · DRAG FORWARD TO RUN';
    if (ctx === 'run') return 'DRAG TO STEER · TAP TO JUKE · FLICK TO DIVE';
    if (ctx === 'def') return 'DRAG TO STEER YOUR DEFENDER';
    return '';
  }

  function syncUI() {
    const s = App.screen;
    if (s === 'title') {
      UI.show('title', UI.title(App.settings));
      UI.controls('', null);
      UI.hint('');
      UI.showPause(false);
      return;
    }
    if (s === 'howto') { UI.show('howto', UI.howto()); return; }
    if (s === 'teams') {
      if (UI.show(`teams|${App.step}|${App.picks.join()}|${App.settings.even}|${App.mode}`, UI.teams(App.step, App.picks, App.names, App.settings.even, App.mode === 'online'))) drawHelmet();
      UI.controls('', null);
      UI.showPause(false);
      return;
    }
    if (s === 'lobby') {
      if (App.net) App.net.syncLobby();
      UI.controls('', null);
      UI.showPause(false);
      return;
    }
    if (s !== 'game' || !App.G) return;
    const G = App.G, g = G.g;
    const online = !!App.net;
    const mine = online ? App.net.isAuthority() && g.ctl === App.net.seat : true;
    if (App.paused) UI.show('pause', UI.pause(online));
    else if (g.phase === 'handoff' && !online) UI.show(`handoff|${g.ctl}|${g.playNo}|${g.afterHandoff}`, UI.handoff(G));
    else if (g.phase === 'half') UI.show(`half|${online && App.net.seat === 0}`, UI.halftime(G, !online || App.net.seat === 0));
    else if (g.phase === 'final' && g.phaseT > 2.4) UI.show('final', UI.final(G, online));
    else if (online && App.net.overlay()) UI.show('net|' + App.net.overlay().key, App.net.overlay().html);
    else UI.show('', null);
    UI.showPause(!App.paused && g.phase !== 'final');
    const portrait = Render.R.portrait;
    let ctl = App.paused || g.phase === 'handoff' ? null : controlsFor(G, mine);
    if (!ctl && online && !App.paused) ctl = App.net.controls();
    UI.controls(ctl ? ctl.key + portrait : '', ctl ? ctl.html : null, portrait);
    UI.hint(App.paused ? '' : hintFor(inputContext(), g));
  }

  function drawHelmet() {
    const c = document.getElementById('helmet');
    const id = App.picks[App.step];
    if (!c || !id) return;
    const t = RB.TEAM_BY_ID[id];
    const x = c.getContext('2d');
    x.clearRect(0, 0, 9, 12);
    Render.drawSprite(x, { jersey: t.jersey, helmet: t.helmet, pants: t.pants, trim: t.trim }, '#c68642');
  }

  // --- Actions ------------------------------------------------------------------------------
  function readName() {
    const el = document.getElementById('name-in');
    if (!el) return;
    const v = el.value.trim().toUpperCase().replace(/[^A-Z0-9 .'-]/g, '').slice(0, 10);
    App.names[App.step] = v || `PLAYER ${App.step + 1}`;
    store.set('names', App.names);
  }

  function onInput(e) {
    if (e.target && e.target.id === 'name-in') {
      const pos = e.target.selectionStart;
      e.target.value = e.target.value.toUpperCase();
      try { e.target.setSelectionRange(pos, pos); } catch (err) { /* not all inputs support it */ }
    }
  }

  function onClick(e) {
    const b = e.target.closest('[data-action]');
    if (!b || b.disabled) return;
    RB.Audio.unlock();
    RB.Audio.play('tap');
    const a = b.dataset.action;
    const G = App.G;
    switch (a) {
      case 'local':
        App.mode = 'local';
        App.step = 0;
        App.picks = [null, null];
        App.screen = 'teams';
        break;
      case 'online':
        App.mode = 'online';
        App.step = 0;
        App.picks = [null, null];
        App.screen = 'teams';
        break;
      case 'howto':
        App.back = App.screen;
        App.screen = 'howto';
        break;
      case 'back':
        if (App.screen === 'howto') App.screen = App.back || 'title';
        else if (App.screen === 'teams') {
          readName();
          if (App.step === 1) App.step = 0;
          else App.screen = 'title';
        } else if (App.screen === 'lobby') {
          if (App.net) App.net.leave();
          App.screen = 'teams';
        }
        break;
      case 'set': {
        const k = b.dataset.key, v = +b.dataset.val;
        App.settings[k] = k === 'even' || k === 'sound' ? !!v : v;
        if (k === 'sound') RB.Audio.setOn(!!v);
        store.set('settings', App.settings);
        UI.invalidate();
        break;
      }
      case 'pick':
        readName();
        App.picks[App.step] = b.dataset.team;
        break;
      case 'lock':
        readName();
        if (!App.picks[App.step]) break;
        if (App.mode === 'online') {
          App.screen = 'lobby';
          RB.Net.open(App);
        } else if (App.step === 0) App.step = 1;
        else startLocal();
        break;
      case 'ready': if (G) Game.act(G, { type: 'ready' }); break;
      case 'call': sendAct({ type: 'call', kind: b.dataset.kind }); break;
      case 'timeout': sendAct({ type: 'timeout', seat: +b.dataset.seat }); break;
      case 'pat': sendAct({ type: 'pat', choice: b.dataset.choice }); break;
      case 'kickoff': sendAct({ type: 'kickoff', choice: b.dataset.choice }); break;
      case 'continue': sendAct({ type: 'continue' }); break;
      case 'defcall': if (App.net) App.net.defCall(b.dataset.call); break;
      case 'pause': App.paused = true; Input.reset(); break;
      case 'resume': App.paused = false; App.acc = 0; break;
      case 'quit': case 'menu': quitToMenu(); break;
      case 'rematch': startLocal(); break;
      default:
        if (App.net) App.net.action(a, b);
    }
    UI.invalidate();
  }

  function sendAct(act) {
    if (!App.G) return;
    if (App.net && !App.net.isAuthority()) { App.net.requestAct(act); return; }
    Game.act(App.G, act);
  }

  RB.Main = { store, startOnlineGame: null, quitToMenu, buildView, viewPlayer };

  const boot = () => {
    if (window.claude?.hot?.ready) window.claude.hot.ready(start);
    else start(window.claude?.hot?.data ?? {});
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
</body>
</html>
