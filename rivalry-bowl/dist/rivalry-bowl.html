<script>
/* src/game.js */
/* Rivalry Bowl: game flow. Downs, clock, scoring, kicks, halftime, college OT.
 * `g` is plain JSON (it travels to the other phone in online games).
 * `rt` holds runtime-only objects: rosters, rng, the live play, the kick. */
(function (root) {
  'use strict';
  const RB = root.RB;
  const { C, Sim } = RB;
  const W = C.FIELD_W;

  const ORD = ['', '1ST', '2ND', '3RD', '4TH'];
  const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);

  function blankStats() {
    return { pa: 0, pc: 0, py: 0, ptd: 0, int: 0, ra: 0, ry: 0, rtd: 0, sk: 0, fum: 0, fgm: 0, fga: 0, fd: 0, to: 0 };
  }

  function create(opts) {
    const seed = opts.seed != null ? opts.seed : (Math.random() * 2 ** 31) | 0;
    const rng = RB.makeRng(seed);
    const wxRoll = rng.next();
    const g = {
      v: 1, ver: 1,
      mode: opts.mode || 'local',
      settings: Object.assign({ qlen: 240, diff: 1, even: false }, opts.settings),
      teams: [opts.home, opts.away],
      names: opts.names || ['PLAYER 1', 'PLAYER 2'],
      score: [0, 0],
      q: 1, clock: 0, clockRunning: false, drained: 0,
      poss: 0, ballOn: 25, ballY: C.MID_Y, down: 1, toGo: 10,
      to: [3, 3],
      phase: 'coin', phaseT: 0,
      openRecv: rng.chance(0.5) ? 0 : 1,
      ctl: 0,
      ot: null, twoPt: false, patFor: -1, kickChoiceFor: -1, kickingTeam: -1, pendingKick: -1,
      holder: -1, afterHandoff: 'presnap',
      stats: [blankStats(), blankStats()],
      wx: {
        type: wxRoll < 0.62 ? 'clear' : wxRoll < 0.84 ? 'rain' : 'snow',
        wind: Math.round(rng.range(0, 16)),
        windDir: rng.range(0, Math.PI * 2),
      },
      banner: null, bannerId: 0,
      defCall: 'zone', playNo: 0, lastPlay: '',
      kick: null,
      seed,
    };
    g.clock = g.settings.qlen;
    const G = { g, rt: null };
    initRuntime(G, rng);
    const winner = g.openRecv;
    banner(G, 'COIN TOSS', `${team(G, winner).name} WILL RECEIVE`, 2.6);
    g.ctl = winner;
    return G;
  }

  // Rebuilds runtime objects on a device that adopts a game mid-way.
  function initRuntime(G, rng) {
    const g = G.g;
    const home = RB.TEAM_BY_ID[g.teams[0]], away = RB.TEAM_BY_ID[g.teams[1]];
    G.rt = {
      rng: rng || RB.makeRng((g.seed ^ (g.ver * 2654435761)) >>> 0),
      rosters: [RB.buildRoster(home, g.settings.even), RB.buildRoster(away, g.settings.even)],
      uniforms: RB.uniforms(home, away),
      play: null, kick: null,
      bannerQ: [], bannerT: 0,
      sfx: [], events: [],
      pending: null,
      paused: false,
    };
    return G;
  }

  function team(G, seat) {
    return RB.TEAM_BY_ID[G.g.teams[seat]];
  }

  // --- Banners and sounds -------------------------------------------------------
  function banner(G, text, sub, dur, color) {
    G.rt.bannerQ.push({ text, sub: sub || '', dur: dur || 1.6, color: color || null });
  }
  function sfx(G, name) {
    G.rt.sfx.push(name);
  }
  function bump(G) {
    G.g.ver++;
  }

  // --- Formatting helpers used by HUD and banners --------------------------------
  function fmtClock(s) {
    s = Math.max(0, Math.ceil(s));
    return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  }
  function spotText(ballOn) {
    const b = Math.round(ballOn);
    if (b === 50) return 'MIDFIELD';
    return b < 50 ? `OWN ${b}` : `OPP ${100 - b}`;
  }
  function downText(g) {
    if (g.twoPt) return '2-PT TRY';
    const goal = g.ballOn + g.toGo >= 100;
    const tg = goal ? 'GOAL' : g.toGo < 1 ? 'INCHES' : String(Math.round(g.toGo));
    return `${ORD[g.down]} & ${tg}`;
  }
  function periodText(g) {
    if (g.ot) return `OT${g.ot.n > 1 ? g.ot.n : ''}`;
    return `Q${g.q}`;
  }

  // --- Phase changes ----------------------------------------------------------------
  function setPhase(G, phase) {
    G.g.phase = phase;
    G.g.phaseT = 0;
    bump(G);
  }

  // After every stoppage, decide what comes next: quarter end or the next snap.
  function nextSnap(G) {
    const g = G.g;
    if (!g.ot && g.clock <= 0) return endQuarter(G);
    beginPossessionSnap(G);
  }

  function beginPossessionSnap(G) {
    handoffOr(G, G.g.poss, 'presnap');
  }

  // Pass & play: when a different player has to act, show the hand-off screen.
  function handoffOr(G, seat, next) {
    const g = G.g;
    g.ctl = seat;
    if (g.mode === 'local' && g.holder !== seat) {
      g.afterHandoff = next;
      setPhase(G, 'handoff');
      return;
    }
    g.holder = seat;
    if (next === 'pat') setPhase(G, 'pat');
    else enterPresnap(G);
  }

  function enterPresnap(G) {
    const g = G.g;
    makePresnapPlay(G);
    g.drained = 0;
    // Lining up takes a few seconds even in a hurry-up.
    if (g.clockRunning && !g.ot) {
      const d = Math.min(C.MIN_RUNOFF, g.clock);
      g.clock -= d;
      g.drained = d;
    }
    setPhase(G, 'presnap');
  }

  // The formation for the next snap (AI picks the coverage until a human does).
  function makePresnapPlay(G) {
    const g = G.g, rt = G.rt;
    const o = g.poss, d = 1 - o;
    const secsLeft = g.clock;
    g.defCall = Sim.aiDefCall(rt.rng, {
      down: g.down, toGo: g.toGo, ballOn: g.ballOn, lead: g.score[d] - g.score[o],
      secsLeft, q: g.ot ? 5 : g.q,
    });
    rt.play = Sim.createPlay({
      offRoster: rt.rosters[o], defRoster: rt.rosters[d],
      ballOn: g.ballOn, ballY: g.ballY, fdX: C.GOAL_L + Math.min(100, g.ballOn + g.toGo),
      defCall: g.defCall, diff: g.settings.diff, rng: rt.rng, wx: g.wx,
      humanDefIdx: g.mode === 'online' ? rt.humanDefIdx == null ? Sim.IDX.S1 : rt.humanDefIdx : -1,
    });
    rt.defCallFrom = 'ai';
  }

  // --- Actions from the players ----------------------------------------------------
  function canFG(g) {
    if (g.twoPt) return false;
    const dist = 100 - g.ballOn + 17;
    if (dist > 62) return false;
    if (g.down === 4 || g.ot) return true;
    return (g.q === 2 || g.q === 4) && g.clock <= 30;
  }
  function canPunt(g) {
    return !g.twoPt && !g.ot && g.down === 4;
  }
  function presnapOptions(g) {
    const o = [{ id: 'pass', label: 'PASS' }, { id: 'run', label: 'RUN' }];
    if (canPunt(g)) o.push({ id: 'punt', label: 'PUNT' });
    if (canFG(g)) o.push({ id: 'fg', label: `FG ${100 - g.ballOn + 17}` });
    return o;
  }
  function canTimeout(g, seat) {
    return !g.ot && g.phase === 'presnap' && g.to[seat] > 0 && g.clockRunning;
  }

  function act(G, a) {
    const g = G.g, rt = G.rt;
    switch (a.type) {
      case 'ready':
        if (g.phase !== 'handoff') break;
        g.holder = g.ctl;
        if (g.afterHandoff === 'pat') setPhase(G, 'pat');
        else enterPresnap(G);
        break;
      case 'call':
        if (g.phase !== 'presnap') break;
        if (a.kind === 'pass' || a.kind === 'run') snapBall(G, a.kind);
        else if (a.kind === 'punt' && canPunt(g)) punt(G);
        else if (a.kind === 'fg' && canFG(g)) startKick(G, 'fg', 100 - g.ballOn + 17);
        break;
      case 'defcall':
        if (g.phase === 'presnap' && rt.play && Sim.DEF_CALLS.includes(a.call)) {
          Sim.setDefense(rt.play, a.call);
          g.defCall = a.call;
          rt.defCallFrom = 'human';
          bump(G);
        }
        break;
      case 'defplayer':
        rt.humanDefIdx = a.idx;
        if (rt.play) rt.play.humanDefIdx = a.idx;
        break;
      case 'timeout':
        if (canTimeout(g, a.seat)) {
          g.to[a.seat]--;
          g.clockRunning = false;
          sfx(G, 'whistle');
          banner(G, 'TIMEOUT', `${team(G, a.seat).name} · ${g.to[a.seat]} LEFT`, 1.4);
          bump(G);
        }
        break;
      case 'pat':
        if (g.phase !== 'pat') break;
        if (a.choice === 'xp' && !mustGoForTwo(g)) startKick(G, 'xp', C.XP_DIST);
        else startTwoPoint(G);
        break;
      case 'kickoff':
        if (g.phase !== 'kickchoice') break;
        doKickoff(G, g.kickingTeam, a.choice === 'onside');
        break;
      case 'kick':
        if (g.phase === 'kick' && rt.kick && rt.kick.phase === 'aim') RB.Kick.launch(rt.kick, a.aim, a.power, rt.rng);
        break;
      case 'continue':
        if (g.phase === 'half') startSecondHalf(G);
        break;
    }
  }

  function snapBall(G, kind) {
    const g = G.g, rt = G.rt;
    g.clockRunning = true;
    g.playNo++;
    Sim.snap(rt.play, kind);
    sfx(G, 'hut');
    setPhase(G, 'play');
  }

  // --- Update loop (authority only) ---------------------------------------------
  function update(G, dt, input) {
    const g = G.g, rt = G.rt;
    if (rt.paused) return;
    g.phaseT += dt;
    tickBanner(G, dt);
    switch (g.phase) {
      case 'coin':
        if (g.phaseT > 2.6) kickoffStart(G, 1 - g.openRecv);
        break;
      case 'presnap':
        if (g.clockRunning && !g.ot && g.drained < C.PLAY_CLOCK_RUNOFF) {
          const d = Math.min(C.RUNOFF_RATE * dt, C.PLAY_CLOCK_RUNOFF - g.drained);
          g.drained += d;
          g.clock = Math.max(0, g.clock - d);
          if (g.clock <= 0) { rt.play = null; endQuarter(G); }
        }
        break;
      case 'play':
        updatePlay(G, dt, input);
        break;
      case 'kick':
        updateKick(G, dt);
        break;
      case 'after':
        if (rt.play && rt.play.phase === 'dead') Sim.step(rt.play, dt, null);
        if (g.phaseT > (rt.pending ? rt.pending.wait : 1.2) && !rt.bannerQ.length && !g.banner) {
          const f = rt.pending && rt.pending.next;
          rt.pending = null;
          if (f) f();
        }
        break;
      case 'quarter':
        if (g.phaseT > 2.2) {
          g.q++;
          g.clock = g.settings.qlen;
          g.clockRunning = false;
          const k = g.pendingKick;
          g.pendingKick = -1;
          if (k >= 0) kickoffStart(G, k);
          else beginPossessionSnap(G);
        }
        break;
      case 'half':
        if (g.phaseT > 45) startSecondHalf(G);
        break;
    }
  }

  // Waits for banners, then runs `next`. Keeps timing logic in one place.
  function after(G, wait, next) {
    G.rt.pending = { wait, next };
    setPhase(G, 'after');
  }

  function tickBanner(G, dt) {
    const rt = G.rt, g = G.g;
    if (g.banner) {
      rt.bannerT += dt;
      if (rt.bannerT >= g.banner.dur) { g.banner = null; bump(G); }
    }
    if (!g.banner && rt.bannerQ.length) {
      const b = rt.bannerQ.shift();
      g.bannerId++;
      g.banner = Object.assign({ id: g.bannerId }, b);
      rt.bannerT = 0;
      bump(G);
    }
  }

  function updatePlay(G, dt, input) {
    const g = G.g, rt = G.rt, play = rt.play;
    const nEv = play.events.length;
    Sim.step(play, dt, input);
    for (const e of play.events.slice(nEv)) onPlayEvent(G, e);
    if (!g.ot && play.phase === 'live') g.clock = Math.max(0, g.clock - dt);
    if (play.phase === 'dead' && play.deadT > 1.1) finishPlay(G, play.result);
  }

  function onPlayEvent(G, e) {
    const P = G.rt.play.players;
    switch (e.type) {
      case 'throw': sfx(G, 'throw'); break;
      case 'catch': sfx(G, 'catch'); break;
      case 'int': sfx(G, 'bad'); banner(G, 'INTERCEPTED!', P[e.who].name, 1.4, 'bad'); break;
      case 'broken': case 'juke': sfx(G, 'juke'); break;
      case 'jukeMove': sfx(G, 'swish'); break;
      case 'dive': sfx(G, 'swish'); break;
      case 'fumble':
        sfx(G, 'bad');
        if (e.text === 'RECOVERED') banner(G, 'FUMBLE', 'OFFENSE RECOVERS', 1.3);
        break;
      case 'dead': sfx(G, 'whistle'); break;
      case 'handoff': sfx(G, 'catch'); break;
    }
  }

  // --- Applying a play result -------------------------------------------------------
  function finishPlay(G, res) {
    const g = G.g, rt = G.rt, play = rt.play;
    const o = g.poss, d = 1 - o;
    const S = g.stats[o], st = res.stats;
    const P = play.players;
    const name = (i) => (i >= 0 ? `${P[i].name}` : '');
    S.pa += st.passAtt; S.pc += st.comp; S.py += st.passYds;
    S.ra += st.rushAtt; S.ry += st.rushYds + (st.sack ? st.sackYds || 0 : 0);
    if (st.int) { S.int++; S.to++; }
    if (st.sack) S.sk++;
    if (st.fum) { S.fum++; S.to++; }
    rt.lastResult = res;

    if (g.twoPt) return finishTwoPoint(G, res);

    const spot = clamp(res.x - C.GOAL_L, 0, 100);
    const hash = res.y < C.HASH_TOP ? C.HASH_TOP : res.y > C.HASH_BOT ? C.HASH_BOT : res.y;

    switch (res.kind) {
      case 'td': {
        g.score[o] += 6;
        if (st.comp) S.ptd++; else S.rtd++;
        g.clockRunning = false;
        sfx(G, 'td');
        const who = st.comp ? name(st.receiver) : name(res.carrier);
        banner(G, 'TOUCHDOWN!', `${team(G, o).name} · ${who}`, 2.4, 'good');
        g.lastPlay = `${who} ${res.yds} YD TD`;
        return after(G, 0.2, () => afterTouchdown(G, o));
      }
      case 'safety': {
        g.score[d] += 2;
        g.clockRunning = false;
        sfx(G, 'bad');
        banner(G, 'SAFETY!', `${team(G, d).name} +2`, 2, 'bad');
        return after(G, 0.2, () => endDrive(G, 'safety', () => freeKick(G, o)));
      }
      case 'int_td': {
        g.score[d] += 6;
        g.clockRunning = false;
        sfx(G, 'td');
        banner(G, 'PICK SIX!', team(G, d).name, 2.4, 'bad');
        return after(G, 0.2, () => endDrive(G, 'turnover', () => { g.poss = d; afterTouchdown(G, d); }));
      }
      case 'int_tb':
        g.clockRunning = false;
        return after(G, 0.2, () => endDrive(G, 'turnover', () => changePossession(G, d, 25, C.MID_Y)));
      case 'int':
      case 'fumble': {
        g.clockRunning = false;
        if (res.kind === 'fumble') banner(G, 'FUMBLE!', `${team(G, d).name} BALL`, 1.8, 'bad');
        const nb = clamp(100 - spot, 1, 99);
        return after(G, 0.2, () => endDrive(G, 'turnover', () => changePossession(G, d, nb, hash)));
      }
      case 'inc': {
        g.clockRunning = false;
        banner(G, res.text || 'INCOMPLETE', '', 1.1);
        g.lastPlay = 'INCOMPLETE';
        return after(G, 0.2, () => advanceDowns(G, g.ballOn, g.ballY));
      }
      default: {
        // tackle / oob / sack / dive
        g.clockRunning = res.kind !== 'oob';
        if (res.kind === 'sack') {
          banner(G, 'SACKED!', `LOSS OF ${Math.abs(res.yds)}`, 1.3, 'bad');
          sfx(G, 'bad');
        }
        const who = st.comp ? name(st.receiver) : name(res.carrier);
        g.lastPlay = res.kind === 'sack' ? `SACK ${res.yds}` : `${who} ${res.yds >= 0 ? '+' : ''}${res.yds}`;
        if (st.comp && res.kind !== 'sack') banner(G, `${res.yds >= 0 ? '+' : ''}${res.yds} YDS`, who, 1.1);
        return after(G, 0.2, () => advanceDowns(G, spot, hash));
      }
    }
  }

  function advanceDowns(G, spot, hash) {
    const g = G.g;
    const o = g.poss;
    g.ballY = hash;
    const line = g.ballOn + g.toGo;
    if (spot >= line - 1e-6) {
      g.stats[o].fd++;
      g.down = 1;
      g.ballOn = spot;
      g.toGo = Math.min(10, 100 - spot);
      banner(G, 'FIRST DOWN', '', 1.1, 'good');
      sfx(G, 'first');
      return nextSnap(G);
    }
    g.toGo = line - spot;
    g.ballOn = spot;
    g.down++;
    if (g.down > 4) {
      banner(G, 'TURNOVER ON DOWNS', '', 1.8, 'bad');
      g.clockRunning = false;
      return endDrive(G, 'downs', () => after(G, 0.1, () => changePossession(G, 1 - o, clamp(100 - spot, 1, 99), hash)));
    }
    nextSnap(G);
  }

  function changePossession(G, seat, ballOn, hash) {
    const g = G.g;
    g.poss = seat;
    g.ballOn = ballOn;
    g.ballY = hash == null ? C.MID_Y : hash;
    g.down = 1;
    g.toGo = Math.min(10, 100 - ballOn);
    g.clockRunning = false;
    nextSnap(G);
  }

  // --- Touchdowns, PATs, two-point tries ----------------------------------------------
  function mustGoForTwo(g) {
    return !!(g.ot && g.ot.n >= 2);
  }

  function afterTouchdown(G, seat) {
    const g = G.g;
    g.poss = seat;
    // Second team in an OT period that takes the lead wins right there.
    if (g.ot && g.ot.count === 1 && g.score[seat] > g.score[1 - seat]) return finalWhistle(G);
    // Untimed down: the PAT happens even at 0:00.
    g.patFor = seat;
    handoffOr(G, seat, 'pat');
  }

  function startTwoPoint(G) {
    const g = G.g;
    g.twoPt = true;
    g.ballOn = 97;
    g.ballY = C.MID_Y;
    g.down = 1;
    g.toGo = 3;
    enterPresnap(G);
  }

  function finishTwoPoint(G, res) {
    const g = G.g;
    const o = g.poss, d = 1 - o;
    g.twoPt = false;
    if (res.kind === 'td') {
      g.score[o] += 2;
      sfx(G, 'td');
      banner(G, '2-POINT GOOD', team(G, o).name, 1.8, 'good');
    } else if (res.kind === 'int_td') {
      g.score[d] += 2;
      banner(G, 'DEFENSIVE 2-PT', team(G, d).name, 1.8, 'bad');
    } else {
      banner(G, '2-POINT FAILS', team(G, o).name, 1.6, 'bad');
    }
    after(G, 0.3, () => afterScoreAttempt(G, o));
  }

  // After a PAT kick or a two-point try.
  function afterScoreAttempt(G, scorer) {
    const g = G.g;
    g.patFor = -1;
    if (g.ot) return endDrive(G, 'score', null);
    kickoffStart(G, scorer);
  }

  // --- Kicking ------------------------------------------------------------------------
  function startKick(G, type, dist) {
    const g = G.g, rt = G.rt;
    const k = rt.rosters[g.poss].k;
    rt.kick = RB.Kick.create({ type, dist, kicker: k, wx: g.wx, rng: rt.rng });
    g.kick = { type, dist };
    if (type === 'fg') g.stats[g.poss].fga++;
    setPhase(G, 'kick');
  }

  function updateKick(G, dt) {
    const g = G.g, rt = G.rt, k = rt.kick;
    RB.Kick.update(k, dt);
    if (k.phase === 'fly' && !k.sfxDone) { k.sfxDone = true; sfx(G, 'kick'); }
    if (k.phase !== 'done' || k.doneT < 1.2) return;
    const o = g.poss, good = k.result === 'good';
    const type = k.type;
    rt.kick = null;
    g.kick = null;
    if (type === 'xp') {
      if (good) g.score[o] += 1;
      banner(G, good ? 'EXTRA POINT GOOD' : 'NO GOOD', '', 1.5, good ? 'good' : 'bad');
      sfx(G, good ? 'first' : 'bad');
      return after(G, 0.2, () => afterScoreAttempt(G, o));
    }
    // Field goal
    g.clockRunning = false;
    if (good) {
      g.score[o] += 3;
      g.stats[o].fgm++;
      sfx(G, 'td');
      banner(G, 'FIELD GOAL IS GOOD', `${k.dist} YARDS`, 2, 'good');
      if (g.ot) return after(G, 0.2, () => endDrive(G, 'score', null));
      return after(G, 0.2, () => endDrive(G, 'score', () => kickoffStart(G, o)));
    }
    sfx(G, 'bad');
    banner(G, 'NO GOOD', `${k.dist} YARDS · ${k.resultText}`, 2, 'bad');
    // Miss: ball to the defense at the spot of the kick (the 20 at worst).
    const spotOfKick = g.ballOn - 7;
    const nb = Math.max(20, 100 - spotOfKick);
    return after(G, 0.2, () => endDrive(G, 'fg_miss', () => changePossession(G, 1 - o, nb, C.MID_Y)));
  }

  function punt(G) {
    const g = G.g, rt = G.rt, rng = rt.rng;
    const o = g.poss, d = 1 - o;
    const k = rt.rosters[o].k;
    g.clockRunning = false;
    let dist = Math.round(k.power - 12 + rng.gauss() * 5);
    if (rng.chance(0.05)) dist = rng.int(22, 30);
    if (g.wx.type === 'rain') dist -= 2;
    const land = g.ballOn + dist;
    let text, nb;
    if (land >= 100) {
      text = 'TOUCHBACK';
      nb = C.PUNT_TOUCHBACK;
    } else {
      const fair = rng.chance(0.45);
      const ret = fair ? 0 : Math.max(0, Math.round(rng.range(-2, 11) + (rng.chance(0.03) ? 30 : 0)));
      nb = clamp(100 - land + ret, 1, 99);
      text = fair ? `FAIR CATCH AT ${spotText(100 - land)}` : `RETURNED TO ${spotText(nb)}`;
    }
    g.clock = Math.max(0, g.clock - (g.ot ? 0 : 6));
    sfx(G, 'kick');
    banner(G, `PUNT · ${dist} YDS`, text, 2.2);
    after(G, 0.2, () => endDrive(G, 'punt', () => changePossession(G, d, nb, C.MID_Y)));
  }

  function kickoffStart(G, kicking) {
    const g = G.g;
    // A score at 0:00: the kickoff opens the next quarter instead.
    if (!g.ot && g.clock <= 0) {
      g.pendingKick = kicking;
      return endQuarter(G);
    }
    g.kickingTeam = kicking;
    // Offer an onside kick only when it could matter: trailing late.
    const trailing = g.score[kicking] < g.score[1 - kicking];
    if (!g.ot && g.q >= 4 && trailing) {
      g.kickChoiceFor = kicking;
      g.ctl = kicking;
      setPhase(G, 'kickchoice');
      return;
    }
    doKickoff(G, kicking, false);
  }

  function doKickoff(G, kicking, onside) {
    const g = G.g, rng = G.rt.rng;
    const recv = 1 - kicking;
    g.kickChoiceFor = -1;
    sfx(G, 'kick');
    if (onside) {
      if (rng.chance(0.18)) {
        banner(G, 'ONSIDE KICK', `${team(G, kicking).name} RECOVERS!`, 2.2, 'good');
        return after(G, 0.2, () => changePossession(G, kicking, rng.int(45, 49), C.MID_Y));
      }
      banner(G, 'ONSIDE KICK', `${team(G, recv).name} RECOVERS`, 2.2);
      return after(G, 0.2, () => changePossession(G, recv, 53, C.MID_Y));
    }
    let nb, text;
    const r = rng.next();
    if (r < 0.6) { nb = C.KICKOFF_TOUCHBACK; text = 'TOUCHBACK'; }
    else if (r < 0.985) { nb = clamp(Math.round(22 + rng.gauss() * 6), 12, 45); text = `RETURNED TO ${spotText(nb)}`; }
    else if (r < 0.995) { nb = rng.int(50, 70); text = `BIG RETURN TO ${spotText(nb)}`; }
    else {
      g.score[recv] += 6;
      banner(G, 'KICKOFF', 'RETURNED FOR A TOUCHDOWN!', 2.6, 'good');
      sfx(G, 'td');
      return after(G, 0.2, () => afterTouchdown(G, recv));
    }
    if (!g.ot && g.clock > 0 && text !== 'TOUCHBACK') g.clock = Math.max(1, g.clock - rng.int(4, 7));
    banner(G, 'KICKOFF', `${team(G, recv).name} · ${text}`, 1.8);
    after(G, 0.2, () => changePossession(G, recv, nb, C.MID_Y));
  }

  function freeKick(G, kicking) {
    const g = G.g, rng = G.rt.rng;
    const recv = 1 - kicking;
    const nb = clamp(Math.round(32 + rng.gauss() * 6), 20, 50);
    sfx(G, 'kick');
    banner(G, 'FREE KICK', `${team(G, recv).name} · ${spotText(nb)}`, 1.8);
    after(G, 0.2, () => changePossession(G, recv, nb, C.MID_Y));
  }

  // --- Quarters, halftime, overtime -------------------------------------------------------
  function endQuarter(G) {
    const g = G.g;
    g.clockRunning = false;
    sfx(G, 'whistle');
    if (g.q !== 1 && g.q !== 3) g.pendingKick = -1;
    if (g.q === 1 || g.q === 3) {
      banner(G, `END OF ${ORD[g.q]}`, `${team(G, 0).name} ${g.score[0]} · ${team(G, 1).name} ${g.score[1]}`, 2.2);
      setPhase(G, 'quarter');
      return;
    }
    if (g.q === 2) {
      g.ctl = 0;
      setPhase(G, 'half');
      return;
    }
    if (g.score[0] !== g.score[1]) return finalWhistle(G);
    startOT(G, 1, g.openRecv);
  }

  function startSecondHalf(G) {
    const g = G.g;
    g.q = 3;
    g.clock = g.settings.qlen;
    g.to = [3, 3];
    kickoffStart(G, g.openRecv);
  }

  function startOT(G, n, first) {
    const g = G.g;
    g.ot = { n, first, count: 0 };
    g.clockRunning = false;
    const two = n >= 3;
    banner(G, n === 1 ? 'OVERTIME' : `OVERTIME ${n}`, two ? '2-POINT SHOOTOUT' : `${team(G, first).name} BALL FIRST`, 2.4);
    after(G, 0.2, () => startOTPossession(G, first));
  }

  function startOTPossession(G, seat) {
    const g = G.g;
    if (g.ot.n >= 3) {
      g.poss = seat;
      g.twoPt = true;
      g.patFor = seat;
      g.ballOn = 97; g.ballY = C.MID_Y; g.down = 1; g.toGo = 3;
      return beginPossessionSnap(G);
    }
    changePossession(G, seat, 75, C.MID_Y);
  }

  // A possession is over. In OT this drives the period; otherwise `then` runs.
  function endDrive(G, why, then) {
    const g = G.g;
    if (!g.ot) { if (then) then(); return; }
    // OT turnovers and misses end the possession; nothing else happens.
    const ot = g.ot;
    ot.count++;
    const lead = g.score[0] - g.score[1];
    if (ot.count >= 2) {
      if (lead !== 0) return finalWhistle(G);
      return startOT(G, ot.n + 1, 1 - ot.first);
    }
    const next = 1 - ot.first;
    banner(G, `${team(G, next).name} BALL`, g.ot.n >= 3 ? '2-POINT TRY' : 'FROM THE 25', 1.6);
    after(G, 0.2, () => startOTPossession(G, next));
  }

  function finalWhistle(G) {
    const g = G.g;
    g.clockRunning = false;
    g.twoPt = false;
    sfx(G, 'final');
    const w = g.score[0] > g.score[1] ? 0 : 1;
    banner(G, 'FINAL', `${team(G, w).name} WINS`, 3, 'good');
    setPhase(G, 'final');
  }

  // A device picking a game back up (hot reload): replay the current down.
  function resume(G) {
    const g = G.g;
    g.banner = null;
    if (['play', 'after', 'kick', 'coin', 'quarter', 'presnap'].includes(g.phase)) {
      g.holder = g.poss;
      if (g.phase === 'coin') return kickoffStart(G, 1 - g.openRecv);
      if (g.phase === 'quarter') { g.phaseT = 0; return; }
      enterPresnap(G);
    }
  }

  // Online: this phone just became the authority with state from the other one.
  function takeover(G) {
    const g = G.g;
    if (g.phase === 'presnap' && !G.rt.play) { makePresnapPlay(G); bump(G); }
    if (['play', 'after', 'kick'].includes(g.phase)) resume(G);
  }

  // --- Public ---------------------------------------------------------------------------
  RB.Game = {
    create, initRuntime, update, act, team, resume, takeover,
    fmtClock, spotText, downText, periodText,
    presnapOptions, canTimeout, mustGoForTwo,
  };
})(typeof window !== 'undefined' ? window : globalThis);

<script>
/* src/font.js */
/* Rivalry Bowl: 5x7 bitmap font for in-canvas text, cached per color. */
(function (root) {
  'use strict';
  const RB = root.RB;
  const RAW = {
    A: '01110100011000111111100011000110001', B: '11110100011000111110100011000111110',
    C: '01110100011000010000100001000101110', D: '11110100011000110001100011000111110',
    E: '11111100001000011110100001000011111', F: '11111100001000011110100001000010000',
    G: '01110100011000010111100011000101111', H: '10001100011000111111100011000110001',
    I: '01110001000010000100001000010001110', J: '00111000100001000010000101001001100',
    K: '10001100101010011000101001001010001', L: '10000100001000010000100001000011111',
    M: '10001110111010110101100011000110001', N: '10001100011100110101100111000110001',
    O: '01110100011000110001100011000101110', P: '11110100011000111110100001000010000',
    Q: '01110100011000110001101011001001101', R: '11110100011000111110101001001010001',
    S: '01111100001000001110000010000111110', T: '11111001000010000100001000010000100',
    U: '10001100011000110001100011000101110', V: '10001100011000110001100010101000100',
    W: '10001100011000110101101011010101010', X: '10001100010101000100010101000110001',
    Y: '10001100011000101010001000010000100', Z: '11111000010001000100010001000011111',
    0: '01110100011001110101110011000101110', 1: '00100011000010000100001000010001110',
    2: '01110100010000100010001000100011111', 3: '11111000100010000010000011000101110',
    4: '00010001100101010010111110001000010', 5: '11111100001111000001000011000101110',
    6: '00110010001000011110100011000101110', 7: '11111000010001000100010000100001000',
    8: '01110100011000101110100011000101110', 9: '01110100011000101111000010001001100',
    '.': '00000000000000000000000000110001100', ',': '00000000000000000000011000010001000',
    '!': '00100001000010000100001000000000100', '?': '01110100010000100010001000000000100',
    ':': '00000011000110000000011000110000000', '-': '00000000000000011111000000000000000',
    '+': '00000001000010011111001000010000000', '&': '01100100101010001000101011001001101',
    "'": '01100001000100000000000000000000000', '/': '00000000010001000100010001000000000',
    '#': '01010010101111101010111110101001010', '(': '00010001000100001000010000010000010',
    ')': '01000001000001000010000100010001000', '·': '00000000000000001100011000000000000',
    '%': '11000110010001000100010001001100011', '<': '00010001000100010000010000010000010',
    '>': '01000001000001000001000100010001000', ' ': '00000000000000000000000000000000000',
  };
  const cache = new Map();

  function glyph(ch, color) {
    const key = ch + color;
    let c = cache.get(key);
    if (c) return c;
    const bits = RAW[ch] || RAW['?'];
    if (typeof document === 'undefined') return null;
    c = document.createElement('canvas');
    c.width = 5;
    c.height = 7;
    const x = c.getContext('2d');
    x.fillStyle = color;
    for (let i = 0; i < 35; i++) if (bits[i] === '1') x.fillRect(i % 5, (i / 5) | 0, 1, 1);
    cache.set(key, c);
    return c;
  }

  function width(str, scale) {
    return str.length ? (str.length * 6 - 1) * scale : 0;
  }

  // Draws `str` with its top at y. align: 'left' | 'center' | 'right'.
  function draw(ctx, str, x, y, scale, color, align, shadow) {
    str = String(str).toUpperCase();
    scale = scale || 1;
    const w = width(str, scale);
    let x0 = align === 'center' ? x - w / 2 : align === 'right' ? x - w : x;
    x0 = Math.round(x0);
    y = Math.round(y);
    if (shadow) draw(ctx, str, x0 + scale, y + scale, scale, shadow, 'left');
    for (let i = 0; i < str.length; i++) {
      const gph = glyph(str[i], color);
      if (gph) ctx.drawImage(gph, x0 + i * 6 * scale, y, 5 * scale, 7 * scale);
    }
    return w;
  }

  RB.Font = { draw, width, H: 7 };
})(typeof window !== 'undefined' ? window : globalThis);

<script>
/* src/render.js */
/* Rivalry Bowl: canvas renderer. Draws from a view model `V` so the same
 * code renders the local simulation and snapshots from the other phone. */
(function (root) {
  'use strict';
  const RB = root.RB;
  const C = RB.C;
  const F = RB.Font;
  const FW = C.FIELD_W;
  const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);

  const PAL = {
    turfA: '#3f8f3b', turfB: '#398437', apron: '#2e6e2d', chalk: '#f2efe6',
    wall: '#1b2340', stands: '#121829', night: '#0b0f1c',
    amber: '#ffb000', amberDim: '#5a3f00', ink: '#0d0f14',
    good: '#ffd23f', bad: '#ff5a4e', los: '#5aa9ff', fd: '#ffd23f',
    ball: '#8a4b22', shadow: 'rgba(0,0,0,0.28)',
  };

  const R = {
    canvas: null, ctx: null, W: 480, H: 270, k: 1,
    SX: 9, SY: 6, SZ: 7, portrait: false, hudH: 26, bottom: 0,
    cam: { x: 40, y: FW / 2 }, camInit: false, t: 0,
    crowd: null, crowdKey: '', sprites: new Map(), rain: [],
    flash: 0,
  };

  function init(canvas) {
    R.canvas = canvas;
    R.ctx = canvas.getContext('2d');
  }

  function resize(cssW, cssH) {
    const k = Math.min(cssW, cssH) / 232;
    R.k = k;
    R.W = Math.max(200, Math.round(cssW / k));
    R.H = Math.max(200, Math.round(cssH / k));
    R.canvas.width = R.W;
    R.canvas.height = R.H;
    R.portrait = cssH > cssW * 1.1;
    R.SX = R.portrait ? 5.6 : clamp(R.W / 50, 7.5, 10.5);
    R.SY = R.SX * 0.62;
    R.SZ = R.SX * 0.7;
    R.hudH = R.portrait ? 62 : 26;
    R.bottom = R.portrait ? Math.round(R.H * 0.3) : 0;
    R.ctx.imageSmoothingEnabled = false;
    R.crowdKey = '';
  }

  // --- Projection ---------------------------------------------------------------
  function fieldMidY() {
    return R.hudH + (R.H - R.hudH - R.bottom) / 2;
  }
  function sx(x) {
    return Math.round((x - R.cam.x) * R.SX + R.W / 2);
  }
  function sy(y) {
    return Math.round((y - R.cam.y) * R.SY + fieldMidY());
  }
  // Screen -> world, used by input.
  function toWorld(px, py) {
    return { x: (px - R.W / 2) / R.SX + R.cam.x, y: (py - fieldMidY()) / R.SY + R.cam.y };
  }
  function screenDeltaToWorld(dx, dy) {
    return { x: dx / R.k / R.SX, y: dy / R.k / R.SY };
  }

  function updateCamera(V, dt) {
    let tx = R.cam.x, ty = R.cam.y;
    const lead = R.portrait ? 7 : 9;
    if (V.mode === 'field') {
      const car = V.players && V.carrier >= 0 ? V.players[V.carrier] : null;
      if (!V.players || V.phase === 'presnap') { tx = V.los + lead; ty = V.ballY; }
      else if (V.ball && (V.ball.st === 'air' || V.ball.st === 'dead')) { tx = V.ball.x + (V.live ? 3 : 0); ty = V.ball.y; }
      else if (car) {
        const dir = car.side === 0 && !V.turnover ? 1 : -1;
        tx = car.x + (!V.live ? 0 : car.i === 0 && dir > 0 && car.x < V.los ? lead + 2 : 6 * dir);
        ty = car.y;
      } else { tx = V.los + lead; ty = V.ballY; }
    }
    const halfH = (R.H - R.hudH - R.bottom) / 2 / R.SY;
    const minY = -6 + halfH, maxY = FW + 5 - halfH;
    ty = minY > maxY ? FW / 2 : clamp(ty, minY, maxY);
    const halfW = R.W / 2 / R.SX;
    tx = clamp(tx, halfW - 4, 124 - halfW);
    if (!R.camInit) { R.cam.x = tx; R.cam.y = ty; R.camInit = true; }
    const f = 1 - Math.exp(-dt * 4.5);
    R.cam.x += (tx - R.cam.x) * f;
    R.cam.y += (ty - R.cam.y) * f;
  }

  // --- Stadium ------------------------------------------------------------------
  function buildCrowd(uniforms) {
    const key = R.SX + '|' + uniforms.map((u) => u.jersey).join();
    if (key === R.crowdKey) return;
    R.crowdKey = key;
    const w = Math.ceil(140 * R.SX), h = 60;
    const c = document.createElement('canvas');
    c.width = w;
    c.height = h;
    const x = c.getContext('2d');
    x.fillStyle = PAL.stands;
    x.fillRect(0, 0, w, h);
    const rng = RB.makeRng(7);
    const skins = ['#f1c27d', '#e0ac69', '#c68642', '#8d5524', '#ffdbac'];
    for (let row = 0; row < 12; row++) {
      x.fillStyle = row % 2 ? '#161d33' : '#131a2e';
      x.fillRect(0, row * 5, w, 5);
      for (let col = 0; col < w; col += 3) {
        if (rng.chance(0.12)) continue;
        const r = rng.next();
        const shirt = r < 0.5 ? uniforms[0].jersey : r < 0.82 ? uniforms[1].jersey : rng.pick(['#e8e8e8', '#6b7a8f', '#d9c27a', '#3a4a6b']);
        x.fillStyle = rng.pick(skins);
        x.fillRect(col, row * 5 + 1, 2, 1);
        x.fillStyle = shirt;
        x.fillRect(col, row * 5 + 2, 2, 2);
      }
    }
    R.crowd = c;
  }

  function drawStadium(ctx, V) {
    ctx.fillStyle = PAL.night;
    ctx.fillRect(0, 0, R.W, R.H);
    // Stands above the far sideline.
    const top = sy(-4);
    if (top > 0 && R.crowd) {
      const bounce = V.cheer > 0 ? Math.round(Math.sin(R.t * 30) * 1) : 0;
      const cx = sx(-10);
      for (let yy = top - R.crowd.height; yy > -R.crowd.height; yy -= R.crowd.height) {
        ctx.drawImage(R.crowd, cx, yy + bounce);
      }
      ctx.fillStyle = PAL.wall;
      ctx.fillRect(0, top - 4, R.W, 4);
      ctx.fillStyle = V.uni ? V.uni[0].jersey : '#333';
      ctx.fillRect(0, top - 4, R.W, 1);
    }
    // Apron around the field.
    ctx.fillStyle = PAL.apron;
    const ax0 = sx(-4), ax1 = sx(124), ay0 = sy(-4), ay1 = sy(FW + 4);
    ctx.fillRect(ax0, ay0, ax1 - ax0, ay1 - ay0);
    // Near-side wall and the lower bowl behind it.
    ctx.fillStyle = PAL.wall;
    ctx.fillRect(0, ay1, R.W, 4);
    if (R.crowd && ay1 + 4 < R.H) {
      const cx = sx(-10);
      for (let yy = ay1 + 4; yy < R.H; yy += R.crowd.height) ctx.drawImage(R.crowd, cx, yy);
      ctx.fillStyle = 'rgba(11,15,28,0.45)';
      ctx.fillRect(0, ay1 + 4, R.W, R.H - ay1 - 4);
    }
  }

  function drawField(ctx, V) {
    const y0 = sy(0), y1 = sy(FW);
    const xMin = Math.max(0, Math.floor(R.cam.x - R.W / 2 / R.SX) - 1);
    const xMax = Math.min(120, Math.ceil(R.cam.x + R.W / 2 / R.SX) + 1);
    // Turf stripes every 5 yards.
    for (let x = 10; x < 110; x += 5) {
      if (x + 5 < xMin || x > xMax) continue;
      ctx.fillStyle = (x / 5) % 2 ? PAL.turfA : PAL.turfB;
      ctx.fillRect(sx(x), y0, sx(x + 5) - sx(x), y1 - y0);
    }
    // End zones in each defending team's colors.
    const ez = [
      { x: 0, seat: V.offSeat, rot: -1 },
      { x: 110, seat: V.defSeat, rot: 1 },
    ];
    for (const e of ez) {
      if (e.x + 10 < xMin || e.x > xMax) continue;
      const u = V.uni[e.seat];
      ctx.fillStyle = shade(u.jersey === '#f4f4f4' ? u.trim : u.jersey, -0.15);
      ctx.fillRect(sx(e.x), y0, sx(e.x + 10) - sx(e.x), y1 - y0);
      const name = V.teams[e.seat].name;
      const scale = R.portrait ? 2 : 3;
      ctx.save();
      ctx.translate(sx(e.x + 5), (y0 + y1) / 2);
      ctx.rotate((e.rot * Math.PI) / 2);
      F.draw(ctx, name, 0, -3.5 * scale, scale, u.jersey === '#f4f4f4' ? '#ffffff' : lighten(u.trim), 'center', 'rgba(0,0,0,0.35)');
      ctx.restore();
    }
    // Yard lines, goal lines, sidelines.
    ctx.fillStyle = PAL.chalk;
    for (let x = 10; x <= 110; x += 5) {
      if (x < xMin || x > xMax) continue;
      ctx.fillRect(sx(x), y0, x === 10 || x === 110 ? 2 : 1, y1 - y0);
    }
    ctx.fillRect(sx(0), y0 - 1, sx(120) - sx(0), 2);
    ctx.fillRect(sx(0), y1 - 1, sx(120) - sx(0), 2);
    ctx.fillRect(sx(0) - 1, y0, 2, y1 - y0);
    ctx.fillRect(sx(120) - 1, y0, 2, y1 - y0);
    // Hash marks every yard.
    const hy = [0.6, C.HASH_TOP, C.HASH_BOT, FW - 0.6];
    for (let x = Math.max(11, xMin); x < Math.min(110, xMax); x++) {
      if (x % 5 === 0) continue;
      const px = sx(x);
      for (const h of hy) ctx.fillRect(px, sy(h) - 1, 1, 2);
    }
    // Yard numbers.
    const ns = R.portrait ? 1 : 2;
    ctx.globalAlpha = 0.85;
    for (let x = 20; x <= 100; x += 10) {
      if (x < xMin - 3 || x > xMax + 3) continue;
      const n = String(x <= 60 ? x - 10 : 110 - x);
      F.draw(ctx, n, sx(x), sy(8) - 3 * ns, ns, PAL.chalk, 'center');
      F.draw(ctx, n, sx(x), sy(FW - 8) - 4 * ns, ns, PAL.chalk, 'center');
    }
    ctx.globalAlpha = 1;
    // Midfield logo.
    if (60 > xMin - 6 && 60 < xMax + 6) {
      const u = V.uni[0];
      const cx = sx(60), cy = sy(FW / 2), rx = Math.round(4.5 * R.SX), ry = Math.round(4.5 * R.SX * 0.62);
      ctx.fillStyle = u.jersey === '#f4f4f4' ? u.trim : u.jersey;
      ellipse(ctx, cx, cy, rx, ry);
      ctx.fillStyle = PAL.chalk;
      F.draw(ctx, V.teams[0].id, cx, cy - (R.portrait ? 3 : 7), R.portrait ? 1 : 2, u.helmet === u.jersey ? '#ffffff' : u.helmet, 'center');
    }
  }

  function drawLines(ctx, V) {
    const y0 = sy(0), y1 = sy(FW);
    if (V.los != null) {
      ctx.fillStyle = PAL.los;
      ctx.fillRect(sx(V.los), y0, 2, y1 - y0);
    }
    if (V.fdX != null && V.fdX < 110 && V.fdX > V.los) {
      ctx.fillStyle = PAL.fd;
      ctx.fillRect(sx(V.fdX), y0, 2, y1 - y0);
    }
  }

  // --- Sprites --------------------------------------------------------------------
  const BODY = [
    '...HHH...',
    '..HHHHH..',
    '..HHHSM..',
    '.JJJJJJJ.',
    '.TJJJJJT.',
    '.SJJJJJS.',
    '..JJJJJ..',
    '..PPPPP..',
  ];
  const LEGS = [
    ['.PP...PP.', '.KK...KK.', 'KK.....KK', 'B.......B'],
    ['..PP.PP..', '...KKK...', '...KK....', '...BB....'],
    ['.PP...PP.', '.KK...KK.', 'KK.....KK', 'B.......B'],
    ['..PP.PP..', '...KKK...', '....KK...', '....BB...'],
    ['..PP.PP..', '..KK.KK..', '..KK.KK..', '..BB.BB..'],
  ];
  const DOWN = [
    '.....JJJ.HH.',
    'BKKPPJJJJHHM',
    'BKKPPJJJJHH.',
    '.....SS.....',
  ];

  function sprite(uni, skin, pose, frame, face, carry, seat) {
    const key = `${seat}|${uni.jersey}|${skin}|${pose}|${frame}|${face}|${carry}`;
    let c = R.sprites.get(key);
    if (c) return c;
    const colors = {
      H: uni.helmet, M: '#9aa0a6', S: skin, J: uni.jersey, T: uni.trim === uni.jersey ? shade(uni.jersey, -0.3) : uni.trim,
      P: uni.pants, K: '#eeeeee', B: '#1a1a1a', L: PAL.ball,
    };
    let rows;
    if (pose === 'down' || pose === 'dive') rows = DOWN.slice();
    else {
      rows = BODY.concat(LEGS[pose === 'stand' || pose === 'block' ? 4 : frame % 4]);
      if (pose === 'block') {
        rows = rows.map((r, i) => (i >= 3 && i <= 5 ? '.' + r.slice(0, 8) : r));
        rows[4] = rows[4].slice(0, 7) + 'SS';
      }
      if (carry) rows[5] = rows[5].slice(0, 6) + 'LL' + rows[5][8];
    }
    const w = rows[0].length, h = rows.length;
    c = document.createElement('canvas');
    c.width = w;
    c.height = h;
    const x = c.getContext('2d');
    for (let r = 0; r < h; r++) {
      for (let q = 0; q < w; q++) {
        const ch = rows[r][face > 0 ? q : w - 1 - q];
        if (ch === '.') continue;
        x.fillStyle = colors[ch];
        x.fillRect(q, r, 1, 1);
      }
    }
    R.sprites.set(key, c);
    if (R.sprites.size > 900) R.sprites.clear();
    return c;
  }

  function drawPlayers(ctx, V) {
    const list = V.players.slice().sort((a, b) => a.y - b.y);
    for (const p of list) {
      const px = sx(p.x), py = sy(p.y);
      if (px < -20 || px > R.W + 20 || py < -20 || py > R.H + 30) continue;
      ctx.fillStyle = PAL.shadow;
      ellipse(ctx, px, py, 4, 1.5);
    }
    for (const p of list) {
      const px = sx(p.x), py = sy(p.y);
      if (px < -20 || px > R.W + 20 || py < -20 || py > R.H + 30) continue;
      const seat = p.side === 0 ? V.offSeat : V.defSeat;
      const uni = V.uni[seat];
      const moving = Math.hypot(p.vx || 0, p.vy || 0) > 0.6;
      let pose = p.down ? 'down' : p.lunge ? 'dive' : p.eng ? 'block' : moving ? 'run' : 'stand';
      const frame = moving ? Math.floor((R.t * (4 + Math.hypot(p.vx, p.vy))) + p.i) % 4 : 0;
      const carry = V.carrier === p.i && V.ball && V.ball.st !== 'air';
      const spr = sprite(uni, p.skin, pose, frame, p.face >= 0 ? 1 : -1, carry && pose !== 'down', seat);
      if (p.i === V.ctrl && V.live && !p.down) {
        ctx.fillStyle = 'rgba(255,210,63,0.9)';
        ring(ctx, px, py, 6, 2.5);
      }
      if (p.i === V.defCtrl && !p.down) {
        ctx.fillStyle = 'rgba(90,230,255,0.9)';
        ring(ctx, px, py, 6, 2.5);
      }
      const lift = pose === 'dive' ? 4 : 0;
      ctx.drawImage(spr, px - (spr.width >> 1), py - spr.height + 1 - lift);
      if (pose === 'down' && carry) {
        ctx.fillStyle = PAL.ball;
        ctx.fillRect(px + (p.face >= 0 ? 5 : -7), py - 2, 2, 1);
      }
    }
  }

  function drawBall(ctx, V) {
    const b = V.ball;
    if (!b || !b.visible) return;
    const carried = V.carrier >= 0 && b.st !== 'air' && b.st !== 'dead' && b.st !== 'snap';
    if (carried) return;
    const px = sx(b.x), py = sy(b.y), pz = Math.round(b.z * R.SZ);
    ctx.fillStyle = PAL.shadow;
    ellipse(ctx, px, py, 2, 1);
    const big = b.z > 4 ? 1 : 0;
    ctx.fillStyle = '#3a1d0c';
    ctx.fillRect(px - 3 - big, py - pz - 2, 6 + big * 2, 4 + big);
    ctx.fillStyle = PAL.ball;
    ctx.fillRect(px - 2 - big, py - pz - 1, 4 + big * 2, 2 + big);
    ctx.fillStyle = '#f2efe6';
    ctx.fillRect(px, py - pz - 1, 1, 1);
  }

  function drawAim(ctx, V) {
    const a = V.aim;
    if (!a) return;
    ctx.fillStyle = a.max ? '#ff9a3c' : '#ffffff';
    for (const p of a.pts) ctx.fillRect(sx(p.x) - 1, sy(p.y) - Math.round(p.z * R.SZ) - 1, 2, 2);
    const tx = sx(a.x), ty = sy(a.y);
    ctx.fillStyle = a.max ? '#ff9a3c' : PAL.good;
    ring(ctx, tx, ty, 5, 2.4);
    ctx.fillRect(tx - 1, ty - 1, 2, 2);
  }

  function drawLanding(ctx, V) {
    if (!V.landing || !V.ball || V.ball.st !== 'air') return;
    const pulse = 3 + Math.round(Math.sin(R.t * 12));
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ring(ctx, sx(V.landing.x), sy(V.landing.y), pulse + 2, pulse * 0.6 + 1);
  }

  function drawJoy(ctx, V) {
    const j = V.joy;
    if (!j) return;
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    ellipse(ctx, j.x0, j.y0, 16, 16);
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ellipse(ctx, j.x1, j.y1, 6, 6);
  }

  // --- Weather --------------------------------------------------------------------
  function drawWeather(ctx, V, dt) {
    const type = V.wx && V.wx.type;
    if (type !== 'rain' && type !== 'snow') return;
    const n = type === 'rain' ? 90 : 70;
    while (R.rain.length < n) R.rain.push({ x: Math.random() * R.W, y: Math.random() * R.H, s: 0.6 + Math.random() * 0.8 });
    ctx.fillStyle = type === 'rain' ? 'rgba(170,200,255,0.55)' : 'rgba(255,255,255,0.85)';
    for (const p of R.rain) {
      if (type === 'rain') { p.y += 260 * p.s * dt; p.x -= 40 * dt; ctx.fillRect(p.x | 0, p.y | 0, 1, 3); }
      else { p.y += 30 * p.s * dt; p.x += Math.sin(R.t + p.s * 9) * 12 * dt; ctx.fillRect(p.x | 0, p.y | 0, p.s > 1 ? 2 : 1, p.s > 1 ? 2 : 1); }
      if (p.y > R.H) { p.y = -4; p.x = Math.random() * R.W; }
      if (p.x < 0) p.x += R.W;
      if (p.x > R.W) p.x -= R.W;
    }
  }

  // --- HUD ------------------------------------------------------------------------
  function drawHUD(ctx, V) {
    const g = V.g;
    if (!g) return;
    const G = RB.Game;
    const narrow = R.W < 330;
    const boxW = narrow ? 64 : 76, clockW = narrow ? 58 : 64, h = 17;
    const total = boxW * 2 + clockW;
    const x0 = Math.round(R.W / 2 - total / 2), y0 = R.portrait ? 26 : 3;
    ctx.fillStyle = PAL.ink;
    ctx.fillRect(x0 - 2, y0 - 2, total + 4, h + 4);
    for (let s = 0; s < 2; s++) {
      const u = V.uni[s];
      const bx = s === 0 ? x0 : x0 + boxW + clockW;
      const bg = u.jersey === '#f4f4f4' ? u.trim : u.jersey;
      ctx.fillStyle = bg;
      ctx.fillRect(bx, y0, boxW, h);
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.fillRect(bx, y0 + h - 3, boxW, 3);
      const name = V.teams[s].id;
      const fg = readable(bg);
      if (s === 0) {
        F.draw(ctx, name, bx + 4, y0 + 5, 1, fg);
        F.draw(ctx, String(g.score[0]), bx + boxW - 4, y0 + 2, 2, '#ffffff', 'right', 'rgba(0,0,0,0.4)');
      } else {
        F.draw(ctx, String(g.score[1]), bx + 4, y0 + 2, 2, '#ffffff', 'left', 'rgba(0,0,0,0.4)');
        F.draw(ctx, name, bx + boxW - 4, y0 + 5, 1, fg, 'right');
      }
      // Timeouts
      for (let i = 0; i < 3; i++) {
        ctx.fillStyle = i < g.to[s] ? PAL.amber : 'rgba(255,255,255,0.15)';
        const tx = s === 0 ? bx + 4 + i * 7 : bx + boxW - 9 - i * 7;
        ctx.fillRect(tx, y0 + h + 1, 5, 1);
      }
      // Possession football
      if (g.poss === s && !['final', 'half', 'coin'].includes(g.phase)) {
        ctx.fillStyle = PAL.ball;
        const fx = s === 0 ? bx + boxW - 30 : bx + 26;
        ctx.fillRect(fx, y0 + 7, 4, 3);
        ctx.fillStyle = '#fff';
        ctx.fillRect(fx + 1, y0 + 8, 2, 1);
      }
    }
    const cx = x0 + boxW;
    ctx.fillStyle = '#16181f';
    ctx.fillRect(cx, y0, clockW, h);
    const per = G.periodText(g);
    const clock = g.ot ? '' : G.fmtClock(g.clock);
    if (g.ot) F.draw(ctx, per, cx + clockW / 2, y0 + 5, 1, PAL.amber, 'center');
    else {
      F.draw(ctx, per, cx + 3, y0 + 5, 1, PAL.amber);
      F.draw(ctx, clock, cx + clockW - 3, y0 + 5, 1, g.clockRunning && g.phase === 'presnap' ? '#ffffff' : PAL.amber, 'right');
    }
    // Down & distance chyron
    if (['presnap', 'play', 'after', 'handoff'].includes(g.phase)) {
      const txt = `${G.downText(g)} · ${G.spotText(g.ballOn)}`;
      const w = F.width(txt, 1) + 10;
      const yy = y0 + h + 4;
      ctx.fillStyle = 'rgba(13,15,20,0.82)';
      ctx.fillRect(Math.round(R.W / 2 - w / 2), yy, w, 11);
      F.draw(ctx, txt, R.W / 2, yy + 2, 1, '#ffffff', 'center');
    }
  }

  function drawBanner(ctx, V) {
    const b = V.g && V.g.banner;
    if (!b) return;
    let scale = R.W >= 420 ? 3 : 2;
    while (scale > 1 && F.width(b.text, scale) > R.W - 16) scale--;
    const color = b.color === 'good' ? PAL.good : b.color === 'bad' ? PAL.bad : '#ffffff';
    const y = Math.round(R.hudH + (R.H - R.hudH - R.bottom) * 0.3);
    const bandH = 7 * scale + (b.sub ? 14 : 0) + 12;
    ctx.fillStyle = 'rgba(8,10,18,0.72)';
    ctx.fillRect(0, y - 6, R.W, bandH);
    ctx.fillStyle = color;
    ctx.fillRect(0, y - 6, R.W, 1);
    ctx.fillRect(0, y - 6 + bandH - 1, R.W, 1);
    F.draw(ctx, b.text, R.W / 2, y, scale, color, 'center', 'rgba(0,0,0,0.6)');
    if (b.sub) F.draw(ctx, b.sub, R.W / 2, y + 7 * scale + 5, 1, '#e8e8e8', 'center');
  }

  function drawFooter(ctx, V) {
    const g = V.g;
    if (!g || g.phase !== 'presnap' || !g.lastPlay) return;
    const y = R.H - R.bottom - 12;
    F.draw(ctx, `LAST: ${g.lastPlay}`, 6, y, 1, 'rgba(255,255,255,0.75)');
  }

  // --- Kick view ------------------------------------------------------------------
  function drawKick(ctx, V) {
    const k = V.kick;
    const W = R.W, H = R.H - R.bottom;
    const horizon = Math.round(R.hudH + (H - R.hudH) * 0.28);
    const camBack = 9, camH = 2.1, f = (H - R.hudH) * 0.95;
    const P = (x, d, h) => {
      const z = Math.max(0.5, d + camBack);
      return { x: Math.round(W / 2 + (x * f) / z), y: Math.round(horizon + ((camH - h) * f) / z), s: f / z };
    };
    ctx.fillStyle = PAL.night;
    ctx.fillRect(0, 0, W, R.H);
    if (R.crowd) {
      for (let yy = horizon - 6 - R.crowd.height; yy > -R.crowd.height; yy -= R.crowd.height) ctx.drawImage(R.crowd, 0, yy);
      ctx.fillStyle = 'rgba(11,15,28,0.55)';
      ctx.fillRect(0, 0, W, horizon - 6);
    }
    ctx.fillStyle = PAL.wall;
    ctx.fillRect(0, horizon - 6, W, 6);
    // Turf with 5-yard bands.
    const far = k.dist + 14;
    for (let d = -camBack + 1; d < far; d += 5) {
      const a = P(0, d, 0), b = P(0, Math.min(far, d + 5), 0);
      ctx.fillStyle = Math.floor((d + 100) / 5) % 2 ? PAL.turfA : PAL.turfB;
      ctx.fillRect(0, b.y, W, a.y - b.y + 1);
    }
    ctx.fillStyle = PAL.turfB;
    ctx.fillRect(0, horizon, W, P(0, far, 0).y - horizon);
    // Yard lines.
    ctx.fillStyle = PAL.chalk;
    for (let d = 0; d <= far; d += 5) {
      const l = P(-26.6, d, 0), r = P(26.6, d, 0);
      ctx.fillRect(l.x, l.y, r.x - l.x, d === k.dist - 10 ? 2 : 1);
    }
    // End zone behind the goal line.
    const gl = P(0, k.dist - 10, 0), bl = P(0, k.dist, 0);
    ctx.fillStyle = 'rgba(0,0,0,0.12)';
    ctx.fillRect(0, bl.y, W, gl.y - bl.y);
    // Goal posts.
    const barL = P(-C_HALF(), k.dist, RB.Kick.BAR), barR = P(C_HALF(), k.dist, RB.Kick.BAR);
    const topL = P(-C_HALF(), k.dist, 10), base = P(0, k.dist + 1.2, 0), baseTop = P(0, k.dist + 1.2, RB.Kick.BAR);
    ctx.fillStyle = '#f4d23a';
    ctx.fillRect(base.x - 1, baseTop.y, 2, base.y - baseTop.y);
    ctx.fillRect(barL.x, barL.y - 1, barR.x - barL.x, 2);
    ctx.fillRect(barL.x - 1, topL.y, 2, barL.y - topL.y);
    ctx.fillRect(barR.x - 1, topL.y, 2, barR.y - topL.y);
    // Preview arc while aiming.
    if (k.phase === 'aim' && V.kickAim) {
      ctx.fillStyle = V.kickAim.power >= k.need ? '#ffffff' : '#ff9a3c';
      for (const p of RB.Kick.preview(k, V.kickAim.aim, V.kickAim.power, 16)) {
        const q = P(p.x, p.d, p.h);
        ctx.fillRect(q.x - 1, q.y - 1, 2, 2);
      }
    }
    // Holder and kicker (from behind).
    const hp = P(0.4, 0, 0), kp = P(-1.4, -2.4, 0);
    ctx.fillStyle = V.kickUni.jersey;
    ctx.fillRect(hp.x - 3, hp.y - 7, 7, 6);
    ctx.fillStyle = V.kickUni.helmet;
    ctx.fillRect(hp.x - 2, hp.y - 10, 5, 3);
    const kickT = k.phase === 'aim' ? 0 : Math.min(1, k.t * 6);
    const kx = Math.round(kp.x + kickT * 10), ky = kp.y;
    ctx.fillStyle = V.kickUni.helmet;
    ctx.fillRect(kx - 4, ky - 26, 8, 6);
    ctx.fillStyle = V.kickUni.jersey;
    ctx.fillRect(kx - 5, ky - 20, 10, 10);
    ctx.fillStyle = V.kickUni.pants;
    ctx.fillRect(kx - 4, ky - 10, 8, 5);
    ctx.fillStyle = '#eeeeee';
    ctx.fillRect(kx - 4, ky - 5, 3, 5);
    ctx.fillRect(kx + 1, ky - 5 - Math.round(kickT * 4), 3, 5);
    // Ball.
    const b = k.ball;
    const bp = P(b.x, b.d, b.h), sp = P(b.x, b.d, 0);
    ctx.fillStyle = PAL.shadow;
    ellipse(ctx, sp.x, sp.y, Math.max(1, bp.s * 0.3), Math.max(1, bp.s * 0.1));
    const bs = Math.max(2, Math.round(bp.s * 0.35));
    ctx.fillStyle = PAL.ball;
    ctx.fillRect(bp.x - (bs >> 1), bp.y - bs, bs, Math.max(2, Math.round(bs * 0.7)));
    // Power meter + wind.
    const mh = Math.round((H - R.hudH) * 0.55), mx = W - 18, my = R.hudH + 30;
    ctx.fillStyle = PAL.ink;
    ctx.fillRect(mx - 2, my - 2, 10, mh + 4);
    const pw = k.phase === 'aim' ? (V.kickAim ? V.kickAim.power : 0) : k.power;
    const fillH = Math.round(Math.min(1.08, pw) / 1.08 * mh);
    ctx.fillStyle = pw >= k.need ? '#5fd35f' : '#ff9a3c';
    ctx.fillRect(mx, my + mh - fillH, 6, fillH);
    const needY = my + mh - Math.round(Math.min(1.08, k.need) / 1.08 * mh);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(mx - 4, needY, 14, 1);
    F.draw(ctx, 'PWR', mx + 3, my + mh + 5, 1, '#ffffff', 'center');
    drawWind(ctx, V.wx, 10, R.hudH + 30);
    const title = `${k.type === 'xp' ? 'EXTRA POINT' : 'FIELD GOAL'} · ${k.dist} YDS`;
    plate(ctx, title, W / 2, R.hudH + 6, PAL.amber);
    if (k.phase === 'aim' && V.kickHint) plate(ctx, V.kickHint, W / 2, H - 18, '#ffffff');
  }
  function C_HALF() {
    return RB.Kick.HALF_W;
  }

  // One line of text on a dark plate, centered on x.
  function plate(ctx, text, x, y, color) {
    const w = F.width(text, 1) + 10;
    ctx.fillStyle = 'rgba(13,15,20,0.85)';
    ctx.fillRect(Math.round(x - w / 2), y - 3, w, 13);
    F.draw(ctx, text, x, y, 1, color, 'center');
  }

  function drawWind(ctx, wx, x, y) {
    if (!wx) return;
    const label = `WIND ${wx.wind} MPH`;
    ctx.fillStyle = 'rgba(13,15,20,0.85)';
    ctx.fillRect(x - 4, y - 3, F.width(label, 1) + 8, 38);
    F.draw(ctx, label, x, y, 1, '#ffffff', 'left');
    const cx = x + 14, cy = y + 20, r = 9;
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ellipse(ctx, cx, cy, r + 2, r + 2);
    if (wx.wind > 0) {
      // Angle 0 = tailwind (toward the posts, up on screen).
      const dx = Math.sin(wx.windDir), dy = -Math.cos(wx.windDir);
      ctx.fillStyle = PAL.amber;
      for (let i = -r; i <= r; i++) ctx.fillRect(Math.round(cx + dx * i), Math.round(cy + dy * i), 1, 1);
      ctx.fillRect(Math.round(cx + dx * r) - 1, Math.round(cy + dy * r) - 1, 3, 3);
    }
  }

  // --- Helpers ------------------------------------------------------------------------
  function ellipse(ctx, cx, cy, rx, ry) {
    ctx.beginPath();
    ctx.ellipse(cx, cy, Math.max(0.5, rx), Math.max(0.5, ry), 0, 0, Math.PI * 2);
    ctx.fill();
  }
  function ring(ctx, cx, cy, rx, ry) {
    for (let a = 0; a < Math.PI * 2; a += Math.PI / 10) {
      ctx.fillRect(Math.round(cx + Math.cos(a) * rx), Math.round(cy + Math.sin(a) * ry), 1, 1);
    }
  }
  function hexToRgb(h) {
    return [1, 3, 5].map((i) => parseInt(h.substr(i, 2), 16));
  }
  function shade(h, amt) {
    const [r, g, b] = hexToRgb(h);
    const f = (v) => clamp(Math.round(v * (1 + amt)), 0, 255).toString(16).padStart(2, '0');
    return `#${f(r)}${f(g)}${f(b)}`;
  }
  function lighten(h) {
    const [r, g, b] = hexToRgb(h);
    const lum = 0.299 * r + 0.587 * g + 0.114 * b;
    return lum < 60 ? '#e8e8e8' : h;
  }
  function readable(h) {
    const [r, g, b] = hexToRgb(h);
    return 0.299 * r + 0.587 * g + 0.114 * b > 150 ? '#111111' : '#ffffff';
  }

  function frame(V, dt) {
    const ctx = R.ctx;
    R.t += dt;
    if (V.uni) buildCrowd(V.uni);
    if (V.mode === 'kick' && V.kick) {
      drawKick(ctx, V);
      drawHUD(ctx, V);
      drawBanner(ctx, V);
      return;
    }
    updateCamera(V, dt);
    drawStadium(ctx, V);
    if (V.uni) {
      drawField(ctx, V);
      if (V.players) {
        drawLines(ctx, V);
        drawLanding(ctx, V);
        drawPlayers(ctx, V);
        drawBall(ctx, V);
        drawAim(ctx, V);
      }
    }
    drawWeather(ctx, V, dt);
    drawJoy(ctx, V);
    drawHUD(ctx, V);
    drawFooter(ctx, V);
    drawBanner(ctx, V);
  }

  // Team preview on the pick screen: one standing player, drawn at 1:1.
  function drawSprite(ctx, uni, skin) {
    ctx.drawImage(sprite(uni, skin, 'stand', 0, 1, false, 'pick'), 0, 0);
  }

  RB.Render = { R, init, resize, frame, toWorld, screenDeltaToWorld, sx, sy, PAL, readable, shade, drawSprite };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* src/input.js */
/* Rivalry Bowl: touch / mouse gestures -> game intents.
 * Contexts: 'qb' (can throw), 'run' (steer carrier), 'def' (steer defender),
 * 'kick' (aim + power), 'none'. */
(function (root) {
  'use strict';
  const RB = root.RB;
  const AIM_GAIN = 2.8; // pass distance per unit of drag, in world terms
  const DEAD = 9; // css px before a drag counts
  const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);

  const S = {
    el: null, ctxFn: null,
    id: null, mode: null, x0: 0, y0: 0, x: 0, y: 0, t0: 0,
    intents: { throwAt: null, juke: false, dive: null, kick: null, tapAt: null },
    lastCtx: 'none',
  };

  function attach(el, ctxFn) {
    S.el = el;
    S.ctxFn = ctxFn;
    el.addEventListener('pointerdown', down);
    el.addEventListener('pointermove', move);
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', cancel);
    el.addEventListener('contextmenu', (e) => e.preventDefault());
  }

  function pos(e) {
    const r = S.el.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  function down(e) {
    if (S.id !== null) return;
    const c = S.ctxFn();
    if (c === 'none') return;
    e.preventDefault();
    S.id = e.pointerId;
    try { S.el.setPointerCapture(e.pointerId); } catch (err) { /* capture is optional */ }
    const p = pos(e);
    S.x0 = S.x = p.x;
    S.y0 = S.y = p.y;
    S.t0 = performance.now();
    S.mode = null;
    S.lastCtx = c;
    if (c === 'kick') S.mode = 'kick';
    if (RB.Audio) RB.Audio.unlock();
  }

  function move(e) {
    if (e.pointerId !== S.id) return;
    e.preventDefault();
    const p = pos(e);
    S.x = p.x;
    S.y = p.y;
    if (S.mode) return;
    const dx = S.x - S.x0, dy = S.y - S.y0;
    if (Math.hypot(dx, dy) < DEAD) return;
    const c = S.lastCtx;
    if (c === 'qb') S.mode = dx > 0 && dx > Math.abs(dy) * 0.6 ? 'joy' : 'aim';
    else if (c === 'run' || c === 'def') S.mode = 'joy';
  }

  function up(e) {
    if (e.pointerId !== S.id) return;
    const p = pos(e);
    S.x = p.x;
    S.y = p.y;
    const dt = performance.now() - S.t0;
    const dx = S.x - S.x0, dy = S.y - S.y0, len = Math.hypot(dx, dy);
    const c = S.ctxFn();
    if (S.mode === 'aim' && c === 'qb' && len >= 14) {
      S.intents.throwAt = aimTarget();
    } else if (S.mode === 'kick' && c === 'kick') {
      const k = kickVals();
      if (k.power > 0.08) S.intents.kick = k;
    } else if (!S.mode && dt < 260) {
      if (c === 'pick') {
        const k = RB.Render.R.k;
        S.intents.tapAt = RB.Render.toWorld(S.x / k, S.y / k);
      } else S.intents.juke = true;
    } else if (S.mode === 'joy' && dt < 230 && len > 26 && (c === 'run')) {
      const w = RB.Render.screenDeltaToWorld(dx, dy);
      S.intents.dive = { x: w.x, y: w.y };
    }
    reset();
  }

  function cancel(e) {
    if (e.pointerId === S.id) reset();
  }
  function reset() {
    S.id = null;
    S.mode = null;
  }

  // World-space throw target for the current drag (pull back to aim).
  function aimTarget() {
    const q = S.qb;
    if (!q) return null;
    const w = RB.Render.screenDeltaToWorld(S.x0 - S.x, S.y0 - S.y);
    return { x: q.x + w.x * AIM_GAIN, y: q.y + w.y * AIM_GAIN };
  }

  function kickVals() {
    const r = S.el.getBoundingClientRect();
    const m = Math.min(r.width, r.height);
    return {
      power: clamp((S.y - S.y0) / (m * 0.42), 0, 1.08),
      aim: clamp(-(S.x - S.x0) / (m * 0.3), -1, 1),
    };
  }

  // Called once per frame by main: live aim, joystick and one-shot intents.
  function poll(qbWorld) {
    S.qb = qbWorld;
    const out = {
      aiming: S.id !== null && S.mode === 'aim',
      aimAt: null,
      joy: null,
      joyScreen: null,
      kick: null,
      throwAt: S.intents.throwAt,
      juke: S.intents.juke,
      dive: S.intents.dive,
      kickLaunch: S.intents.kick,
      tapAt: S.intents.tapAt,
    };
    S.intents = { throwAt: null, juke: false, dive: null, kick: null, tapAt: null };
    if (out.aiming) out.aimAt = aimTarget();
    if (S.id !== null && S.mode === 'joy') {
      const dx = S.x - S.x0, dy = S.y - S.y0, len = Math.hypot(dx, dy);
      if (len > 4) {
        const w = RB.Render.screenDeltaToWorld(dx, dy);
        const wl = Math.hypot(w.x, w.y) || 1;
        const mag = clamp(len / 26, 0.35, 1);
        out.joy = { x: (w.x / wl) * mag, y: (w.y / wl) * mag };
      }
      const k = RB.Render.R.k;
      const lim = Math.min(len, 22 * k);
      out.joyScreen = { x0: S.x0 / k, y0: S.y0 / k, x1: (S.x0 + (len ? (dx / len) * lim : 0)) / k, y1: (S.y0 + (len ? (dy / len) * lim : 0)) / k };
    }
    if (S.id !== null && S.mode === 'kick') out.kick = kickVals();
    return out;
  }

  function active() {
    return S.id !== null;
  }

  RB.Input = { attach, poll, active, reset, AIM_GAIN };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* src/audio.js */
/* Rivalry Bowl: tiny WebAudio synth for 8-bit sound effects. */
(function (root) {
  'use strict';
  const RB = root.RB;
  const A = { ctx: null, on: true, master: null, noiseBuf: null };

  function unlock() {
    if (A.ctx || typeof window === 'undefined') {
      if (A.ctx && A.ctx.state === 'suspended') A.ctx.resume();
      return;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      A.ctx = new AC();
      A.master = A.ctx.createGain();
      A.master.gain.value = 0.22;
      A.master.connect(A.ctx.destination);
      const len = A.ctx.sampleRate * 0.5;
      A.noiseBuf = A.ctx.createBuffer(1, len, A.ctx.sampleRate);
      const d = A.noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) {
      A.ctx = null;
    }
  }

  function tone(freq, t0, dur, type, vol, slideTo) {
    const c = A.ctx;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(vol || 0.5, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g);
    g.connect(A.master);
    o.start(t0);
    o.stop(t0 + dur + 0.02);
    return o;
  }

  function noise(t0, dur, vol, hp) {
    const c = A.ctx;
    const s = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
    s.buffer = A.noiseBuf;
    f.type = hp ? 'highpass' : 'lowpass';
    f.frequency.value = hp || 900;
    g.gain.setValueAtTime(vol || 0.5, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    s.connect(f);
    f.connect(g);
    g.connect(A.master);
    s.start(t0);
    s.stop(t0 + dur + 0.02);
  }

  function play(name) {
    if (!A.on || !A.ctx) return;
    const t = A.ctx.currentTime + 0.01;
    switch (name) {
      case 'hut': noise(t, 0.08, 0.6); tone(140, t, 0.1, 'square', 0.3); break;
      case 'whistle': {
        const o = tone(2350, t, 0.32, 'square', 0.18);
        const lfo = A.ctx.createOscillator(), lg = A.ctx.createGain();
        lfo.frequency.value = 38; lg.gain.value = 120;
        lfo.connect(lg); lg.connect(o.frequency); lfo.start(t); lfo.stop(t + 0.34);
        break;
      }
      case 'throw': noise(t, 0.12, 0.25, 1800); break;
      case 'catch': tone(660, t, 0.05, 'square', 0.35); tone(990, t + 0.05, 0.07, 'square', 0.35); break;
      case 'juke': noise(t, 0.09, 0.5); tone(90, t, 0.1, 'triangle', 0.5); break;
      case 'swish': noise(t, 0.15, 0.2, 2500); break;
      case 'first': tone(784, t, 0.08, 'square', 0.3); tone(1046, t + 0.09, 0.12, 'square', 0.3); break;
      case 'bad': tone(392, t, 0.12, 'square', 0.3, 330); tone(262, t + 0.13, 0.25, 'square', 0.3, 196); break;
      case 'kick': noise(t, 0.07, 0.8); tone(110, t, 0.12, 'triangle', 0.6, 60); break;
      case 'td':
        [523, 659, 784, 1046].forEach((f, i) => tone(f, t + i * 0.1, 0.16, 'square', 0.3));
        noise(t, 1.2, 0.12, 400);
        break;
      case 'final':
        [392, 523, 659, 784, 659, 1046].forEach((f, i) => tone(f, t + i * 0.12, 0.2, 'square', 0.28));
        break;
      case 'tap': tone(880, t, 0.03, 'square', 0.18); break;
    }
  }

  RB.Audio = { unlock, play, setOn: (v) => { A.on = v; }, isOn: () => A.on };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* src/net.js */
/* Rivalry Bowl: online head-to-head over presence.
 *
 * Every phone publishes one presence object. There are no messages to lose:
 * each side always publishes its latest absolute state and reads the other's.
 *  - The phone whose player is on offense (g.ctl) is the authority. It runs
 *    the simulation and publishes the game state `g` plus a compact snapshot
 *    of the play. Offense input never crosses the network, so passing has
 *    no lag.
 *  - The other phone renders those snapshots and publishes its defensive
 *    call, the defender it steers, its joystick and timeout requests.
 *  - When possession changes, the authority writes g.ctl = other seat. The
 *    other phone sees a higher g.ver, adopts the state and takes over.
 *
 * Transport: the claude.ai artifact `room` capability, or a BroadcastChannel
 * stand-in (open the page with #localnet) for testing with two tabs. */
(function (root) {
  'use strict';
  const RB = root.RB;
  const { C, Game, Sim } = RB;
  const APP = 'rivalry';
  const PUB_MS = 55;
  const LOST_MS = 6000;

  // --- Transports -------------------------------------------------------------------
  // Both expose: me(), setPresence(obj), peers() -> [{peer, presence, isMe}],
  // connected(), close().
  async function roomTransport() {
    const use = root.claude && root.claude.use;
    if (!use) return null;
    let room = null;
    try { room = await use('room'); } catch (e) { room = null; }
    if (!room) return null;
    let mine = {};
    let err = null;
    let conn = false;
    const unConn = room.onConnection((c) => { conn = c; }, (e) => { err = e.code; });
    const unPeers = room.onPeers(() => {}, (e) => { err = e.code; });
    return {
      kind: 'room',
      me() {
        const p = room.peers().find((x) => x.sameTab);
        return p ? p.peer : null;
      },
      setPresence(obj) {
        // Plain JSON only: drop nulls (a top-level null means "remove").
        obj = JSON.parse(JSON.stringify(obj, (k, v) => (v === null && k !== '' ? undefined : v)));
        // Presence merges per field; null clears fields we no longer send.
        const patch = Object.assign({}, obj);
        for (const k of Object.keys(mine)) if (!(k in obj)) patch[k] = null;
        mine = obj;
        room.presence(patch).catch((e) => { if (e && e.code && e.code !== 'upstream_error') err = e.code; });
      },
      peers() {
        return room.peers().filter((p) => p.kind !== 'agent').map((p) => ({ peer: p.peer, presence: p.presence || {}, isMe: p.sameTab }));
      },
      connected() { return room.connected(); },
      error() { return err; },
      close() {
        try { room.presence(Object.fromEntries(Object.keys(mine).map((k) => [k, null]))); } catch (e) { /* closing anyway */ }
        unConn(); unPeers();
      },
      _conn: () => conn,
    };
  }

  function localTransport() {
    if (typeof BroadcastChannel === 'undefined') return null;
    const bc = new BroadcastChannel('rivalry-localnet');
    const id = Math.random().toString(36).slice(2, 10);
    const others = new Map();
    let mine = {};
    let lastSend = 0;
    const send = (type) => bc.postMessage({ type, peer: id, presence: mine, t: Date.now() });
    bc.onmessage = (e) => {
      const m = e.data;
      if (!m || m.peer === id) return;
      if (m.type === 'bye') { others.delete(m.peer); return; }
      others.set(m.peer, { presence: m.presence || {}, seen: Date.now() });
      if (m.type === 'hello') send('state');
    };
    send('hello');
    const hb = setInterval(() => {
      if (Date.now() - lastSend > 800) send('state');
      for (const [k, v] of others) if (Date.now() - v.seen > 4000) others.delete(k);
    }, 400);
    return {
      kind: 'local',
      me: () => id,
      setPresence(obj) { mine = obj; lastSend = Date.now(); send('state'); },
      peers() {
        const list = [{ peer: id, presence: mine, isMe: true }];
        for (const [peer, v] of others) list.push({ peer, presence: v.presence, isMe: false });
        return list;
      },
      connected: () => true,
      error: () => null,
      close() { send('bye'); clearInterval(hb); bc.close(); },
    };
  }

  // --- Snapshot encoding --------------------------------------------------------------
  const B36 = (n, w) => Math.max(0, Math.min(36 ** w - 1, Math.round(n))).toString(36).padStart(w, '0');
  const D36 = (s) => parseInt(s, 36);

  function encodePlay(play) {
    if (!play) return null;
    let s = '';
    for (const p of play.players) {
      const f = (p.face >= 0 ? 1 : 0) | (p.down > 0.25 ? 2 : 0) | ((p.lunge || 0) > 0 ? 4 : 0) | (p.eng >= 0 ? 8 : 0);
      s += B36((p.x + 5) * 10, 3) + B36((p.y + 3) * 10, 2) + f.toString(36);
    }
    const b = play.ball;
    const st = ['snap', 'held', 'air', 'dead', 'down'].indexOf(b.st);
    return {
      s,
      b: [r2(b.x), r2(b.y), r2(b.z), st, play.carrier],
      m: [r2(play.los), r2(play.fdX), r2(play.ballY), play.phase === 'live' ? 1 : play.phase === 'pre' ? 0 : 2, play.turnover ? 1 : 0, play.humanDefIdx],
      l: play.landing && b.st === 'air' ? [r2(play.landing.x), r2(play.landing.y)] : null,
    };
  }

  function decodePlay(o) {
    const players = [];
    for (let i = 0; i < 22; i++) {
      const c = o.s.substr(i * 6, 6);
      const f = D36(c[5]);
      players.push({ i, side: i < 11 ? 0 : 1, x: D36(c.substr(0, 3)) / 10 - 5, y: D36(c.substr(3, 2)) / 10 - 3, face: f & 1 ? 1 : -1, down: !!(f & 2), lunge: !!(f & 4), eng: !!(f & 8) });
    }
    return {
      players,
      ball: { x: o.b[0], y: o.b[1], z: o.b[2], st: ['snap', 'held', 'air', 'dead', 'down'][o.b[3]] || 'held', visible: true },
      carrier: o.b[4], los: o.m[0], fdX: o.m[1], ballY: o.m[2], live: o.m[3] === 1, pre: o.m[3] === 0,
      turnover: !!o.m[4], humanDefIdx: o.m[5], landing: o.l ? { x: o.l[0], y: o.l[1] } : null,
    };
  }

  function encodeKick(k) {
    if (!k) return null;
    return { ty: k.type, d: k.dist, ph: k.phase, t: r2(k.t), bx: r2(k.ball.x), bd: r2(k.ball.d), bh: r2(k.ball.h), nd: r2(k.need), pw: r2(k.power) };
  }
  function decodeKick(o) {
    return { type: o.ty, dist: o.d, phase: o.ph, t: o.t, ball: { x: o.bx, d: o.bd, h: o.bh }, need: o.nd, power: o.pw };
  }

  const r2 = (v) => Math.round(v * 100) / 100;
  function compactG(g) {
    return JSON.parse(JSON.stringify(g, (k, v) => (typeof v === 'number' && !Number.isInteger(v) ? r2(v) : v)));
  }
  function code4() {
    const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
    let s = '';
    for (let i = 0; i < 4; i++) s += A[Math.floor(Math.random() * A.length)];
    return s;
  }

  // --- Session ------------------------------------------------------------------------------
  const Net = {
    App: null, t: null, state: 'idle', err: '',
    role: null, seat: 0, code: '', partner: null, partnerSeen: 0,
    G: null, lastPub: 0, disp: null, snap: null, kickSnap: null,
    fx: [], fxn: 0, fxSeen: -1, actN: 0, actSeen: {}, dcN: 0, lastDcN: -1, defIdx: Sim.IDX.S1,
    pending: null, lastAdoptVer: 0,

    async open(App) {
      this.App = App;
      App.net = this;
      this.reset();
      this.state = 'connecting';
      const wantLocal = /localnet/.test(location.hash);
      let t = wantLocal ? localTransport() : await roomTransport();
      if (!t && !wantLocal && !(root.claude && root.claude.use)) t = null;
      if (App.net !== this || App.screen !== 'lobby') { if (t) t.close(); return; }
      if (!t) { this.state = 'unavailable'; return; }
      this.t = t;
      this.state = 'lobby';
      this.publishLobby();
    },

    reset() {
      Object.assign(this, { role: null, partner: null, G: null, snap: null, kickSnap: null, disp: null, fx: [], fxn: 0, fxSeen: -1, actN: 0, actSeen: {}, dcN: 0, lastDcN: -1, pending: null, err: '', defIdx: Sim.IDX.S1, lastAdoptVer: 0 });
    },

    leave() {
      if (this.t) this.t.close();
      this.t = null;
      this.state = 'idle';
      this.reset();
      if (this.App) this.App.net = null;
    },

    me() { return this.t ? this.t.me() : null; },

    base() {
      const A = this.App;
      return { a: APP, v: 1, nm: A.names[0], tm: A.picks[0], role: this.role || 'idle' };
    },

    publishLobby() {
      if (!this.t) return;
      const p = this.base();
      const s = this.App.settings;
      if (this.role === 'host') Object.assign(p, { code: this.code, open: !this.partner, gp: this.partner || '', q: s.qlen, d: s.diff, e: s.even ? 1 : 0 });
      if (this.role === 'guest') Object.assign(p, { join: this.joinPeer, code: this.code });
      this.t.setPresence(p);
    },

    others() {
      return this.t ? this.t.peers().filter((p) => !p.isMe && p.presence && p.presence.a === APP) : [];
    },
    partnerPresence() {
      if (!this.partner) return null;
      const p = this.others().find((x) => x.peer === this.partner);
      if (p) this.partnerSeen = Date.now();
      return p ? p.presence : null;
    },

    // --- Lobby actions ---
    action(a, el) {
      if (a === 'host') {
        this.role = 'host';
        this.seat = 0;
        this.code = code4();
        this.state = 'hosting';
        this.publishLobby();
      } else if (a === 'join') {
        this.role = 'guest';
        this.seat = 1;
        this.joinPeer = el.dataset.peer;
        this.code = el.dataset.code;
        this.state = 'joining';
        this.publishLobby();
      } else if (a === 'cancel') {
        this.role = null;
        this.partner = null;
        this.state = 'lobby';
        this.publishLobby();
      } else if (a === 'fallback') {
        this.leave();
        this.App.mode = 'local';
        this.App.step = 1;
        this.App.screen = 'teams';
      }
    },

    // --- Per frame ---
    tick() {
      if (!this.t) return;
      const err = this.t.error && this.t.error();
      if (err && this.state !== 'playing') { this.state = 'unavailable'; this.err = err; }
      if (this.state === 'hosting') this.tickHost();
      else if (this.state === 'joining') this.tickGuest();
      else if (this.state === 'playing') this.tickGame();
    },

    tickHost() {
      const guest = this.others().find((p) => p.presence.role === 'guest' && p.presence.join === this.me() && p.presence.code === this.code);
      if (!guest) return;
      this.partner = guest.peer;
      const A = this.App, s = A.settings;
      const G = Game.create({
        mode: 'online', home: A.picks[0], away: guest.presence.tm || 'UGA',
        names: [A.names[0], String(guest.presence.nm || 'GUEST').slice(0, 10)],
        settings: { qlen: s.qlen, diff: s.diff, even: s.even },
      });
      this.startGame(G);
    },

    tickGuest() {
      const host = this.others().find((p) => p.peer === this.joinPeer);
      if (!host) return;
      const hp = host.presence;
      if (hp.gp === this.me() && hp.g) {
        this.partner = host.peer;
        const G = { g: JSON.parse(JSON.stringify(hp.g)), rt: null };
        Game.initRuntime(G);
        this.startGame(G);
      }
    },

    startGame(G) {
      this.G = G;
      this.state = 'playing';
      this.partnerSeen = Date.now();
      const A = this.App;
      A.G = G;
      A.mode = 'online';
      A.screen = 'game';
      A.paused = false;
      RB.Render.R.camInit = false;
      RB.UI.invalidate();
      if (this.isAuthority()) Game.takeover(G);
      this.publishGame(true);
    },

    isAuthority() {
      return !!(this.G && this.G.g.ctl === this.seat);
    },
    canControl() { return this.isAuthority(); },

    tickGame() {
      const G = this.G;
      const pp = this.partnerPresence();
      if (pp && pp.g && pp.g.ver > G.g.ver) this.adopt(pp);
      if (pp) this.readPartner(pp);
      this.publishGame(false);
    },

    adopt(pp) {
      const G = this.G;
      const wasAuth = this.isAuthority();
      const prevPhase = G.g.phase;
      G.g = JSON.parse(JSON.stringify(pp.g));
      this.lastAdoptVer = G.g.ver;
      if (!wasAuth && this.isAuthority()) {
        // Possession came to us: build fresh runtime and carry on.
        const keep = G.rt;
        Game.initRuntime(G);
        G.rt.humanDefIdx = keep && keep.humanDefIdx;
        Game.takeover(G);
      } else if (!this.isAuthority()) {
        if (G.g.phase !== prevPhase && G.g.phase === 'presnap') this.lastDcN = -1;
      }
    },

    readPartner(pp) {
      const G = this.G;
      if (this.isAuthority()) {
        // Defense's call, defender pick and requests.
        if (pp.dcn != null && pp.dcn !== this.lastDcN && G.g.phase === 'presnap' && pp.dcp === G.g.playNo) {
          this.lastDcN = pp.dcn;
          Game.act(G, { type: 'defcall', call: pp.dc });
        }
        if (pp.di >= 11 && pp.di <= 21) Game.act(G, { type: 'defplayer', idx: pp.di });
        if (pp.act && pp.act.n !== this.actSeen[this.partner]) {
          this.actSeen[this.partner] = pp.act.n;
          const a = pp.act;
          if (a.type === 'timeout') Game.act(G, { type: 'timeout', seat: 1 - this.seat });
        }
      } else {
        // Snapshots from the authority.
        this.snap = pp.p ? decodePlay(pp.p) : null;
        this.kickSnap = pp.k ? decodeKick(pp.k) : null;
        if (pp.fxn != null && pp.fx) {
          const first = pp.fxn - pp.fx.length + 1;
          if (this.fxSeen < 0) this.fxSeen = pp.fxn;
          for (let n = Math.max(first, this.fxSeen + 1); n <= pp.fxn; n++) {
            const s = pp.fx[n - first];
            if (s === 'td') this.App.cheer = 2.5;
            RB.Audio.play(s);
          }
          this.fxSeen = Math.max(this.fxSeen, pp.fxn);
        }
      }
    },

    onSfx(name) {
      this.fxn++;
      this.fx.push(name);
      if (this.fx.length > 8) this.fx.shift();
    },

    publishGame(force) {
      const now = Date.now();
      if (!force && now - this.lastPub < PUB_MS) return;
      this.lastPub = now;
      const G = this.G;
      const p = this.base();
      p.role = this.role;
      p.code = this.code;
      p.gp = this.role === 'host' ? this.partner : '';
      p.join = this.role === 'guest' ? this.partner : '';
      p.g = compactG(G.g);
      if (this.isAuthority()) {
        const play = G.rt.play;
        p.p = ['presnap', 'play', 'after'].includes(G.g.phase) && play ? encodePlay(play) : null;
        p.k = G.g.phase === 'kick' ? encodeKick(G.rt.kick) : null;
        p.fx = this.fx.slice();
        p.fxn = this.fxn;
      } else {
        const inp = this.App.lastInput;
        const joy = inp && inp.joy && this.G.g.phase === 'play' ? [r2(inp.joy.x), r2(inp.joy.y)] : null;
        Object.assign(p, { dc: this.dc || '', dcn: this.dcN, dcp: this.dcP == null ? -1 : this.dcP, di: this.defIdx, dj: joy, act: this.pending });
      }
      this.t.setPresence(p);
    },

    // Authority: the defense player's joystick for this step.
    remoteInput() {
      const pp = this.partnerPresence();
      if (!pp || !pp.dj) return {};
      return { defJoy: { x: pp.dj[0], y: pp.dj[1] } };
    },

    // Follower requests.
    requestAct(act) {
      if (act.type !== 'timeout') return;
      this.actN++;
      this.pending = { n: this.actN, type: act.type };
    },
    defCall(call) {
      if (!Sim.DEF_CALLS.includes(call)) return;
      this.dc = call;
      this.dcN++;
      this.dcP = this.G.g.playNo;
      this.dcPick = { play: this.G.g.playNo, call };
    },

    inputContext() {
      const g = this.G && this.G.g;
      if (!g) return 'none';
      if (g.phase === 'play' && this.snap && this.snap.live) return 'def';
      if (g.phase === 'presnap') return 'pick';
      return 'none';
    },

    // Tap on a defender before the snap to take control of him.
    pickDefender(world) {
      if (!this.snap) return;
      let best = -1, bd = 4;
      for (const p of this.snap.players) {
        if (p.side !== 1) continue;
        const d = Math.hypot(p.x - world.x, p.y - world.y);
        if (d < bd) { bd = d; best = p.i; }
      }
      if (best >= 11) this.defIdx = best;
    },

    // --- Follower rendering ---
    view(inp) {
      const G = this.G, g = G.g, rt = G.rt;
      if (inp && inp.tapAt && g.phase === 'presnap') this.pickDefender(inp.tapAt);
      const V = {
        g, mode: 'field', teams: [Game.team(G, 0), Game.team(G, 1)], uni: rt.uniforms,
        offSeat: g.poss, defSeat: 1 - g.poss, wx: g.wx, phase: g.phase, cheer: this.App.cheer,
        carrier: -1, ctrl: -1, defCtrl: this.defIdx,
      };
      if (g.phase === 'kick' && this.kickSnap) {
        V.mode = 'kick';
        V.kick = this.kickSnap;
        V.kickUni = rt.uniforms[g.poss];
        return V;
      }
      V.los = C.GOAL_L + g.ballOn;
      V.ballY = g.ballY;
      V.fdX = g.twoPt ? null : C.GOAL_L + Math.min(100, g.ballOn + g.toGo);
      const s = this.snap;
      if (s && ['presnap', 'play', 'after'].includes(g.phase)) {
        const dt = 1 / 60;
